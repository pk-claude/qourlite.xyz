<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#262b30">
<title>Monopoly Remote</title>
<link rel="stylesheet" href="/monopoly/assets/mono.css">
<style>
  .rm { max-width: 480px; margin: 0 auto; padding: 16px; min-height: 100dvh; display: flex; flex-direction: column; gap: 14px; }
  .now { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .now b { display: block; font-size: 1.5rem; margin: 4px 0; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
  .facts div { background: var(--panel); border-radius: 12px; padding: 10px 4px; }
  .facts b { display: block; font-family: var(--mono); font-size: 1.7rem; }
  .facts span { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .big { flex: 1; min-height: 180px; font-size: 2.4rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 button { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; font-size: 1.1rem; cursor: pointer; }
  #pinBox input { text-align: center; font-size: 2rem; letter-spacing: .4em; }
</style>
</head>
<body class="phone">
<div class="rm">
  <div class="top"><div class="me"><span class="conn" id="conn"></span><span>Monopoly Remote</span></div><span class="muted small" id="age"></span></div>

  <div id="pinBox" class="bidbox">
    <label for="pin">PIN from the game Menu (press G on the big screen)</label>
    <input type="text" id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
    <button class="go gold" id="pinGo">Connect</button>
  </div>

  <div id="ctl" class="hidden" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <div class="now"><span class="kicker">On screen now</span><b id="lbl">Waiting for the game...</b><span class="muted">Next: <span id="nx"></span></span></div>
    <div class="facts"><div><b id="nP">0</b><span>Players</span></div><div><b id="nA">-</b><span>Answered</span></div><div><b id="tL">-</b><span>Seconds left</span></div></div>
    <button class="go big" id="next">Next &#9654;</button>
    <div class="row2"><button id="prev">&#9664; Back</button><button id="time">+10 seconds</button></div>
    <p class="muted small center" id="msg">Taps go to the big screen through the live relays. Each tap moves one step.</p>
    <button class="linkish" id="forget">Change PIN</button>
  </div>
</div>
<script>window.LIVE_ROOM = 'mono-allhands';</script>
<script src="/q2/vendor/mqtt-5.10.1.min.js"></script>
<script src="/q2/assets/fx.js"></script>
<script src="/q2/assets/live.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const store = Live.store;
  const RID = 'rm-' + Live.rid(5);
  let pin = store.get('mono-pin', ''), S = null, sentFor = -1;
  const live = Live.create({
    room: Live.room, role: 'player',
    onMsg: (k, m) => {
      if (k !== 'state' || m._old || !m.hid || m._stale) return;
      if (S && m.hid === S.hid && m.t < S.t) return;
      S = m; if (S.q && S.q.left != null) S._deadline = Date.now() + S.q.left * 1000;
      render();
    },
    onStatus: st => { $('conn').className = 'conn ' + (Object.values(st).includes('up') ? 'up' : ''); },
  });
  function render() {
    $('pinBox').classList.toggle('hidden', !!pin);
    $('ctl').classList.toggle('hidden', !pin);
    if (!S) return;
    $('lbl').textContent = S.lbl || S.ph;
    $('nx').textContent = S.nx || 'end of game';
    $('nP').textContent = S.n;
    $('nA').textContent = S.na != null ? S.na : '-';
    // the button stays busy until the big screen confirms it moved
    if (sentFor !== -1 && sentFor !== S.pos) { sentFor = -1; $('msg').textContent = 'Done. Each tap moves one step.'; }
    $('next').disabled = sentFor === S.pos;
  }
  setInterval(() => {
    if (!S) return;
    const left = S._deadline && S.q && S.q.open ? Math.max(0, Math.ceil((S._deadline - Date.now()) / 1000)) : null;
    $('tL').textContent = left == null ? '-' : left;
    $('age').textContent = 'updated ' + Math.round((Date.now() - S.t) / 1000) + 's ago';
  }, 500);
  function cmd(a) {
    if (!S) { $('msg').textContent = 'No big screen yet. Open qourlite.xyz/monopoly on the presenter laptop.'; return; }
    live.publishUp({ k: 'ctl', p: RID, a, at: S.pos, pin });
    if (a !== 'time') { sentFor = S.pos; render(); setTimeout(() => { if (sentFor === S.pos) { sentFor = -1; render(); $('msg').textContent = 'No response from the big screen. Check the PIN, then tap again.'; } }, 6000); }
    if (navigator.vibrate) navigator.vibrate(25);
  }
  $('next').onclick = () => cmd('next');
  $('prev').onclick = () => cmd('prev');
  $('time').onclick = () => cmd('time');
  $('pinGo').onclick = () => { pin = $('pin').value.replace(/\D/g, '').slice(0, 4); store.set('mono-pin', pin); render(); };
  $('forget').onclick = () => { pin = ''; store.set('mono-pin', ''); render(); };
  render();
})();
</script>
</body>
</html>
