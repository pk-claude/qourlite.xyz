<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F96302">
<title>WFO All Hands: Live</title>
<style>
  :root { --or: #F96302; --ink: #1d1d1f; --mut: #6b6b70; --line: #e4e4e7; --bg: #f6f6f7; --card: #fff; --ok: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--or); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  header b { font-size: 1.05rem; letter-spacing: .02em; }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; }
  .dot i { width: 9px; height: 9px; border-radius: 50%; background: #fde68a; }
  .dot.up i { background: #bbf7d0; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .dot.down i { background: #fecaca; }
  .flag { height: 8px; background: repeating-conic-gradient(#1d1d1f 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
  .opt .rc { flex: none; width: 44px; position: relative; } .opt .rc svg { width: 100%; height: auto; display: block; }
  .place { font-size: .72rem; font-weight: 800; color: var(--or); position: relative; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .kick { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--or); margin: 0 0 6px; }
  h1 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 6px; }
  h2 { font-size: 1.05rem; line-height: 1.3; margin: 18px 0 8px; }
  h2:first-of-type { margin-top: 10px; }
  .sub { color: var(--mut); font-size: .9rem; line-height: 1.4; margin: 0; }
  .opts { display: grid; gap: 8px; }
  .opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font: inherit; font-size: 1rem; font-weight: 700; text-align: left; cursor: pointer; }
  .opt .ltr { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #f1f1f3; color: var(--ink); font-size: .85rem; position: relative; }
  .opt .txt { position: relative; flex: 1; }
  .opt .pct { position: relative; font-size: .85rem; color: var(--mut); font-weight: 700; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: rgba(249,99,2,.10); transition: width .5s; }
  .opt.sel { border-color: var(--or); }
  .opt.sel .ltr { background: var(--or); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .85rem; font-weight: 700; color: var(--ink); cursor: pointer; }
  .chip.sel { background: var(--or); border-color: var(--or); color: #fff; }
  textarea { width: 100%; min-height: 110px; padding: 12px; font: inherit; font-size: 1rem; line-height: 1.4; border: 2px solid var(--line); border-radius: 12px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--or); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .count { color: var(--mut); font-size: .85rem; }
  .go { border: 0; border-radius: 12px; background: var(--or); color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 13px 20px; cursor: pointer; }
  .go:disabled { opacity: .45; }
  .mine { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .mine li { background: #fff7f0; border: 1px solid #fed7aa; border-radius: 12px; padding: 10px 12px; font-size: .95rem; line-height: 1.35; }
  .mine li small { display: flex; justify-content: space-between; margin-top: 6px; color: var(--mut); }
  .linkish { background: none; border: 0; padding: 0; color: var(--mut); text-decoration: underline; font: inherit; font-size: .85rem; cursor: pointer; }
  .saved { margin-top: 12px; font-size: .85rem; font-weight: 700; color: var(--mut); }
  .saved.ok { color: var(--ok); }
  .idle { text-align: center; padding: 34px 18px; }
  .idle .big { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px; }
  .pulse { width: 14px; height: 14px; margin: 0 auto 16px; border-radius: 50%; background: var(--or); animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 50% { transform: scale(1.6); opacity: .35; } }
  .film { background: #111; color: #fff; border: 0; text-align: center; padding: 40px 18px; }
  .film .big { font-size: 1.35rem; font-weight: 700; }
  .pres { display: inline-block; margin-top: 12px; color: var(--mut); font-weight: 700; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; text-decoration: none; }
  footer { text-align: center; color: var(--mut); font-size: .78rem; padding: 0 16px 30px; line-height: 1.4; }
</style>
</head>
<body>
<header><b>WFO All Hands <span style="font-weight:400;opacity:.9">| Race to Peak</span></b><span class="dot" id="conn"><i></i><span id="connT">Connecting</span></span></header>
<div class="flag"></div>
<main id="main"></main>
<footer>No sign-in and no name. Votes and answers go only to the presenter screen in this meeting.<br><a class="pres" href="/wfo/host.html">Presenter screen</a></footer>
<script src="/wfo/program.js"></script>
<script>window.LIVE_ROOM = WFO.room;</script>
<script src="/q2/vendor/mqtt-5.10.1.min.js"></script>
<script src="/q2/assets/live.js"></script>
<script src="/wfo/racers.js"></script>
<script src="/wfo/phone.js"></script>
</body>
</html>
