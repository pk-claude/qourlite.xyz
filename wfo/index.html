<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c0f">
<title>WFO All Hands: Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
  :root { --or: #F96302; --red: #e10600; --tx: #f3f4f6; --mut: #9aa1ad; --line: #2c313b; --bg: #0f1114; --card: #171a1f; --ok: #4ade80; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Titillium Web', Arial, sans-serif; color: var(--tx); -webkit-text-size-adjust: 100%;
    background: radial-gradient(600px 300px at 50% -80px, rgba(249,99,3,.25), transparent 70%), repeating-linear-gradient(45deg, #13161a 0 5px, #0f1114 5px 10px); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 5; background: linear-gradient(90deg, #0b0c0f, #1a1d23); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--or); }
  .logo { font-weight: 900; font-style: italic; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; transform: skewX(-6deg); }
  .logo em { color: var(--or); } .logo i { width: 18px; height: 18px; background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 9px 9px; border-radius: 2px; }
  .dot { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .dot i { width: 9px; height: 9px; border-radius: 50%; background: #facc15; }
  .dot.up i { background: var(--red); box-shadow: 0 0 0 3px rgba(225,6,0,.3); animation: lv 1.4s infinite; } @keyframes lv { 50% { opacity: .4; } }
  .dot.down i { background: #6b7280; }
  .flag { display: none; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 50px; display: grid; gap: 16px; }
  .card { background: linear-gradient(180deg, #1b1e24, #14171b); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .kick { font-size: .72rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--or); margin: 0 0 4px; }
  h1 { font-size: 1.45rem; line-height: 1.15; margin: 0 0 6px; font-weight: 900; font-style: italic; text-transform: uppercase; }
  h2 { font-size: 1.08rem; line-height: 1.3; margin: 18px 0 8px; font-weight: 700; }
  h2 .rn { display: inline-block; background: var(--or); color: #fff; font-style: italic; font-weight: 900; font-size: .7rem; letter-spacing: .1em; padding: 1px 7px; margin-right: 6px; transform: skewX(-10deg); vertical-align: 2px; }
  .sub { color: var(--mut); font-size: .92rem; line-height: 1.4; margin: 0; }
  .opts { display: grid; gap: 8px; }
  .opt { --c: var(--or); position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; padding: 8px 10px 8px 0; border: 1px solid var(--line); border-radius: 10px; background: #1f232a; color: var(--tx); font: inherit; font-size: 1.02rem; font-weight: 700; text-align: left; cursor: pointer; transition: transform .1s; }
  .opt:active { transform: scale(.98); }
  .opt .ltr { flex: none; align-self: stretch; width: 34px; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 900; font-style: italic; font-size: 1rem; position: relative; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .opt .txt { position: relative; flex: 1; line-height: 1.2; }
  .opt .pct { position: relative; font-size: .9rem; color: var(--mut); font-weight: 900; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 30%, transparent)); transition: width .8s cubic-bezier(.2,.9,.3,1.1); }
  .opt .rc { flex: none; width: 58px; position: relative; } .opt .rc svg { width: 100%; height: auto; display: block; }
  .opt.sel { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 0 22px color-mix(in srgb, var(--c) 45%, transparent); }
  .place { display: block; font-size: .74rem; font-weight: 900; color: #ffcf3f; letter-spacing: .02em; }
  .boostrow { display: none; margin-top: 10px; }
  .boostrow.on { display: flex; gap: 10px; align-items: center; }
  .boost { flex: 1; position: relative; overflow: hidden; border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 900; font-style: italic; font-size: 1.15rem; letter-spacing: .08em; color: #fff; cursor: pointer;
    background: linear-gradient(90deg, #ff3d00, var(--or) 50%, #ffb000); box-shadow: 0 6px 22px rgba(249,99,3,.45); text-transform: uppercase; }
  .boost::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.55); transform-origin: left; transform: scaleX(0); }
  .boost.cool::after { animation: cool 2.5s linear forwards; } @keyframes cool { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .boost.fire { animation: kick .4s ease-out; } @keyframes kick { 30% { transform: scale(1.06) rotate(-1deg); } }
  .bcount { font-size: .78rem; color: var(--mut); font-weight: 700; min-width: 70px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
  .chip { border: 1px solid var(--line); background: #1f232a; border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .88rem; font-weight: 700; color: var(--tx); cursor: pointer; }
  .chip.sel { background: var(--or); border-color: var(--or); color: #fff; }
  textarea { width: 100%; min-height: 110px; padding: 12px; font: inherit; font-size: 1.02rem; line-height: 1.4; border: 1px solid var(--line); border-radius: 10px; resize: vertical; background: #0e1013; color: var(--tx); }
  textarea:focus { outline: none; border-color: var(--or); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .count { color: var(--mut); font-size: .85rem; }
  .go { border: 0; border-radius: 10px; background: var(--or); color: #fff; font: inherit; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: .06em; font-size: 1.05rem; padding: 12px 22px; cursor: pointer; }
  .go:disabled { opacity: .4; }
  .mine { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .mine li { background: rgba(249,99,3,.1); border: 1px solid rgba(249,99,3,.35); border-radius: 10px; padding: 10px 12px; font-size: .95rem; line-height: 1.35; }
  .mine li small { display: flex; justify-content: space-between; margin-top: 6px; color: var(--mut); }
  .linkish { background: none; border: 0; padding: 0; color: var(--mut); text-decoration: underline; font: inherit; font-size: .85rem; cursor: pointer; }
  .saved { margin-top: 12px; font-size: .85rem; font-weight: 700; color: var(--mut); }
  .saved.ok { color: var(--ok); }
  .idle { text-align: center; padding: 34px 18px; }
  .idle .big { font-size: 1.35rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin: 0 0 8px; }
  .lights { display: flex; gap: 10px; justify-content: center; margin: 0 auto 18px; }
  .lights i { width: 22px; height: 22px; border-radius: 50%; background: #2a0000; box-shadow: inset 0 0 0 2px #3a0a0a; animation: lt 5s infinite; }
  .lights i:nth-child(2) { animation-delay: .5s; } .lights i:nth-child(3) { animation-delay: 1s; } .lights i:nth-child(4) { animation-delay: 1.5s; } .lights i:nth-child(5) { animation-delay: 2s; }
  @keyframes lt { 0%, 8% { background: #2a0000; } 10%, 60% { background: var(--red); box-shadow: 0 0 14px var(--red); } 62%, 100% { background: #2a0000; } }
  .film { background: #000; text-align: center; padding: 40px 18px; }
  .film .big { font-size: 1.35rem; font-weight: 900; }
  .pres { display: inline-block; margin-top: 12px; color: var(--mut); font-weight: 700; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; text-decoration: none; }
  footer { text-align: center; color: var(--mut); font-size: .8rem; padding: 0 16px 30px; line-height: 1.4; }
</style>
</head>
<body>
<header><span class="logo"><i></i>RACE <em>TO</em> PEAK</span><span class="dot" id="conn"><i></i><span id="connT">Connecting</span></span></header>
<div class="flag"></div>
<main id="main"></main>
<footer>No sign-in and no name. Votes and answers go only to the presenter screen in this meeting.<br><a class="pres" href="/wfo/host.html">Presenter screen</a></footer>

<script src="/wfo/racers.js"></script>
<script src="/wfo/phone.js"></script>
</body>
</html>
