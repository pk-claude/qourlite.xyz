<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1d14">
<title>Play Monopoly: All-Hands Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Lilita+One&family=Oswald:wght@500;600;700&family=Roboto+Slab:ital,wght@0,700;0,800;1,800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/monopoly/assets/mono.css">
</head>
<body class="phone">
<div class="app">
  <div class="top">
    <div class="me"><span class="conn" id="conn" title="Connection"></span><span class="av" id="meAv"></span><span class="nm" id="meNm">Monopoly</span></div>
    <div class="wallet"><span class="bill" id="meCash">$500</span></div>
  </div>

  <!-- join -->
  <section class="screen" id="sJoin">
    <div class="logo" style="font-size:42px;align-self:center;transform:rotate(-4deg);margin:8px 0 6px"><span class="logo-bar">MONOPOLY</span><span class="logo-sub" style="color:var(--gold)">All-Hands · November 2026</span></div>
    <label for="nm">Your name (or a tycoon name)</label>
    <div class="row"><input type="text" id="nm" maxlength="18" autocomplete="off" placeholder="e.g. Rich Uncle Pete"><button class="sq" id="dice" aria-label="Random name">🎲</button></div>
    <label>Pick your token</label>
    <div class="toks" id="toks"></div>
    <button class="go" id="goBtn">Collect $500 and get your 5 DCs</button>
    <p class="muted center small">No login, no app. Only your name, token and answers are shared, and only with this game.</p>
  </section>

  <!-- my DCs -->
  <section class="screen" id="sDeed">
    <div class="deed-wrap" id="myDeed"></div>
  </section>

  <!-- waiting -->
  <section class="screen" id="sWait">
    <div class="wait"><div class="bigav" id="wAv"></div><h2 id="wHead"></h2><p class="muted" id="wSub"></p><div id="wExtra" style="display:flex;flex-direction:column;align-items:center;gap:8px"></div><button class="linkish" id="editMe">Change name or token</button></div>
  </section>

  <!-- question -->
  <section class="screen" id="sQ">
    <div class="ptag" id="qTag"></div>
    <div class="own-banner hidden" id="qOwn">You own this property: double rent if you get it right!</div>
    <div class="qtext" id="qText"></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="answers" id="answers"></div>
  </section>

  <!-- locked -->
  <section class="screen" id="sLocked">
    <div class="wait"><p class="muted">Locked in</p><div class="bigav" id="lockL" style="font-family:var(--disp);color:var(--gold)">B</div><h2 id="lockT"></h2><p id="lockAck" class="muted">Sending...</p></div>
  </section>

  <!-- result -->
  <section class="screen" id="sResult"><div class="result" id="res"></div></section>

  <!-- rank -->
  <section class="screen" id="sRank"><div class="bigrank"><p class="muted" id="rkLead"></p><div class="rk" id="rkN"></div><h2 id="rkOf"></h2><p class="muted" id="rkLine"></p></div></section>

</div>

<div class="dock" id="dock"><div class="dock-in">
  <div class="reacts" id="reacts"></div>
  <div class="tabs"><button class="on" id="tabPlay">Play</button><button id="tabDeed">My DCs</button></div>
</div></div>

<script>window.LIVE_ROOM = 'mono-allhands';</script>
<script src="/q2/vendor/mqtt-5.10.1.min.js"></script>
<script src="/q2/assets/fx.js"></script>
<script src="/q2/assets/live.js"></script>
<script src="/monopoly/assets/program.js"></script>
<script src="/monopoly/assets/play.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
