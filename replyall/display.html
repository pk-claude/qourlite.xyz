<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>REPLY ALL - Audience screen</title>
<link href="vendor/fonts.css" rel="stylesheet">
<style>
/* REPLY ALL big screen, Winter Fest edition. The premise: the company spent the whole Q4 budget on its Winter Fest, so the
   game is produced like a prime-time holiday special: forest green, string lights, snow, chalkboard signs, an orange heart or two. Everything is laid out in a 16:9 box (body is a size container); every length is cqw/cqh of that box. */
:root{--night:#04140c;--ink:#0b0b10;--paper:#f6f1e6;--gold:#ffc93c;--ta:#ff7a1a;--tb:#a9dcff;--red:#ff3b30;--green:#3dff8f;--violet:#4fae7a;
  --disp:"Big Shoulders","Arial Narrow",Impact,sans-serif;--head:"Bricolage","Archivo Black","Arial Black",sans-serif;--body:"Bricolage","Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;--script:"Kaushan Script","Segoe Script",cursive;--chalk:"Caveat","Segoe Print",cursive;--orange:#f96302;--cream:#f3e9d2;
  --goldtx:linear-gradient(180deg,#fffbea 0%,#ffe391 28%,#f4b632 50%,#ffe7a0 62%,#d4901a 84%,#a86708 100%)}
*{box-sizing:border-box}
html{height:100%;margin:0;overflow:hidden;background:radial-gradient(70vh 90vh at 50% 60%,rgba(79,174,122,.16),transparent 70%),#020205}
body{position:relative;width:min(100vw,177.78vh);height:100vh;margin:0 auto;container-type:size;contain:layout paint;background:var(--night);color:#fff;font-family:var(--body);overflow:hidden;box-shadow:0 0 6vh 1vh rgba(0,0,0,.8)}
#stagebg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
body.nogl{background:radial-gradient(70cqw 60cqh at 20% -10%,rgba(255,122,26,.25),transparent 70%),radial-gradient(70cqw 60cqh at 80% -10%,rgba(169,220,255,.25),transparent 70%),linear-gradient(180deg,#08241a,#04140c)}
body.nogl #stagebg{display:none}
#stage{position:absolute;inset:0;z-index:2}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#over{position:absolute;inset:0;z-index:7;pointer-events:none}
/* wow: lead change band */
.flip{position:absolute;left:-4cqw;right:-4cqw;top:36cqh;z-index:12;padding:2.4cqh 0 0;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(4,18,11,.96),rgba(10,40,26,.96));border-top:.5cqh solid var(--c);border-bottom:.5cqh solid var(--c);box-shadow:0 0 8cqw color-mix(in srgb,var(--c) 60%,transparent);transform:skewY(-3deg);animation:flipin 4.2s cubic-bezier(.2,.9,.3,1) forwards}
.flip .fk{font:800 1.2cqw var(--mono);letter-spacing:.4em;text-transform:uppercase;color:var(--c)}
.flip .fh{font:900 4cqh/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:#fff;margin-top:1cqh}
.flip .fn{font:900 12cqh/1 var(--disp);text-transform:uppercase;color:var(--c);text-shadow:0 0 4cqw color-mix(in srgb,var(--c) 70%,transparent);animation:pump .6s .5s 2}
.flip .ft{margin-top:1.6cqh;padding:1cqh 0;background:var(--c);color:#04120b;overflow:hidden;white-space:nowrap;font:800 1.6cqw var(--mono);letter-spacing:.1em;text-transform:uppercase}
.flip .ft span{display:inline-block;animation:tickr 4.2s linear}
@keyframes flipin{0%{transform:skewY(-3deg) translateX(-110%)}12%,85%{transform:skewY(-3deg) translateX(0)}100%{transform:skewY(-3deg) translateX(110%)}}
@keyframes tickr{to{transform:translateX(-50%)}}
/* wow: steal in progress, the whole stage goes on alert */
body.steal #stage:after{content:"";position:absolute;inset:.6cqw;border:.35cqw solid #ff3b30;border-radius:1.4cqw;box-shadow:inset 0 0 5cqw rgba(255,59,48,.45),0 0 4cqw rgba(255,59,48,.6);pointer-events:none;z-index:6;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{opacity:.35}}
/* wow: last ten seconds of the final, the edges close in */
body.crunch:after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(213,22,12,.55));animation:alarm .5s ease-in-out infinite}
body.crunch .rush .dig{animation:pump .5s infinite}
#cards{position:absolute;inset:0;z-index:9;pointer-events:none}
#joinbox{position:absolute;inset:0;z-index:10;pointer-events:none}
.mono{font-family:var(--mono);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.gt{background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{position:absolute;right:1.2cqw;bottom:1cqh;z-index:11;font:500 1cqw var(--mono);color:rgba(255,255,255,.4);transition:opacity 1s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sub0{font:800 2.4cqw var(--head);color:rgba(255,255,255,.6)}
@keyframes fin{from{opacity:0}}
@keyframes up8{from{opacity:0;transform:translateY(6cqh)}}
#stage.in>*{animation:fin .5s ease-out backwards}

/* ---------- glass panels and shared bits ---------- */
.glass{background:linear-gradient(180deg,rgba(16,52,36,.82),rgba(4,20,12,.88));border:.1cqw solid rgba(255,255,255,.14);box-shadow:inset 0 .15cqh 0 rgba(255,255,255,.1),0 2cqh 5cqw rgba(0,0,0,.5);border-radius:1.2cqw}
.qr{background:#fff;padding:.7cqw;border-radius:.8cqw;line-height:0}
.qr svg{width:100%;height:100%;display:block}
.qr svg rect[fill="#ffffff"]{fill:#fff}

/* ---------- title: cold open, logo, visitor badge, pre-show lobby ---------- */
.ttl{position:absolute;inset:0}
.hero{position:absolute;left:0;right:0;top:6cqh;display:flex;flex-direction:column;align-items:center;transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity .8s}
.thread{font:800 1.5cqw var(--mono);letter-spacing:.3em;color:var(--ta);padding:.9cqh 1.8cqw;border:.12cqw solid rgba(255,122,26,.5);border-radius:3cqw;background:rgba(5,20,24,.6);display:flex;align-items:center;gap:1cqw}
.thread i{width:.8cqw;height:.8cqw;border-radius:50%;background:var(--tb);box-shadow:0 0 1cqw var(--tb);animation:blinkd 1.2s steps(1) infinite}
@keyframes blinkd{50%{opacity:.2}}
.logo{position:relative;margin-top:1.4cqh;font:900 25cqh/0.86 var(--disp);letter-spacing:-.01em;white-space:nowrap;text-transform:uppercase}
.logo b{display:block;position:relative;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .5cqh 0 #7a4600) drop-shadow(0 .9cqh 0 #3d2300) drop-shadow(0 2.4cqh 3cqw rgba(0,0,0,.7))}
.logo i{position:absolute;inset:0;font-style:normal;color:transparent;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 48%,transparent 56%) -60cqw 0/60cqw 100% no-repeat;-webkit-background-clip:text;background-clip:text;animation:shine 5.5s 2.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:-60cqw 0}35%,100%{background-position:110cqw 0}}
.badge{position:absolute;right:-7.4cqw;top:-3.4cqh;font:900 3.4cqw/1 var(--disp);color:#fff;background:linear-gradient(180deg,#ff5a4f,#d5160c);padding:.9cqh 1.3cqw .7cqh;border-radius:2.4cqw;border:.25cqw solid #fff;box-shadow:0 1cqh 2cqw rgba(0,0,0,.5),0 0 3cqw rgba(255,59,48,.6);transform:rotate(8deg);font-variant-numeric:tabular-nums}
.tsub{margin-top:2.4cqh;font:800 3cqw var(--head);color:#fff;text-shadow:0 .4cqh 2cqw rgba(0,0,0,.7)}
.ttag{margin-top:1.4cqh;font:800 1.3cqw var(--mono);letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.vs{margin-top:3cqh;display:flex;align-items:center;gap:2.2cqw;font:900 3.6cqw var(--disp);text-transform:uppercase;letter-spacing:.02em}
.vs span:first-child{color:var(--ta);text-shadow:0 0 2.4cqw rgba(255,122,26,.6)}.vs span:last-child{color:var(--tb);text-shadow:0 0 2.4cqw rgba(169,220,255,.6)}
.vs em{font-style:normal;font-size:.6em;width:2.2em;height:2.2em;display:grid;place-items:center;border-radius:50%;background:var(--goldtx);color:#2b1800;box-shadow:0 0 2cqw rgba(255,201,60,.6)}
.pass{position:absolute;left:50%;bottom:4cqh;transform:translateX(-50%);display:flex;align-items:center;gap:2cqw;padding:1.6cqh 2.4cqw 1.6cqh 1.6cqh;border-radius:1.4cqw;background:linear-gradient(180deg,#fdf9ef,#eae2cf);color:var(--ink);box-shadow:0 2cqh 5cqw rgba(0,0,0,.6);transition:all 1.1s cubic-bezier(.7,0,.2,1)}
.pass:before{content:"";position:absolute;left:50%;top:-6cqh;width:2.4cqw;height:6.4cqh;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#c4500a 0 .4cqw,#a9dcff .4cqw .8cqw);border-radius:.3cqw .3cqw 0 0;z-index:-1}
.pass:after{content:"";position:absolute;left:50%;top:1cqh;width:3cqw;height:.8cqh;transform:translateX(-50%);border-radius:1cqw;background:#c9bea6}
.pass .qr{width:15cqh;height:15cqh;padding:.6cqw;margin-top:1.4cqh}
.pass .pt{text-align:left;margin-top:1.4cqh}
.pass .pl{text-transform:uppercase;font:800 1cqw var(--mono);letter-spacing:.24em;color:#9a2a52}
.pass .ph{font:800 2.4cqw/1.05 var(--head);margin:.4cqh 0 .8cqh}
.pass .pu{font:800 1.5cqw var(--mono);letter-spacing:.02em;color:#3a2f1a}
.pass .pc{font:500 1.5cqw var(--body);margin-top:.4cqh}.pass .pc b{font:900 3.2cqw var(--disp);letter-spacing:.12em;color:#d5160c;vertical-align:-.2cqh}
/* the storm: mail toasts pour in from every edge until the logo blows them away */
.storm{position:absolute;inset:0;pointer-events:none}
.ml{position:absolute;display:flex;align-items:center;gap:.8cqw;padding:1cqh 1.3cqw;min-width:19cqw;border-radius:.9cqw;background:rgba(24,20,48,.92);border:.1cqw solid rgba(255,255,255,.16);border-left:.35cqw solid currentColor;box-shadow:0 1.4cqh 3cqw rgba(0,0,0,.5);transform:rotate(var(--r));animation:mlin .45s cubic-bezier(.2,.9,.3,1.2) backwards}
.ml svg{width:2.2cqw;flex:none;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linejoin:round}
.ml b{display:block;font:800 .85cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:currentColor}
.ml span{display:block;font:800 1.35cqw var(--head);color:#fff;white-space:nowrap}
.ml.out{animation:mlout .7s cubic-bezier(.5,0,.8,.4) forwards}
.ml.idle{opacity:.33;transition:opacity 1s}
@keyframes mlin{from{transform:translate(var(--fx),var(--fy)) rotate(var(--r)) scale(.7);opacity:0}}
@keyframes mlout{to{transform:translate(var(--ox),var(--oy)) rotate(calc(var(--r)*6)) scale(1.4);opacity:0}}
.cnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 22cqh/1 var(--disp);color:#fff;text-shadow:0 0 4cqw rgba(255,59,48,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt small{display:block;font:800 1.6cqw var(--mono);letter-spacing:.4em;color:var(--red);text-shadow:none;margin-top:1cqh}
.ttl.cold .hero,.ttl.cold .pass{opacity:0}
.ttl.slam .hero{animation:slam .55s cubic-bezier(.2,.9,.3,1) backwards}
.ttl.slam .pass{animation:up8 .8s .5s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes slam{from{transform:scale(2.6);opacity:0;filter:blur(1.4cqw)}60%{opacity:1;filter:none}}
.shake{animation:shake .5s}
@keyframes shake{15%{transform:translate(-1cqw,.6cqh) rotate(-.4deg)}30%{transform:translate(.9cqw,-.7cqh) rotate(.4deg)}45%{transform:translate(-.6cqw,.4cqh)}60%{transform:translate(.4cqw,-.3cqh)}80%{transform:translate(-.2cqw,.2cqh)}}
/* lobby: the hero steps to the left, an LED screen of pre-show segments takes the right */
.ttl.lob .hero{transform:translate(-25.6cqw,4cqh) scale(.5)}
.ttl.lob .pass{left:25cqw;bottom:5cqh;transform:translateX(-50%) scale(.92)}
.ttl.lob .vs,.ttl.lob .ttag,.ttl.lob .storm{opacity:0;transition:opacity .4s}
.led{position:absolute;left:51cqw;top:8cqh;width:46cqw;height:84cqh;padding:3cqh 2.6cqw;opacity:0;transform:translateX(8cqw);transition:all .9s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column}
.ttl.lob .led{opacity:1;transform:none}
.led .lbar{text-transform:uppercase;display:flex;justify-content:space-between;font:800 1cqw var(--mono);letter-spacing:.24em;color:var(--gold);padding-bottom:1.4cqh;border-bottom:.1cqw solid rgba(255,255,255,.12)}
.led .lbar em{font-style:normal;color:var(--tb)}
.led .lbody{flex:1;position:relative;margin-top:2cqh}
.seg{position:absolute;inset:0;animation:segin .7s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes segin{from{opacity:0;transform:translateY(3cqh)}}
.seg h2{margin:0 0 3cqh;font:900 6.6cqh/1 var(--disp);text-transform:uppercase}
.seg .k{text-transform:uppercase;font:800 1cqw var(--mono);letter-spacing:.3em;color:var(--ta);margin-bottom:1.4cqh}
.ag li{list-style:none;display:flex;align-items:center;gap:1.4cqw;padding:1.8cqh 0;border-bottom:.1cqw dashed rgba(255,255,255,.14);font:800 2.2cqw var(--head)}
.ag{padding:0;margin:0}
.ag li i{width:3cqw;height:3cqw;border-radius:.6cqw;border:.2cqw solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none}
.ag li i svg{width:70%;stroke:var(--ink);stroke-width:5;fill:none;stroke-dasharray:50;stroke-dashoffset:50}
.ag li.ok i{background:var(--green);border-color:var(--green)}.ag li.ok i svg{stroke-dashoffset:0;transition:stroke-dashoffset .4s .1s}
.ag li small{font:500 1.4cqw var(--body);color:rgba(255,255,255,.55);margin-left:.6cqw}
.ag li u{margin-left:auto;text-decoration:none;font:800 .9cqw var(--mono);letter-spacing:.14em;padding:.6cqh .8cqw;border-radius:.4cqw;background:rgba(255,201,60,.14);color:var(--gold);opacity:0}
.ag li.pend u{opacity:1;animation:fin .3s}
.foot{position:absolute;left:0;right:0;bottom:0;font:800 1.6cqw var(--head);color:var(--tb);opacity:0;transition:opacity .5s}.foot.on{opacity:1}
.poll .pr{margin-bottom:2.6cqh}.poll .pr span{display:flex;justify-content:space-between;font:800 1.9cqw var(--head);margin-bottom:.8cqh}
.poll .pr u{display:block;height:3cqh;border-radius:2cqh;background:rgba(255,255,255,.08);overflow:hidden}
.poll .pr u i{display:block;height:100%;width:calc(var(--p)*100%);background:linear-gradient(90deg,var(--ta),var(--gold));border-radius:2cqh;transform-origin:left;animation:grow 1.2s var(--dl) cubic-bezier(.2,.9,.3,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.fact{font:800 4.4cqw/1.12 var(--head)}
.fact:before{content:"\201C";display:block;font:900 14cqh/0.6 var(--disp);color:var(--gold)}
.joinl div{display:flex;align-items:center;gap:1.2cqw;padding:1.5cqh 0;font:800 2cqw var(--head);border-bottom:.1cqw solid rgba(255,255,255,.08);animation:segin .5s backwards}
.joinl div i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--green);box-shadow:0 0 1cqw var(--green);flex:none}
.joinl div span{font:500 1.6cqw var(--body);color:rgba(255,255,255,.6)}
.rules li{list-style:none;display:flex;gap:1.6cqw;align-items:flex-start;margin-bottom:3.4cqh;font:800 2.1cqw/1.15 var(--head)}
.rules{padding:0;margin:0}
.rules li b{flex:none;width:4.4cqw;height:4.4cqw;border-radius:50%;display:grid;place-items:center;font:900 2.6cqw var(--disp);background:var(--goldtx);color:#2b1800}
.rules li small{display:block;font:500 1.5cqw/1.3 var(--body);color:rgba(255,255,255,.65);margin-top:.6cqh}
.mkt{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw}
.mkt>div{padding:2.4cqh 1.6cqw;border-radius:1cqw;background:rgba(255,255,255,.05);border-top:.4cqh solid var(--c)}
.mkt b{display:block;font:900 5cqw var(--disp);color:var(--c)}.mkt span{font:800 1.5cqw var(--head)}.mkt em{display:block;font:800 1.1cqw var(--mono);font-style:normal;color:rgba(255,255,255,.5);margin-top:1cqh;letter-spacing:.1em}
.mktn{margin-top:4cqh;font:800 2cqw/1.3 var(--head);color:rgba(255,255,255,.8)}

/* ---------- the round: HUD, subject line, the classified board ---------- */
.hud{position:absolute;left:2cqw;right:2cqw;top:2.4cqh;height:17cqh;display:grid;grid-template-columns:1fr 29cqw 1fr;gap:1.4cqw}
.tk{position:relative;border-radius:1.2cqw;padding:1.6cqh 1.6cqw;overflow:hidden;background:linear-gradient(180deg,rgba(16,52,36,.85),rgba(4,18,11,.9));border:.14cqw solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 2cqh 4cqw rgba(0,0,0,.5);transition:box-shadow .4s,border-color .4s,transform .4s}
.tk.t0{--c:var(--ta)}.tk.t1{--c:var(--tb);text-align:right}
.tk .sym{display:flex;align-items:center;gap:.8cqw;font:800 1.05cqw var(--mono);letter-spacing:.22em;color:var(--c)}.tk.t1 .sym{justify-content:flex-end}.tk.t1 .flr{order:-1}
.tk .tnm{font:800 2.1cqw/1.05 var(--head);margin-top:.5cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20cqw}
.tk.t1 .tnm{margin-left:auto}
.tk .tsc{position:absolute;top:1cqh;font:900 11.4cqh/1 var(--disp);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 2cqw color-mix(in srgb,var(--c) 60%,transparent)}
.tk.t0 .tsc{right:1.8cqw}.tk.t1 .tsc{left:1.8cqw}
.tk .dl{position:absolute;bottom:1.4cqh;font:800 1.2cqw var(--mono);letter-spacing:.06em;color:rgba(255,255,255,.4)}
.tk.t0 .dl{left:1.6cqw}.tk.t1 .dl{right:1.6cqw}
.tk .dl.upd{color:var(--green);text-shadow:0 0 1cqw rgba(61,255,143,.6)}
.tk .spk{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;opacity:.5}
.tk .spk polyline{fill:none;stroke:var(--c);stroke-width:1.4;vector-effect:non-scaling-stroke}
.tk .spk polygon{fill:color-mix(in srgb,var(--c) 18%,transparent)}
.tk .flr{font:800 1.15cqw var(--mono);letter-spacing:.2em;padding:.6cqh .9cqw;text-transform:uppercase;border-radius:.4cqw;background:var(--c);color:var(--ink);opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.tk.ctl{border-color:var(--c);box-shadow:0 0 0 .2cqw var(--c),0 0 5cqw color-mix(in srgb,var(--c) 45%,transparent),0 2cqh 4cqw rgba(0,0,0,.5)}
.tk.ctl .flr,.tk.buzz .flr{opacity:1;transform:none}
.tk.buzz{animation:buzz .5s 2;border-color:#fff}
.tk{transition:box-shadow .4s,border-color .4s,transform .4s,opacity .4s,filter .4s}.tk.idle{opacity:.5;filter:saturate(.4)}
@keyframes buzz{30%{transform:scale(1.04);box-shadow:0 0 0 .4cqw #fff,0 0 8cqw var(--c)}}
.tk.paid{animation:paid .8s}
@keyframes paid{25%{transform:scale(1.05);box-shadow:0 0 0 .3cqw var(--gold),0 0 8cqw rgba(255,201,60,.8)}}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.6cqh 0 .2cqh}
.mid .lab{font:800 1cqw var(--mono);letter-spacing:.34em;color:rgba(255,255,255,.55);text-transform:uppercase}
.mid .lab .mx{font-size:1.35cqw;color:#ffb347;text-shadow:0 0 1cqw rgba(255,122,26,.8);animation:mxp 1.2s ease-in-out infinite}
@keyframes mxp{50%{color:#fff;text-shadow:0 0 2.4cqw rgba(255,150,40,1)}}
.pot{font:900 9.6cqh/0.95 var(--disp);font-variant-numeric:tabular-nums;filter:drop-shadow(0 .4cqh 0 #6b3d00) drop-shadow(0 0 2cqw rgba(255,201,60,.35))}
.pot.pump{animation:pump .45s}
@keyframes pump{40%{transform:scale(1.18)}}
.lamps{display:flex;gap:.6cqw;width:100%}
.lamp{flex:1;height:4cqh;border-radius:.6cqw;display:grid;place-items:center;font:800 .74cqw var(--mono);letter-spacing:.08em;color:rgba(255,110,100,.42);background:linear-gradient(180deg,#2a0d12,#160609);border:.12cqw solid rgba(255,59,48,.32);white-space:nowrap}
.lamp.on{color:#fff;background:radial-gradient(120% 140% at 50% 30%,#ff7b6e,#d9180d 60%,#7a0700);border-color:#ffb3ab;box-shadow:0 0 2.6cqw rgba(255,59,48,.9),inset 0 .3cqh .6cqh rgba(255,255,255,.4);text-shadow:0 .2cqh .4cqh rgba(0,0,0,.4)}
.lamp.hit{animation:lamp .6s}
@keyframes lamp{0%{transform:scale(1.5);filter:brightness(2.5)}}
.subj{position:absolute;left:2cqw;right:2cqw;top:21.2cqh;height:11.6cqh;display:flex;align-items:center;gap:2cqw;padding:0 2cqw;border-radius:1cqw;background:linear-gradient(90deg,rgba(255,201,60,.14),rgba(255,255,255,.03) 55%,rgba(255,255,255,0));border-left:.4cqw solid var(--gold)}
.subj .sl{flex:none;font:800 .95cqw/1.6 var(--mono);letter-spacing:.24em;color:var(--gold);width:13cqw;text-transform:uppercase}
.subj .sl span{display:block;color:rgba(255,255,255,.5);letter-spacing:.14em}
.subj .q{font:800 var(--qfs,2.8cqw)/1.1 var(--head);text-shadow:0 .3cqh 1.6cqw rgba(0,0,0,.6)}
.subj .q .w{display:inline;border-radius:.3cqw;background:linear-gradient(#050507,#050507) 0 0/100% 100% no-repeat;color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background-size .32s cubic-bezier(.6,0,.3,1),color .1s}
.subj .q.on .w{background-size:0 100%;color:#fff;transition-delay:calc(var(--i)*38ms),calc(var(--i)*38ms + 120ms)}
.subj .cls{position:absolute;right:2cqw;top:50%;transform:translateY(-50%) rotate(-4deg);font:800 1cqw var(--mono);letter-spacing:.3em;color:var(--red);border:.18cqw solid var(--red);padding:.6cqh .9cqw;border-radius:.4cqw;opacity:.8;transition:opacity .3s}
.subj .q.on~.cls{opacity:0}
.guesses{position:absolute;right:2.6cqw;top:33.6cqh;font:800 .95cqw var(--mono);letter-spacing:.16em;color:var(--ta);opacity:0;transition:opacity .4s}
.guesses.on{opacity:1}
.board{position:absolute;left:2cqw;right:2cqw;top:36.2cqh;bottom:11.4cqh;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:1.5cqh 1.4cqw}
.tile{position:relative;border-radius:1cqw;--ant:300ms}
.tile .sh{position:absolute;inset:0;border-radius:1cqw;background:linear-gradient(180deg,rgba(18,58,40,.92),rgba(5,22,14,.95));border:.12cqw solid rgba(255,255,255,.13);box-shadow:inset 0 .2cqh 0 rgba(255,255,255,.08),0 1.4cqh 3cqw rgba(0,0,0,.45);overflow:hidden}
.tile .sh:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%) -100% 0/60% 100% no-repeat}
.tile .rk{position:absolute;left:1.3cqw;top:50%;width:4.6cqw;height:4.6cqw;margin-top:-2.3cqw;border-radius:50%;display:grid;place-items:center;font:900 3.2cqw/1 var(--disp);color:#2b1800;background:var(--goldtx);box-shadow:0 0 0 .2cqw rgba(0,0,0,.6),0 0 2cqw rgba(255,201,60,.35)}
.tile .rd{position:absolute;left:7.4cqw;right:1.6cqw;top:30%;bottom:30%;border-radius:.3cqw;background:repeating-linear-gradient(-45deg,#050507 0 .7cqw,#0d0d12 .7cqw 1.4cqw);border:.1cqw solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font:800 .9cqw var(--mono);letter-spacing:.6em;color:rgba(255,255,255,.16)}
.tile .pp{position:absolute;inset:0;border-radius:1cqw;background:linear-gradient(180deg,#fffdf6,#f1eadb);color:var(--ink);display:flex;align-items:center;gap:1.4cqw;padding:0 1.2cqw 0 2cqw;clip-path:inset(0 100% 0 0);overflow:hidden;box-shadow:0 1.4cqh 3cqw rgba(0,0,0,.45)}
.tile .pp .an{flex:1;font:800 var(--afs,2.6cqw)/1.04 var(--head);letter-spacing:-.01em}
.tile .pp .pt{flex:none;min-width:7cqw;height:72%;display:grid;place-items:center;border-radius:.7cqw;background:#0b0b10;font:900 7.2cqh/1 var(--disp);color:var(--gold);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 .14cqw rgba(255,201,60,.35)}
.tile .pp .kpi{position:absolute;left:0;bottom:0;height:.8cqh;width:calc(var(--k)*100%);background:linear-gradient(90deg,var(--ta),var(--gold));transform-origin:left}
.tile .pp .called{display:none;margin-top:.7cqh;font:800 .82cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#c4500a}
.tile .pp .called.on{display:block;animation:fin .4s .7s backwards}
.tile .tr{position:absolute;left:-.6cqw;top:-1.6cqh;z-index:2;font:800 .9cqw var(--mono);letter-spacing:.2em;padding:.6cqh 1cqw;border-radius:.4cqw;background:var(--goldtx);color:#2b1800;box-shadow:0 .6cqh 1.4cqw rgba(0,0,0,.5);transform:rotate(-4deg) scale(0);transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.tile.open .pp{clip-path:inset(0)}
.tile.open .rd,.tile.open .rk{opacity:0}
.tile.open.t-0 .tr{transform:rotate(-4deg)}
.tile.ant .sh{animation:tant var(--ant) linear}.tile.ant .sh:after{animation:scan var(--ant) linear}
.tile.ant .rk{animation:rkp var(--ant) ease-in}
@keyframes tant{20%{transform:translateX(-.25cqw)}40%{transform:translateX(.25cqw)}60%{transform:translateX(-.2cqw)}80%{transform:translateX(.18cqw)}}
@keyframes scan{to{background-position:200% 0}}
@keyframes rkp{60%{transform:scale(1.25);filter:brightness(1.6)}}
.tile.go .pp{transition:clip-path .3s cubic-bezier(.6,0,.2,1)}
.tile.go .pp .kpi{animation:grow .9s .25s cubic-bezier(.2,.9,.3,1) backwards}
.tile.flash .pp{box-shadow:0 0 0 .3cqw #fff,0 0 5cqw var(--fc,var(--gold))}
.tile.top .pp{box-shadow:0 0 0 .3cqw var(--gold),0 0 7cqw rgba(255,201,60,.9)}
.cone{position:absolute;top:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(255,244,214,0),rgba(255,236,190,.42));mix-blend-mode:screen;animation:cone 1.9s ease-out forwards}
@keyframes cone{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.tile.wv{animation:wv .5s}
@keyframes wv{40%{transform:translateY(-1.2cqh) scale(1.02);filter:brightness(1.25)}}
.deal .tile{animation:deal .55s calc(var(--i)*70ms) cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes deal{from{opacity:0;transform:translateY(5cqh) rotateX(40deg)}}
.dock{position:absolute;right:2cqw;bottom:2.4cqh;height:6.6cqh;display:flex;gap:1cqw;align-items:center}
.mode{height:100%;display:flex;align-items:center;gap:1cqw;padding:0 1.4cqw 0 .7cqw;border-radius:4cqh;background:rgba(4,20,12,.75);border:.1cqw solid rgba(255,255,255,.12);font:800 .95cqw var(--mono);letter-spacing:.16em;color:rgba(255,255,255,.7)}
.mode b{width:5cqh;height:5cqh;border-radius:50%;display:grid;place-items:center;font:900 2.4cqw/1 var(--disp);background:var(--goldtx);color:#2b1800;letter-spacing:0}
.mode.m1 b{background:rgba(255,255,255,.12);color:#fff}
.streak{height:100%;display:flex;align-items:center;gap:.8cqw;padding:0 1.6cqw;border-radius:4cqh;background:linear-gradient(90deg,#ffb347,#f96302);font:900 3.4cqh var(--disp);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 3cqw rgba(255,100,40,.6);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.streak.on{transform:none}.streak.bump{animation:pump .4s}
.streak svg{width:2.2cqw;fill:#ffe9a6}
.izb{position:absolute;left:2cqw;right:2cqw;top:21.2cqh;height:11.6cqh;display:flex;align-items:center;justify-content:center;gap:2cqw;border-radius:1cqw;background:var(--goldtx);color:#2b1800;box-shadow:0 0 6cqw rgba(255,201,60,.7);animation:izt 3.4s cubic-bezier(.7,0,.2,1) forwards;white-space:nowrap}
@keyframes izt{0%{clip-path:inset(0 100% 0 0)}12%,86%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}
.izb b{font:900 7.4cqh var(--disp);letter-spacing:.04em;text-transform:uppercase}.izb span{font:800 2cqw var(--head)}
@keyframes izb{0%{transform:translate(-50%,14cqh)}12%,86%{transform:translate(-50%,0)}100%{transform:translate(-50%,14cqh)}}

/* ---------- stamps and banners ---------- */
.stamp{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-8deg);text-align:center;font:900 var(--sz) var(--disp);line-height:.9;letter-spacing:.02em;text-transform:uppercase;color:#ff3527;padding:2.2cqh 3cqw 2cqh;border:.7cqw double #ff3527;border-radius:1.4cqw;background:rgba(25,2,4,.82);filter:url(#ink) drop-shadow(0 1cqh 3cqw rgba(0,0,0,.6));animation:stamp 1.8s cubic-bezier(.2,.9,.3,1) forwards;white-space:nowrap}
.stamp small{display:block;font:800 1.5cqw var(--mono);letter-spacing:.3em;margin-top:1.2cqh}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(3.2);opacity:0}11%{transform:translate(-50%,-50%) rotate(-8deg) scale(.94);opacity:1}17%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}84%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.04)}}
.redwash{position:absolute;inset:0;background:radial-gradient(closest-side,rgba(60,0,0,.35),rgba(255,30,20,.5));animation:redw 1.8s ease-out forwards}
@keyframes redw{0%,40%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:2cqw;right:2cqw;top:21.2cqh;height:11.6cqh;display:flex;align-items:center;justify-content:center;gap:2cqw;border-radius:1cqw;background:linear-gradient(180deg,#154a29,#0a1d11);border:.16cqw solid var(--green);box-shadow:0 0 5cqw rgba(61,255,143,.45);white-space:nowrap;animation:izt 3s cubic-bezier(.7,0,.2,1) forwards}
.banner .mono{font-size:1.2cqw;color:var(--green)}.banner b{font:900 7cqh var(--disp);text-transform:uppercase;letter-spacing:.03em}
.banner i{font-style:normal;font:900 8cqh var(--disp);color:var(--green);text-shadow:0 0 2cqw rgba(61,255,143,.7)}
.float{position:absolute;bottom:-6cqh;z-index:8;pointer-events:none;animation:rise 3.2s cubic-bezier(.3,.6,.5,1) forwards;filter:drop-shadow(0 .6cqh 1cqw rgba(0,0,0,.5))}
@keyframes rise{20%{transform:translate(var(--wx),-25cqh) rotate(-8deg) scale(1.2)}60%{opacity:1}100%{transform:translate(calc(var(--wx)*-1),-80cqh) rotate(10deg);opacity:0}}

/* ---------- full-screen cards (curtains close, the card plays, curtains open on the next scene) ---------- */
.card{position:absolute;inset:0;--d:2600ms}
.card .cu{position:absolute;top:0;bottom:0;width:50.5%;background:radial-gradient(80% 60% at 100% 50%,#0c2a1b,#031009 70%);animation:cul var(--d) cubic-bezier(.7,0,.2,1) forwards}
.card .cu.r{right:0;background:radial-gradient(80% 60% at 0% 50%,#0c2a1b,#031009 70%);animation-name:cur}
.card .cu:after{content:"";position:absolute;top:0;bottom:0;right:0;width:.25cqw;background:linear-gradient(180deg,transparent,var(--gold),transparent);box-shadow:0 0 3cqw var(--gold);animation:seam var(--d) linear forwards}
@keyframes seam{0%,12%{opacity:1}20%,80%{opacity:0}88%,100%{opacity:1}}
.card .cu.r:after{right:auto;left:0}
@keyframes cul{0%{transform:translateX(-100%)}13%,87%{transform:none}100%{transform:translateX(-100%)}}
@keyframes cur{0%{transform:translateX(100%)}13%,87%{transform:none}100%{transform:translateX(100%)}}
.card .cc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:ccf var(--d) linear forwards}
@keyframes ccf{0%,12%{opacity:0;transform:scale(1.08)}20%{opacity:1;transform:none}82%{opacity:1}88%,100%{opacity:0;transform:scale(.97)}}
.card .k0{font:800 1.4cqw var(--mono);letter-spacing:.4em;color:var(--ta);margin-bottom:2cqh;max-width:92cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card h1{margin:0;font:900 var(--hs,14cqh)/0.92 var(--disp);text-transform:uppercase;letter-spacing:.01em;filter:drop-shadow(0 .5cqh 0 #6b3d00) drop-shadow(0 2cqh 3cqw rgba(0,0,0,.6))}
.card p{margin:3cqh 0 0;max-width:70cqw;font:800 2.4cqw/1.2 var(--head);color:#fff}
.card .rule{width:0;height:.3cqh;margin:3cqh auto 0;background:var(--goldtx);animation:rule var(--d) cubic-bezier(.2,.9,.3,1) forwards}
@keyframes rule{0%,16%{width:0}36%,100%{width:30cqw}}
/* round intro: a giant outlined number, the round, its multiplier, and a meeting invite somebody accepts for you */
.card .ri{display:flex;align-items:center;gap:4cqw}
.card .num{font:900 62cqh/0.8 var(--disp);color:transparent;-webkit-text-stroke:.3cqw var(--gold);background:var(--goldtx) 0 100%/100% 0 no-repeat;-webkit-background-clip:text;background-clip:text;animation:numf var(--d) cubic-bezier(.2,.9,.3,1) forwards;filter:drop-shadow(0 0 3cqw rgba(255,201,60,.35))}
@keyframes numf{0%,18%{background-size:100% 0}55%,100%{background-size:100% 100%}}
.card .rt{text-align:left}
.card .rt h1{--hs:17cqh}
.card .mx{display:flex;align-items:center;gap:1.4cqw;margin-top:2.4cqh;font:800 1.6cqw var(--mono);letter-spacing:.2em;color:#fff}
.card .mx b{width:7cqh;height:7cqh;border-radius:50%;display:grid;place-items:center;font:900 4.4cqh/1 var(--disp);letter-spacing:0;background:var(--goldtx);color:#2b1800;box-shadow:0 0 3cqw rgba(255,201,60,.7);animation:spinm var(--d) cubic-bezier(.2,.9,.3,1) forwards}
.card .mx b.m1{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
@keyframes spinm{0%,20%{transform:rotateY(540deg) scale(0)}40%,100%{transform:none}}
.card .inv{margin-top:3.6cqh;display:flex;align-items:center;gap:1.6cqw;padding:1.4cqh 1.6cqw;border-radius:1cqw;background:rgba(255,255,255,.06);border:.1cqw solid rgba(255,255,255,.14);font:500 1.3cqw var(--body);color:rgba(255,255,255,.75);position:relative}
.card .inv span b{color:#fff;font-weight:800}
.card .acc{padding:.8cqh 1.6cqw;border-radius:.6cqw;border:.14cqw solid rgba(255,255,255,.4);font:800 1.3cqw var(--head);color:#fff;white-space:nowrap;animation:acc var(--d) steps(1) forwards}
@keyframes acc{0%,50%{background:transparent}51%,100%{background:var(--green);color:var(--ink);border-color:var(--green)}}
.card .cursor{position:absolute;width:2.2cqw;animation:curm var(--d) cubic-bezier(.5,0,.1,1) forwards}
@keyframes curm{0%,26%{transform:translate(10cqw,10cqh);opacity:0}30%{opacity:1}48%{transform:translate(0,0)}50%{transform:translate(0,0) scale(.85)}53%,82%{transform:translate(0,0);opacity:1}88%,100%{opacity:0}}
/* hostile takeover and its outcome */
.card.tko .cu{background:radial-gradient(80% 60% at 100% 50%,#3a0508,#0c0204 70%)}
.card.tko .cu.r{background:radial-gradient(80% 60% at 0% 50%,#3a0508,#0c0204 70%)}
.card.tko .cu:after{background:linear-gradient(180deg,transparent,var(--red),transparent);box-shadow:0 0 3cqw var(--red)}
.card.tko.ok .cu{background:radial-gradient(80% 60% at 100% 50%,#06301a,#020c06 70%)}.card.tko.ok .cu.r{background:radial-gradient(80% 60% at 0% 50%,#06301a,#020c06 70%)}
.card.tko.ok .cu:after{background:linear-gradient(180deg,transparent,var(--green),transparent);box-shadow:0 0 3cqw var(--green)}
.card.tko .k0{color:var(--red)}.card.tko.ok .k0{color:var(--green)}
.card.tko h1{background:none;color:#fff;-webkit-text-fill-color:#fff;filter:none;text-shadow:.4cqw 0 0 rgba(255,59,48,.85),-.4cqw 0 0 rgba(255,122,26,.6);animation:glitch .35s steps(2) 4}
.card.tko.ok h1{text-shadow:0 0 3cqw rgba(61,255,143,.6)}
@keyframes glitch{0%{transform:translate(.4cqw,0) skewX(-6deg)}50%{transform:translate(-.4cqw,.2cqh) skewX(5deg)}}
.trows{display:flex;gap:3cqw;margin-top:4cqh}
.trow{width:34cqw;padding:2.4cqh 2cqw;border-radius:1.2cqw;background:rgba(255,255,255,.05);border:.14cqw solid var(--c);text-align:left;animation:up8 .6s var(--dl) cubic-bezier(.2,.9,.3,1) backwards}
.trow.t0{--c:var(--ta)}.trow.t1{--c:var(--tb)}
.trow small{font:800 .95cqw var(--mono);letter-spacing:.24em;color:var(--c)}
.trow b{display:block;font:800 2.6cqw/1.1 var(--head);margin:.6cqh 0 1.4cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow u{text-decoration:none;display:inline-block;font:900 3.6cqh var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:.6cqh 1cqw;border-radius:.5cqw}
.trow.out{opacity:.85}.trow.out u{background:var(--red);color:#fff}
.trow.in u,.trow.okk u{background:var(--green);color:var(--ink)}
.trow.out b{text-decoration:line-through;text-decoration-thickness:.3cqh;text-decoration-color:var(--red)}
.tpot{margin-top:4cqh;font:800 1.2cqw var(--mono);letter-spacing:.3em;color:rgba(255,255,255,.6)}
.tpot b{display:block;font:900 12cqh/1 var(--disp);letter-spacing:0;margin-top:1cqh}
/* standings: an earnings call */
.earn{display:flex;gap:4cqw;align-items:flex-end;margin-top:4cqh;height:40cqh}
.ecol{width:26cqw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.ecol.e0{--c:var(--ta)}.ecol.e1{--c:var(--tb)}
.ecol .bar{width:60%;height:var(--h);border-radius:1cqw 1cqw 0 0;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 30%,#000));box-shadow:0 0 4cqw color-mix(in srgb,var(--c) 50%,transparent);animation:growy 1.3s .55s cubic-bezier(.2,.9,.3,1) backwards;transform-origin:bottom}
@keyframes growy{from{transform:scaleY(0)}}
.ecol .v{font:900 12cqh/1 var(--disp);font-variant-numeric:tabular-nums;margin-bottom:1cqh}
.ecol .n{margin-top:1.6cqh;font:800 2cqw var(--head);max-width:26cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecol .rate{position:absolute;top:-2cqh;font:900 4cqh var(--disp);letter-spacing:.08em;padding:.6cqh 1.2cqw;border-radius:.5cqw;transform:rotate(-6deg);animation:pop .5s 1.6s cubic-bezier(.3,1.7,.5,1) backwards}
.ecol .rate.buy{background:var(--green);color:var(--ink)}.ecol .rate.hold{background:rgba(255,255,255,.18);color:#fff}
@keyframes pop{from{transform:rotate(-6deg) scale(0)}}
/* the room's leaderboard */
.lb{margin-top:3.4cqh;width:60cqw}
.lb div{display:flex;align-items:center;gap:1.6cqw;padding:1.5cqh 1.6cqw;margin-bottom:1cqh;border-radius:1cqw;background:rgba(255,255,255,.05);animation:up8 .5s var(--dl) cubic-bezier(.2,.9,.3,1) backwards;text-align:left}
.lb div:first-child{background:linear-gradient(90deg,rgba(255,201,60,.25),rgba(255,201,60,.04));box-shadow:inset 0 0 0 .14cqw rgba(255,201,60,.6)}
.lb b{width:4cqw;font:900 5cqh var(--disp);color:var(--gold)}
.lb span{flex:1;font:800 2.4cqw var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb i{width:1.2cqw;height:1.2cqw;border-radius:50%;flex:none}
.lb em{font-style:normal;font:900 5cqh var(--disp);font-variant-numeric:tabular-nums}

/* ---------- "You said" ---------- */
.sv{position:absolute;inset:0}
.sv .svl{position:absolute;left:3cqw;top:6cqh;width:56cqw}
.sv .you{font:900 22cqh/0.85 var(--disp);text-transform:uppercase}
.sv .st{text-transform:uppercase;margin-top:2cqh;font:800 1.2cqw var(--mono);letter-spacing:.24em;color:var(--ta)}
.sv .sq{margin-top:3cqh;font:800 var(--qfs,3cqw)/1.15 var(--head)}
.sv .unr{position:absolute;left:3cqw;bottom:13cqh;display:flex;align-items:flex-end;gap:2cqw}
.sv .unr b{font:900 26cqh/0.8 var(--disp);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 4cqw rgba(255,122,26,.5)}
.sv .unr b.bump{animation:pump .4s}
.sv .unr span{font:800 2.2cqw/1.15 var(--head);color:rgba(255,255,255,.75);padding-bottom:2cqh}
.sv .tray{position:absolute;left:30cqw;bottom:13cqh;width:30cqw;height:26cqh;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:.5cqw}
.sv .tray i{width:3cqw;height:2.2cqw;background:var(--paper);border-radius:.2cqw;position:relative;animation:pop .35s cubic-bezier(.3,1.7,.5,1) backwards;transform:rotate(var(--r))}
.sv .tray i:after{content:"";position:absolute;left:0;right:0;top:0;height:60%;border-bottom:.15cqw solid #0b0b10;clip-path:polygon(0 0,50% 100%,100% 0)}
.sv .side{position:absolute;right:3cqw;top:8cqh;bottom:8cqh;width:34cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3cqh 2cqw}
.sv .side .qr{width:24cqw;height:24cqw}
.sv .side h3{margin:0 0 2.4cqh;font:900 6cqh var(--disp);text-transform:uppercase}
.sv .side .u{margin-top:2.4cqh;font:800 1.5cqw var(--mono);letter-spacing:.02em;color:var(--gold)}
.sv .side .c{margin-top:1cqh;font:800 1.6cqw var(--head)}.sv .side .c b{font:900 4cqw var(--disp);letter-spacing:.14em;color:var(--tb);vertical-align:-.2cqh}
.sv .lock svg{width:12cqw;fill:none;stroke:var(--gold);stroke-width:6}
.sv .sort{display:flex;gap:.6cqw;height:12cqh;align-items:flex-end;margin:3cqh 0}
.sv .sort i{width:2.2cqw;background:linear-gradient(180deg,var(--ta),var(--violet));border-radius:.4cqw .4cqw 0 0;animation:sortb .8s ease-in-out infinite alternate}
@keyframes sortb{from{height:20%}to{height:100%}}

/* ---------- final round: the 4:59 Friday Rush ---------- */
.rush{position:absolute;inset:0}
.rush .rh{position:absolute;left:3cqw;top:4cqh}
.rush .rh .mono{font-size:1.1cqw;color:var(--ta)}
.rush .rh h1{margin:2.4cqh 0 0;font:900 11cqh/0.9 var(--disp);text-transform:uppercase}
.rush .lq{margin-top:2cqh;max-width:60cqw;font:800 2.4cqw/1.15 var(--head);min-height:6cqh}
.rush .lq.pop{animation:fin .4s}
.rush .clk{position:absolute;right:3cqw;top:3cqh;display:flex;align-items:center;gap:2cqw}
.rush .dig{font:900 15cqh/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--ta);text-shadow:0 0 3cqw rgba(255,122,26,.7);min-width:16cqw;text-align:right}
.rush .dig.hot{color:var(--red);text-shadow:0 0 3cqw rgba(255,59,48,.9);animation:pump .5s infinite}
.rush .face{width:19cqh;height:19cqh}
.face .rim{fill:#f6f1e6;stroke:#0d2c1d;stroke-width:6}.face .tk{stroke:#0d2c1d;stroke-width:2}.face .tk.b{stroke-width:4.5}
.face .arc{fill:none;stroke:var(--red);stroke-width:7;opacity:.85}
.face text{font:800 15px var(--mono);fill:#0d2c1d;text-anchor:middle}
.face .hh,.face .mh{stroke:#0d2c1d;stroke-linecap:round}.face .hs line{stroke:var(--red);stroke-width:2.5}.face .hs circle{fill:var(--red)}
.face .hs{transform-origin:100px 100px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.lgrid{position:absolute;left:3cqw;right:3cqw;top:29cqh;display:grid;grid-template-columns:5cqw 1fr 9cqw 1fr 9cqw;gap:1.1cqh 1cqw}
.lgrid .hd{display:flex;align-items:baseline;gap:1.2cqw;padding:0 0 .8cqh;font:800 2cqw var(--head);border-bottom:.35cqh solid var(--c);white-space:nowrap;overflow:hidden;opacity:.6;transition:opacity .4s}
.lgrid .hd.act{opacity:1}
.lgrid .hd b{font:900 5cqh var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}
.lgrid .hd em{font-style:normal;font:800 .8cqw var(--mono);letter-spacing:.2em;padding:.5cqh .7cqw;border-radius:.4cqw;background:var(--c);color:var(--ink);display:none}
.lgrid .hd.act em{display:inline-block}
.lgrid .n{display:grid;place-items:center;font:900 6cqh var(--disp);color:rgba(255,255,255,.5)}
.lgrid .n.cur{color:var(--gold)}
.lgrid .a,.lgrid .p{height:7.6cqh;border-radius:.9cqw;background:rgba(255,255,255,.04);border:.12cqw solid rgba(255,255,255,.1);display:flex;align-items:center;padding:0 1.4cqw;overflow:hidden}
.lgrid .a.on{background:linear-gradient(180deg,#fffdf6,#f1eadb);color:var(--ink);font:800 var(--fs,2.3cqw) var(--head);animation:lin .4s cubic-bezier(.2,.9,.3,1)}
.lgrid .p{justify-content:center;font:900 6cqh var(--disp);font-variant-numeric:tabular-nums}
.lgrid .p.on{background:#0b0b10;color:var(--gold);border-color:rgba(255,201,60,.5);animation:pump .4s}
.lgrid .p.zero{color:var(--red)}
@keyframes lin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.lfoot{position:absolute;left:9cqw;right:3cqw;bottom:3cqh;display:flex;align-items:flex-end;gap:3cqw}
.upl{flex:1}
.upl .t{display:flex;justify-content:space-between;font:800 1.3cqw var(--mono);letter-spacing:.12em;margin-bottom:1.2cqh}
.upl .t b{color:var(--gold)}
.upb{height:3cqh;border-radius:2cqh;background:rgba(255,255,255,.08);border:.12cqw solid rgba(255,255,255,.2);overflow:hidden}
.upb i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--ta) 0 1.2cqw,#f3e9d2 1.2cqw 2.4cqw);animation:stripes 1s linear infinite;transition:width .8s cubic-bezier(.2,.9,.3,1)}
@keyframes stripes{to{background-position-x:3.394cqw}}
.upl.done .upb i{background:var(--green)}
.tot{text-align:right}.tot span{display:block;font:800 1.1cqw var(--mono);letter-spacing:.3em;color:rgba(255,255,255,.6);text-transform:uppercase}.tot b{font:900 11cqh/0.9 var(--disp);font-variant-numeric:tabular-nums}

/* ---------- winner: calibration, then the Golden Stapler ---------- */
.win{position:absolute;inset:0}
.cal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:calo .5s 2.6s forwards}
.cal h1{margin:2cqh 0 4cqh;font:900 9cqh var(--disp);text-transform:uppercase}
.cal .upb{width:56cqw}
.cal .pc{margin-top:2.4cqh;font:900 9cqh var(--disp);color:var(--gold)}
.cal .cs{font:800 1.2cqw var(--mono);letter-spacing:.24em;color:rgba(255,255,255,.6)}
@keyframes calo{to{opacity:0;transform:scale(1.2);filter:blur(1cqw);visibility:hidden}}
.wr{position:absolute;inset:0;opacity:0;animation:fon .6s 2.9s forwards}
@keyframes fon{to{opacity:1}}
.trophy{position:absolute;left:50%;top:3cqh;width:24cqw;margin-left:-12cqw;animation:troph 1.6s 2.9s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes troph{from{transform:translateY(60cqh) scale(.5) rotate(-20deg)}}
.trophy svg{width:100%;display:block;filter:drop-shadow(0 0 4cqw rgba(255,201,60,.6))}
.trophy .glint{animation:glint 2.4s 4s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0}50%{opacity:1}}
.wtxt{position:absolute;left:0;right:0;top:42cqh;text-align:center}
.wtxt p{text-shadow:0 0 3cqw rgba(0,0,0,.9)}
.wtxt .mono{font-size:1.4cqw;color:var(--gold);letter-spacing:.5em}
.wtxt h1{filter:drop-shadow(0 .5cqh 0 #6b3d00) drop-shadow(0 0 3cqw rgba(0,0,0,.8));margin:1.4cqh 0 0;font:900 var(--wfs,16cqh)/0.9 var(--disp);text-transform:uppercase;animation:slam .7s 3.4s cubic-bezier(.2,.9,.3,1) backwards}
.wtxt p{margin:2.6cqh 0 0;font:800 2.2cqw var(--head);animation:up8 .6s 4.2s backwards}
.wfoot{position:absolute;left:12cqw;right:12cqw;bottom:13cqh;display:flex;justify-content:space-between;gap:2cqw;animation:up8 .7s 5s backwards}
.wfoot>div{flex:1;padding:2cqh 1.8cqw;border-radius:1.2cqw;background:rgba(4,20,12,.8);border:.12cqw solid rgba(255,255,255,.14)}
.wfoot small{text-transform:uppercase;font:800 .95cqw var(--mono);letter-spacing:.24em;color:var(--ta)}
.wfoot b{display:block;margin-top:.8cqh;font:800 2.2cqw var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfoot span{font:500 1.3cqw var(--body);color:rgba(255,255,255,.6)}
.wfoot .mvp{border-color:var(--gold);box-shadow:0 0 3cqw rgba(255,201,60,.3)}.wfoot .mvp small{color:var(--gold)}

/* ---------- Chip, the AI intern (unpaid) ---------- */
#chip{position:absolute;left:1.6cqw;bottom:1.4cqh;z-index:8;display:flex;align-items:flex-end;gap:1cqw;pointer-events:none;transform:translateY(30cqh);transition:transform .5s cubic-bezier(.3,1.4,.5,1);--lx:0;--ly:0}
#chip.on{transform:none}
.chw{position:relative;flex:none;width:4.4cqw;height:5.35cqw;transform-origin:50% 100%}
.chp{position:absolute;inset:0;transform-origin:50% 100%;animation:chbob 3.2s ease-in-out infinite}
.chp svg{display:block;width:100%;height:100%;overflow:visible}
.chw:before{content:"";position:absolute;left:8%;right:8%;bottom:-.9cqh;height:1.6cqh;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
.chh{transform-origin:48px 110px;transform:rotate(calc(var(--lx)*5deg));transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.chl{transform:translate(calc(var(--lx)*6px),calc(var(--ly)*4px));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.chp .e,.chp .m,.chp .x{display:none}
.chp .e,.chp .m,.chp .x,.chp .bulb,.chp .hat{transform-box:fill-box;transform-origin:50% 50%}
.chp .ln{fill:none;stroke:var(--ta);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.chp .fl{fill:var(--ta)}
.chp .bulb{fill:var(--tb);animation:chbulb 1.6s ease-in-out infinite alternate}
.chp .hat{display:none}
#chip[data-mood=idle] .e-n,#chip[data-mood=idle] .m-n,#chip[data-mood=happy] .e-h,#chip[data-mood=happy] .m-g,#chip[data-mood=star] .e-s,#chip[data-mood=star] .m-g,#chip[data-mood=star] .x-s,
#chip[data-mood=wince] .e-x,#chip[data-mood=wince] .m-w,#chip[data-mood=wince] .x-w,#chip[data-mood=shock] .e-o,#chip[data-mood=shock] .m-o,#chip[data-mood=shock] .x-o,
#chip[data-mood=money] .e-m,#chip[data-mood=money] .m-g,#chip[data-mood=money] .x-m,#chip[data-mood=party] .e-h,#chip[data-mood=party] .m-g,#chip[data-mood=party] .x-p,#chip[data-mood=party] .hat{display:block}
#chip[data-mood=party] .ant{display:none}
#chip.talk .m{display:none!important}#chip.talk .m-t{display:block!important}
.chp .e-n{animation:blink 3.7s infinite}
.chp .e-s{fill:var(--gold);animation:chstar .5s ease-in-out infinite alternate}
.chp .e-x{stroke:var(--tb)}.chp .m-w{stroke:var(--tb)}
.chp .e-o{animation:chpop .3s cubic-bezier(.3,1.8,.5,1)}
.chp .e-m{fill:var(--gold);font:900 30px var(--disp);text-anchor:middle;animation:chstar .4s ease-in-out infinite alternate}
.chp .m-t{animation:chtalk .13s ease-in-out infinite alternate}
.chp .x-w.tr{fill:var(--paper);opacity:.85;animation:chtear .5s steps(1) 3}
.chp .x-w.sw{fill:#8df5f7;stroke:#fff;stroke-width:2;animation:chsweat 1s .15s ease-in 2 backwards}
.chp .x-o{fill:var(--gold);stroke:var(--ink);stroke-width:2.5;paint-order:stroke;font:900 44px var(--disp);text-anchor:middle;animation:chpop .35s cubic-bezier(.3,1.8,.5,1)}
.chp .x-s{fill:var(--gold);stroke:var(--ink);stroke-width:1.5;animation:chspark .7s ease-out infinite}
.chp .x-s.b{animation-delay:.25s}.chp .x-s.c{animation-delay:.45s}
.chp .x-m{fill:var(--gold);stroke:var(--ink);stroke-width:2.5;paint-order:stroke;font:900 24px var(--disp);text-anchor:middle;animation:chcoin 1s ease-out infinite}
.chp .x-m.b{animation-delay:.5s}
.chp .x-p{animation:chconf 1.5s ease-out infinite}
.chp .x-p.b{animation-delay:.5s}.chp .x-p.c{animation-delay:1s}
#chip[data-mood=happy] .chw{animation:chhop .5s 3}
#chip[data-mood=star] .chw{animation:chspin 1.1s cubic-bezier(.3,.9,.4,1),chhop .5s 1.1s 2}
#chip[data-mood=wince] .chw{animation:chglitch .5s steps(1) 3;transform:scale(.94,.9)}
#chip[data-mood=shock] .chw{animation:chjolt .5s cubic-bezier(.2,1.6,.4,1),chshiver .12s .5s linear 14}
#chip[data-mood=money] .chw{animation:chwig .5s ease-in-out 5}
#chip[data-mood=party] .chw{animation:chhop .7s infinite}
@keyframes chbob{50%{transform:translateY(-.5cqh) rotate(-2deg)}}
@keyframes chbulb{to{fill:var(--gold);transform:scale(1.25)}}
@keyframes chstar{from{transform:scale(.8) rotate(-12deg)}to{transform:scale(1.2) rotate(12deg)}}
@keyframes chpop{from{transform:scale(0)}}
@keyframes chtalk{from{transform:scaleY(.2)}}
@keyframes chtear{0%{transform:translate(-14px,0)}25%{transform:translate(12px,26px)}50%{transform:translate(-6px,-14px);opacity:.4}75%{transform:translate(16px,10px)}}
@keyframes chsweat{0%{transform:translateY(-6px) scale(.3);opacity:0}25%{opacity:1;transform:none}100%{transform:translateY(46px);opacity:0}}
@keyframes chspark{0%{transform:scale(0) rotate(0);opacity:1}60%{opacity:1}100%{transform:scale(1.3) rotate(90deg);opacity:0}}
@keyframes chcoin{0%{transform:translateY(20px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
@keyframes chconf{0%{transform:translate(0,22px) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--cx,10px),-30px) rotate(200deg);opacity:0}}
@keyframes chhop{0%,100%{transform:none}15%{transform:scale(1.12,.86)}50%{transform:translateY(-2.4cqh) scale(.94,1.08)}85%{transform:scale(1.08,.92)}}
@keyframes chspin{0%{transform:scale(1.1,.85)}40%{transform:translateY(-5cqh) rotate(200deg)}80%{transform:translateY(-1cqh) rotate(360deg)}100%{transform:rotate(360deg)}}
@keyframes chglitch{0%{transform:translate(-.5cqw,0) skewX(14deg) scale(.94,.9);filter:drop-shadow(.5cqw 0 0 var(--tb)) drop-shadow(-.5cqw 0 0 var(--ta))}20%{transform:translate(.45cqw,.3cqh) skewX(-12deg) scale(.94,.9);filter:hue-rotate(120deg)}40%{transform:translate(-.25cqw,-.3cqh) scale(1,.8)}60%{transform:none;filter:none}}
@keyframes chjolt{0%{transform:scale(1.2,.7)}50%{transform:translateY(-3.4cqh) scale(.84,1.22)}}
@keyframes chshiver{25%{transform:translateX(-.18cqw)}75%{transform:translateX(.18cqw)}}
@keyframes chwig{25%{transform:rotate(-9deg) translateY(-.6cqh)}75%{transform:rotate(9deg) translateY(-.6cqh)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bubble{background:linear-gradient(180deg,rgba(15,48,33,.96),rgba(5,22,14,.96));border:.12cqw solid rgba(255,255,255,.16);border-left:.35cqw solid var(--gold);color:#fff;border-radius:1cqw 1cqw 1cqw .3cqw;padding:1cqh 1.4cqw 1.1cqh;font:800 1.9cqw/1.15 var(--head);max-width:66cqw;margin-bottom:.4cqw;box-shadow:0 1.4cqh 3cqw rgba(0,0,0,.55);opacity:0;transform:scale(.5);transform-origin:0 100%;transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
#chip.say .bubble{opacity:1;transform:none}
.bubble .mono{display:block;font-size:.85cqw;color:var(--gold);margin-bottom:.4cqh}

/* ---------- join overlay ---------- */
.how{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4cqw;background:rgba(2,12,7,.92);animation:fin .4s}
.how .qr{width:36cqh;height:36cqh}
.how div{font:800 2.6cqw/1.35 var(--head)}
.how b{color:var(--gold)}

/* reduced motion: the show still plays, without shakes, sweeps or flying things */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .card .cc{animation:ccf var(--d) linear forwards!important}.card .cu{animation:cufade var(--d) linear forwards!important;transform:none!important}
  .stamp,.izb,.banner{animation-duration:2s!important}
  .cal{display:none}.wr{opacity:1;animation:none!important}
}
@keyframes cufade{0%{opacity:0}12%,88%{opacity:1}100%{opacity:0}}

/* pitch-off vote meter */
/* audience fun: hot-take poll (between boards) and bingo toasts (any time) */
#hot{position:absolute;right:2.4cqw;bottom:16cqh;width:30cqw;z-index:7;padding:1.8cqh 1.4cqw;border-radius:1.2cqw;background:linear-gradient(180deg,rgba(13,44,29,.96),rgba(3,16,9,.96));box-shadow:0 0 0 .18cqw rgba(255,201,60,.4),0 2cqh 4cqw rgba(0,0,0,.5);transform:translateX(130%);transition:transform .5s cubic-bezier(.2,.9,.3,1.1);pointer-events:none}
#hot.on{transform:none}
/* title lobby: the poll sits in the left column, between the logo and the join pass, so it never covers the LED board */
body[data-phase=title] #hot{left:25cqw;right:auto;bottom:34cqh;width:36cqw;transform:translate(-50%,6cqh);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.1),opacity .4s}
body[data-phase=title] #hot.on{transform:translate(-50%,0);opacity:1}
body:has(.ttl:not(.lob)) #hot{opacity:0}
/* after a board: a slim bar in the bottom-left strip, under the board and clear of the streak dock */
body[data-phase=round] #hot{left:7cqw;right:auto;bottom:2.4cqh;width:44cqw;height:6.6cqh;padding:0 1.4cqw;border-radius:4cqh;display:grid;grid-template-columns:minmax(0,1fr) 20cqw;grid-template-rows:1fr 1fr;column-gap:1.4cqw;align-items:center;transform:translateY(14cqh)}
body[data-phase=round] #hot.on{transform:none}
/* Chip's speech bubble uses the same strip: the poll steps aside while Chip talks */
body[data-phase=round] #hot{transition:transform .5s cubic-bezier(.2,.9,.3,1.1),opacity .3s}
body:has(#chip.say)[data-phase=round] #hot{opacity:0}
body[data-phase=round] #hot .hk{grid-area:1/1;font-size:.8cqw;align-self:end}
body[data-phase=round] #hot .hq{grid-area:2/1;margin:0;font-size:2.8cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:start}
body[data-phase=round] #hot .hr{grid-column:2;margin:0;gap:.5cqw;font-size:1.8cqh}
body[data-phase=round] #hot .hr span{width:9cqw}
body[data-phase=round] #hot .hr u{height:1.4cqh}
body[data-phase=round] #hot .hr b{width:3cqw}
body[data-phase=round] #hot .hf{display:none}
#hot .hk{font:800 .95cqw var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--orange)}
#hot .hq{margin:.6cqh 0 1.4cqh;font:600 3.6cqh/1.15 var(--chalk);color:var(--cream)}
#hot .hr{display:flex;align-items:center;gap:.8cqw;margin-top:.9cqh;font:800 2.2cqh var(--head);color:#fff}
#hot .hr span{width:11cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hot .hr u{flex:1;height:2.2cqh;border-radius:2cqh;background:rgba(255,255,255,.1);overflow:hidden;text-decoration:none}
#hot .hr u i{display:block;height:100%;width:0;border-radius:2cqh;background:linear-gradient(90deg,#ff7a1a,#ffc93c);transition:width .6s}
#hot .hr:last-child u i{background:linear-gradient(90deg,#7cc4ff,#cfeaff)}
#hot .hr b{width:4cqw;text-align:right;color:var(--gold)}
#hot .hf{margin-top:1cqh;font:700 .9cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9fb6a7}
#toasts{position:absolute;left:2.4cqw;bottom:16cqh;z-index:11;display:flex;flex-direction:column;gap:1cqh;pointer-events:none}
.toast{display:flex;align-items:center;gap:1cqw;padding:1.2cqh 1.4cqw 1.2cqh 1cqw;border-radius:1cqw;background:#fff6dd;color:#0b2418;box-shadow:0 1.4cqh 3cqw rgba(0,0,0,.45),inset .35cqw 0 0 #ff7a1a;animation:toast 5.2s cubic-bezier(.2,.9,.3,1.1) forwards}
.toast i{font-style:normal;font-size:5cqh;line-height:1}
.toast small{display:block;font:800 .9cqw var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#d85400}

<script>
'use strict';
const G = window.GAME, KEY = 'replyall_state_v3', stage = document.getElementById('stage'), over = document.getElementById('over'), cardsEl = document.getElementById('cards');
let S = null, key = '', built = null, last = 0, buildT;
const BW = () => document.body.clientWidth, BH = () => document.body.clientHeight;
const rect = el => { const r = el.getBoundingClientRect(), b = document.body.getBoundingClientRect(); return {left: r.left - b.left, top: r.top - b.top, width: r.width, height: r.height}; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const $ = s => stage.querySelector(s), $$ = s => [...stage.querySelectorAll(s)];
const cur = () => S.useCustom && S.custom ? S.custom : G.rounds[S.ri];
const CALM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEAMC = ['#ff7a1a', '#a9dcff'];
const MODE = m => m === 3 ? 'Bonus season / triple budget' : m === 2 ? 'Q4 crunch / double budget' : 'Regular business';
const ENV = '<svg viewBox="0 0 54 40"><path d="M3 5h48v30H3z"/><path d="M3 6l24 18L51 6"/></svg>';
const TICK = '<svg viewBox="0 0 40 40"><path d="M6 21l10 10L34 9"/></svg>';
function qr(url) { try { const q = qrcode(0, 'M'); q.addData(url); q.make(); return `<div class="qr">${q.createSvgTag({cellSize: 4, margin: 0, scalable: true})}</div>`; } catch (e) { return ''; } }
const shortUrl = () => String(S.joinUrl || '').replace(/^https?:\/\//, '').replace(/\?.*$/, '');
// a stock ticker for each team: "Team Synergy" trades as SNRG
function sym(name) {
  const w = String(name).toUpperCase().replace(/[^A-Z ]/g, '').split(/\s+/).filter(x => x && x !== 'TEAM' && x !== 'THE');
  if (!w.length) return 'TEAM'; if (w.length > 1) return w.map(x => x[0]).join('').slice(0, 4).padEnd(3, 'X');
  const s = w[0]; return (s[0] + s.slice(1).replace(/[AEIOU]/g, '')).slice(0, 4).padEnd(3, 'X');
}
const fit = (text, max, k) => Math.min(max, k / Math.max(1, String(text).length));   // font sizes that shrink with long text

// numbers roll instead of jumping
function tween(el, to, ms) {
  if (!el) return; const from = Number(el.dataset.v || 0); if (from === to) { el.textContent = to; return; }
  el.dataset.v = to; const t0 = performance.now(), d = ms || 800;
  (function step(t) { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1 && Number(el.dataset.v) === to) requestAnimationFrame(step); })(t0);
}

// ---------- the stage look follows the show ----------
function look() {
  if (!window.STAGE || !S) return; const p = S.phase;
  const ctl = p === 'round' ? (S.buzz === 0 || S.buzz === 1 ? S.buzz : S.control) : p === 'lightning' ? S.lp : null;
  const alert = p === 'round' && S.strikes >= 3 && !S.awarded ? .45 : 0;
  let o = {a: '#ff7a1a', b: '#a9dcff', k: '#ffc93c', speed: 1, dim: 0, alert, party: 0};
  if (ctl === 0) o = Object.assign(o, {b: '#ff7a1a', k: '#ffd9a8'}); if (ctl === 1) o = Object.assign(o, {a: '#a9dcff', k: '#e6f4ff'});
  if (p === 'title') o.speed = 1.3;
  if (p === 'survey') o = Object.assign(o, {a: '#4fae7a', b: '#ff7a1a', k: '#f6f1e6'});

  STAGE.look(o);
}

// ---------- scenes ----------
function sceneKey() {
  const p = S.phase;
  return p + ':' + (p === 'round' ? (S.useCustom ? 'you' + S.custom.n : S.ri) : p === 'lightning' ? S.li + ':' + S.lreset : p === 'survey' ? S.survey.n + S.survey.st : p === 'title' ? S.sid + (S.phones ? 1 : 0) : '');
}
const hist = [[0], [0]];   // score history per team for the sparklines (this screen's memory only)
// Who is up right now: [team, label] or null. Shared idea with the big screen, so both always agree.
const actT = () => S.phase === 'round' ? (S.buzz === 0 || S.buzz === 1 ? [S.buzz, 'Buzzed in'] : S.control === null || S.awarded ? null : S.strikes >= 3 ? [1 - S.control, 'Stealing'] : [S.control, 'Answering']) : S.phase === 'lightning' ? [S.lp, 'Up now'] : null;

}
function spark(i) {
  const t = $('#t' + i); if (!t) return; const h = hist[i], max = Math.max(10, ...hist[0], ...hist[1]), n = Math.max(2, h.length);
  const pts = h.map((v, k) => `${(k / (n - 1) * 100).toFixed(1)},${(38 - v / max * 30).toFixed(1)}`); if (h.length === 1) pts.push('100,' + (38 - h[0] / max * 30).toFixed(1));
  t.querySelector('polyline').setAttribute('points', pts.join(' ')); t.querySelector('polygon').setAttribute('points', '0,40 ' + pts.join(' ') + ' 100,40');
}
function build() {
  let h = ''; stormStop(); lobbyStop(); winT.splice(0).forEach(clearTimeout); streak = 0;
  if (S.phase === 'title') {
    const su = shortUrl();
    h = `<div class="ttl${CALM ? '' : ' cold'}"><div class="storm"></div>
      <div class="hero"><div class="thread"><i></i>WINTER FEST / RE: RE: FWD: MANDATORY FUN</div>
        <div class="logo"><b>${esc(G.title)}</b><i aria-hidden="true">${esc(G.title)}</i><svg class="swoosh" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path d="M6 20C90 8 220 4 394 12c-120 2-250 8-370 16z"/></svg><div class="badge">9,999</div></div>
        <div class="tsub">${esc(G.subtitle)}</div><div class="ttag">${esc(G.tagline || '')}</div>
        <div class="vs"><span id="n0"></span><em>VS</em><span id="n1"></span></div></div>
      ${S.phones ? `<div class="pass">${qr(S.joinUrl)}<div class="pt"><div class="pl">Winter Fest / all-hands pass</div><div class="ph">Play along on your phone</div><div class="pu" style="font-size:${fit(su, 1.5, 40)}cqw">${esc(su)}</div><div class="pc">Code <b>${esc(S.sid)}</b></div></div></div>` : ''}
      <div class="led glass"><div class="lbar"><span id="lbt">Pre-show</span><em id="lbe">Live</em></div><div class="lbody"></div></div></div>`;
  } else if (S.phase === 'round') {
    const r = cur(), max = Math.max(...r.a.map(a => Number(a[1]) || 0), 1), q = String(r.q);
    hist[0] = [S.teams[0].score]; hist[1] = [S.teams[1].score];
    h = `<div class="hud">${teamHtml(0)}<div class="mid"><div class="lab">${r.mult > 1 ? `<b class="mx">${r.mult === 3 ? 'Triple' : 'Double'} budget x${r.mult}</b>` : 'The budget'}</div><div class="pot gt" data-v="${S.pot}">${S.pot}</div>
        <div class="lamps"><div class="lamp">WARNING</div><div class="lamp">FINAL WARNING</div><div class="lamp">FINAL_FINAL_v2</div></div></div>${teamHtml(1)}</div>
      <div class="subj"><div class="sl">Subject:<span>${S.useCustom ? 'You said / ' + r.n + ' replies' : 'Agenda item ' + (S.ri + 1)}</span></div>
        <div class="q" style="--qfs:${Math.max(1.9, Math.min(2.8, 290 / (q.length + 6)))}cqw">${q.split(' ').map((w, i) => `<span class="w" style="--i:${i}">${esc(w)}</span>`).join(' ')}</div><div class="cls">Classified</div></div>
      <div class="guesses" id="gs"></div>
      <div class="board" style="grid-template-rows:repeat(${Math.ceil(r.a.length / 2)},1fr);--afs:${Math.min(2.7, 96 / Math.max(1, ...r.a.map(a => String(a[0]).length)))}cqw">${r.a.map((a, i) =>
        `<div class="tile t-${i}${S.revealed[i] ? ' open' : ''}" style="--i:${i}"><div class="sh"></div><div class="rk">${i + 1}</div><div class="rd">CLASSIFIED</div>

      <div class="dock"><div class="streak" id="stk"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg><span>Synergy streak x<b>2</b></span></div>
        <div class="mode m${r.mult}"><b>x${r.mult}</b>${esc(S.useCustom ? 'The room has spoken / triple budget' : MODE(r.mult))}</div></div>`;
  } else if (S.phase === 'survey') {
    const v = S.survey, st = v.st, n = Math.max(0, v.count | 0), q = String(v.q || ''), u = shortUrl();
    h = `<div class="sv"><div class="svl"><div class="you gt">You said</div>

  const el = document.getElementById('hot'), h = S.hot, on = !!h && !S.rule && !S.join && !S.vote && ((S.phase === 'title') || (S.phase === 'round' && S.awarded)); el.classList.toggle('on', on); if (!on) return;
  const q = h.q; if (!q) return; const tot = h.c[0] + h.c[1];
  if (el.dataset.i !== String(h.i)) { el.dataset.i = h.i; el.innerHTML = `<div class="hk">Hot take / vote on your phone</div><div class="hq"></div>` + [0, 1].map(() => '<div class="hr"><span></span><u><i></i></u><b>0%</b></div>').join('') + '<div class="hf"></div>'; }
  el.querySelector('.hq').textContent = q[0]; el.querySelectorAll('.hr').forEach((r, i) => { const pc = tot ? Math.round(h.c[i] / tot * 100) : 0; r.querySelector('span').textContent = q[i + 1]; r.querySelector('i').style.width = pc + '%'; r.querySelector('b').textContent = pc + '%'; });
  el.querySelector('.hf').textContent = tot + ' vote' + (tot === 1 ? '' : 's');
}
function toast(t) { const box = document.getElementById('toasts'); if (box.children.length >= 3) box.firstChild.remove(); const d = document.createElement('div'); d.className = 'toast';
  d.innerHTML = `${AV[t[2]] ? `<i>${AV[t[2]]}</i>` : ''}<div><small>${esc(t[0])}</small><b>${esc(t[1])}</b></div>`; box.appendChild(d); setTimeout(() => d.remove(), 5300); if (window.FX) FX.confetti(60); }
function rulesSync() {
  const el = document.getElementById('rules'), r = S.phase === 'title' && S.rule; el.classList.toggle('on', !!r); if (!r) { el.dataset.i = ''; return; }
  if (el.dataset.i === String(r.i)) return; el.dataset.i = r.i;
  el.innerHTML = `<div class="rb"><div class="rk">House rules / ${r.i + 1} of ${r.n} / ${esc(r.k)}</div><h1>${esc(r.h)}</h1><ol>${r.l.map(x => `<li>${esc(x)}</li>`).join('')}</ol><div class="rd">${Array.from({length: r.n}, (_, i) => `<i class="${i <= r.i ? 'on' : ''}"></i>`).join('')}</div></div>`;
}
function voteSync() {
  const el = document.getElementById('vote'), v = S.vote; el.classList.toggle('on', !!v); if (!v) return;
  const tot = v.c[0] + v.c[1], foot = v.open ? 'Vote on your phone now' : v.w === null ? 'Voting opens after both pitches' : v.w < 0 ? 'Tie. The host decides.' : esc(v.n[v.w]) + ' is hired';
  if (!el.firstChild) el.innerHTML = '<div class="vk">Pitch-off / live vote</div><div class="vq"></div><div class="vr">' + [0, 1].map(i => `<div class="c${i}"><div class="vn"><span></span><b>0</b></div><div class="vb"><i></i></div></div>`).join('') + '</div><div class="vf"></div>';
  el.querySelector('.vq').textContent = v.q; el.querySelector('.vf').innerHTML = foot;
  [0, 1].forEach(i => { const c = el.querySelector('.c' + i); c.querySelector('.vn span').textContent = v.n[i]; c.querySelector('.vn b').textContent = v.c[i]; c.querySelector('.vb i').style.width = (tot ? Math.round(v.c[i] / tot * 100) : 0) + '%'; c.classList.toggle('win', v.w === i); });
}

// ---------- link to the host page ----------
// The host sends every update on two links; the sequence number drops the copy. On load this page reads the last saved
// state, so it recovers by itself if either window is refreshed.
function recv(d) {
  if (!d || !d.S || !G) return; if (d.seq && d.seq <= last) return; if (d.seq) last = d.seq;
  S = d.S; const fx = d.fx || {}, k = sceneKey();
  if (k !== key) { key = k; lobbyStop(); clearTimeout(buildT); if (fx.cards && fx.cards.length) buildT = setTimeout(() => { build(); sync(); }, 420); else build(); }   // under a card, swap the scene once the curtains have closed
  if (built === key) sync(); else look();
  if (!moodT && chipBox.dataset.mood !== chipRest()) chipBox.dataset.mood = chipRest(); chipLook(); chipVis();
  const jb = document.getElementById('joinbox'), on = !!(S.join && S.phones); if (on !== jb.classList.contains('on')) { jb.classList.toggle('on', on); jb.innerHTML = on ? `<div class="how">${qr(S.joinUrl)}<div>Play along on your phone.<br>Scan, or open<br><b style="font-size:${fit(shortUrl(), 2.6, 76)}cqw">${esc(shortUrl())}</b><br>code <b style="font-size:4.4cqw">${esc(S.sid)}</b></div></div>` : ''; }
  voteSync(); rulesSync(); hotSync();
  effects(fx);
}
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('replyall') : null;
function toHost(m) { try { if (bc) bc.postMessage(m); } catch (e) {} try { if (window.opener) window.opener.postMessage(m, '*'); } catch (e) {} }
if (bc) bc.onmessage = e => recv(e.data);
window.addEventListener('message', e => recv(e.data));
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.teams) recv({S: s}); } catch (e) {}
toHost({hello: 1}); setInterval(() => toHost({alive: 1}), 2000);
// Buzzer keys pressed while this window has focus go to the host window. Each press carries an id because it travels on two links.
let kn = 0; const kbase = Date.now().toString(36);
document.addEventListener('keydown', e => { if (!e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) toHost({key: e.code, kid: kbase + '-' + (++kn)}); if (/^Page|^Arrow|^Space/.test(e.code)) e.preventDefault(); });
const hint = document.getElementById('hint'); setTimeout(() => hint.style.opacity = 0, 10000);
document.addEventListener('click', () => { hint.style.display = 'none'; if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); });
