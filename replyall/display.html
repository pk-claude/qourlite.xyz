<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>REPLY ALL - Audience screen</title>
<link href="vendor/fonts.css" rel="stylesheet">
<style>
:root{--ink:#0a0a1f;--deep:#14123a;--violet:#6c4cff;--pink:#ff3d8b;--cyan:#2de2e6;--yellow:#ffe14d;--paper:#fff8ea;--red:#e5263a;
  --disp:"Archivo Black","Arial Black",Impact,sans-serif;--body:"Archivo","Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden}
/* ambient office layer: a calendar week grid, a "now" line, faint notification toasts and a typing cursor */
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(90vw 75vh at 6% -12%,rgba(108,76,255,.55),transparent 66%),radial-gradient(75vw 75vh at 106% 112%,rgba(255,61,139,.32),transparent 62%),radial-gradient(45vw 45vh at 55% 52%,rgba(45,226,230,.06),transparent 70%),linear-gradient(180deg,#0e0c2e,var(--ink))}
#bg .cal{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:100% 8.3334vh,20vw 100%}
#bg .day{position:absolute;top:.35vh;font:800 .85vw var(--mono);letter-spacing:.25em;color:rgba(255,255,255,.16)}
#bg .ev{position:absolute;border-radius:.6vw;border-left:.4vw solid currentColor;background:linear-gradient(90deg,currentColor,transparent 140%);opacity:.07;animation:evp 9s steps(6,jump-none) infinite alternate}
#bg .ev b{position:absolute;left:.8vw;top:.8vh;font:800 .9vw var(--mono);letter-spacing:.1em;color:#fff;text-transform:uppercase;white-space:nowrap}
@keyframes evp{to{opacity:.13}}
#bg .now{position:absolute;left:0;right:0;top:0;height:.22vh;background:var(--pink);opacity:.3;animation:now 120s steps(480) infinite}
#bg .now:before{content:"";position:absolute;left:-.1vw;top:-.5vh;width:1.2vh;height:1.2vh;border-radius:50%;background:var(--pink)}
@keyframes now{from{transform:translateY(8vh)}to{transform:translateY(100vh)}}
.toast{position:absolute;bottom:-12vh;width:19vw;display:flex;align-items:center;gap:.8vw;padding:1vh .9vw;border-radius:1vw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);opacity:0;animation:toast 46s linear infinite;font-size:1.1vw;line-height:1.25;white-space:nowrap}
.toast i{flex:none;width:2.4vw;height:2.4vw;border-radius:.6vw;background:currentColor;opacity:.8}
.toast b{display:block;font:800 .8vw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:currentColor}
.toast span{color:var(--paper)}
@keyframes toast{0%{transform:translateY(0);opacity:0}6%{opacity:.2}88%{opacity:.2}100%{transform:translateY(-130vh);opacity:0}}
#bg .type{position:absolute;right:3vw;bottom:4.2vh;font:800 1.25vw var(--mono);letter-spacing:.08em;color:var(--cyan);opacity:.34}
#bg .type i{display:inline-block;width:.7vw;height:1.5vw;margin-left:.2vw;background:var(--cyan);vertical-align:-.25vw;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
body[data-phase=lightning] #bg .type,body[data-phase=winner] #bg .type{display:none}
/* ambient motion is cheap but never free: it rests while a full-screen moment (card, invite, storm, top reply) owns the screen */
body.busy #bg *{animation-play-state:paused}
/* and while a card or invite fully covers the scene, the scene underneath is not painted at all */
body.covered #bg,body.covered #stage{visibility:hidden}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}
#stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:2.2vh 3vw;gap:1.6vh}
#stage.in{animation:scenein .6s cubic-bezier(.2,.9,.2,1)}
#stage.shake{animation:shake .45s}
@keyframes scenein{from{opacity:0;transform:scale(1.06)}}
@keyframes shake{20%{transform:translate(-1.2vw,.6vh) rotate(-.6deg)}40%{transform:translate(1vw,-.8vh) rotate(.5deg)}60%{transform:translate(-.6vw,.4vh)}80%{transform:translate(.4vw,-.2vh)}}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2vh}

/* title */
.re{font-size:1.8vw;color:var(--cyan);display:inline-flex;align-items:center;gap:1vw;background:rgba(10,10,31,.6);border:.12vw solid rgba(45,226,230,.45);border-radius:99px;padding:.8vh 1.8vw .8vh 1.3vw}
.re:before{content:"";width:1vw;height:1vw;border-radius:50%;background:var(--pink);box-shadow:0 0 1vw var(--pink);animation:caret 1.4s steps(1) infinite}
.logow{position:relative}
.nb{position:absolute;right:-3.4vw;top:-2.4vh;min-width:5.2vw;height:5.2vw;padding:0 1vw;border-radius:99px;background:var(--red);color:#fff;font-family:var(--disp);font-size:2.3vw;display:flex;align-items:center;justify-content:center;border:.35vw solid var(--ink);box-shadow:0 .6vh 1.6vw rgba(229,38,58,.6);animation:nb 2.6s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes nb{0%,70%,100%{transform:scale(1) rotate(8deg)}80%{transform:scale(1.25) rotate(-6deg)}}
.logo{font-family:var(--disp);font-size:12vw;line-height:.86;letter-spacing:-.04em;animation:bob 4s ease-in-out infinite}
.logo b{position:relative;font-weight:400;background:linear-gradient(100deg,var(--paper) 20%,var(--yellow) 50%,var(--pink) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* the logo's hard shadow is a second copy of the text, not a filter: a filter on a moving layer is re-run every frame */
.logo{position:relative}.logo i{position:absolute;left:.5vw;top:.6vw;width:100%;font-style:normal;color:rgba(108,76,255,.9)}
@keyframes bob{50%{transform:translateY(-1.2vh) rotate(-1deg)}}
.sub{font-size:2.6vw;font-weight:700}
.tag{font-size:1.6vw;color:var(--yellow);border:2px solid var(--yellow);border-radius:99px;padding:.6vh 1.6vw}
.vs{display:flex;align-items:center;gap:2vw;font-family:var(--disp);font-size:3.4vw}
.vs em{font-style:normal;font-size:2vw;background:var(--pink);border-radius:50%;width:5vw;height:5vw;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.join{display:flex;align-items:center;gap:1.8vw;text-align:left;font-size:2.3vw;line-height:1.35;font-weight:700;border:1px solid rgba(255,255,255,.2);border-radius:1.2vw;padding:1.2vh 1.8vw 1.2vh 1.2vh}
.join b{color:var(--yellow);font-family:var(--mono);letter-spacing:.1em}
.join{background:rgba(20,18,58,.9)}
.vs{text-shadow:0 .3vh 1vw var(--ink),0 0 .4vw var(--ink)}
/* cold open: a reply-all storm. Notifications flood in behind the title, the unread badge climbs, then the logo slams in */
.storm{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.st{position:absolute;width:21vw;display:flex;align-items:center;gap:.8vw;padding:1.1vh .9vw;border-radius:1vw;background:#211d5c;border:.12vw solid rgba(255,255,255,.3);box-shadow:0 .7vh 0 rgba(0,0,0,.38);font-size:1.3vw;line-height:1.25;white-space:nowrap;overflow:hidden;text-align:left;rotate:var(--rot,0deg);animation:stin .5s cubic-bezier(.2,1.2,.35,1) backwards;transition:transform .7s cubic-bezier(.4,0,.8,.4),opacity .7s}
.st.pa{background:var(--paper)}.st.pa span{color:var(--ink)}
.st i{flex:none;width:2.6vw;height:2.6vw;border-radius:.6vw;background:currentColor;display:flex;align-items:center;justify-content:center}
.st i svg{width:1.7vw;height:1.3vw}.st i path{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.st b{display:block;font:800 .85vw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:currentColor}
.st.pa b{color:var(--violet)}
.st span{color:var(--paper);font-weight:700}
.st.out{transform:translate(var(--ox),var(--oy)) scale(.5);opacity:0}
.st.idle{opacity:.6;animation:stdrift 7s steps(20,jump-none) infinite alternate}
@keyframes stin{from{transform:translate(var(--fx),var(--fy)) scale(.7);opacity:0}}
@keyframes stdrift{to{translate:0 -1.8vh}}
.cold .logo{animation:lslam .55s 2.6s backwards cubic-bezier(.2,1.4,.4,1),bob 4s 3.2s ease-in-out infinite}
.cold .nb{animation:nbfly .55s 2.6s backwards cubic-bezier(.3,1.3,.5,1),nb 2.6s 3.2s cubic-bezier(.3,1.6,.5,1) infinite}
.cold .re,.cold .sub,.cold .tag{animation:cin .5s 2.95s backwards cubic-bezier(.3,1.6,.5,1)}
.cold .sub{animation-delay:3.05s}.cold .tag{animation-delay:3.15s}
@keyframes lslam{from{transform:scale(4.5) rotate(-6deg);opacity:0}60%{opacity:1}}
@keyframes nbfly{from{transform:translate(var(--bx,-30vw),var(--by,8vh)) scale(2.3)}}
/* a hard four-position jitter: stepping (and no rotation) means the whole screen is re-composited 25 times a second, not 60 */
#stage.rumble{animation:rumble .16s steps(1) infinite}
@keyframes rumble{0%{transform:none}25%{transform:translate(.22vw,-.2vh)}50%{transform:translate(-.2vw,.28vh)}75%{transform:translate(.12vw,.18vh)}}
.qr{background:#fff;border-radius:.8vw;padding:.6vw;width:15vw;height:15vw;flex:none}
.qr svg{display:block;width:100%;height:100%}
.qr.big{width:19vw;height:19vw}

/* round */
.bar{display:flex;align-items:stretch;gap:1.4vw;height:12.5vh}
.team{flex:1;min-width:0;position:relative;background:rgba(37,33,84,.86);border:.22vw solid rgba(255,255,255,.16);border-radius:1.4vw;padding:0 1.5vw;display:flex;align-items:center;justify-content:space-between;gap:1vw;transition:background .25s,border-color .25s,box-shadow .25s}
.team .tn{font-size:2.2vw;font-weight:900;line-height:1.02;overflow-wrap:anywhere;max-height:11vh;overflow:hidden}.team .ts{font-family:var(--disp);font-size:4.6vw;color:var(--yellow)}
.team small{position:absolute;top:-1.5vh;left:1.4vw;font-size:1.3vw;font-weight:800;background:var(--cyan);color:var(--ink);border-radius:99px;padding:.2vh 1vw;opacity:0;transition:.2s}
.team.ctl{border-color:var(--cyan);box-shadow:0 0 3vw rgba(45,226,230,.45)}.team.ctl small{opacity:1}
.team.buzz{background:var(--pink);border-color:var(--paper);animation:pulse .45s 5;box-shadow:0 0 5vw var(--pink)}
.team.buzz .ts{color:var(--paper)}
@keyframes pulse{50%{transform:scale(1.05)}}
.mid{width:31vw;flex:none;display:flex;align-items:center;justify-content:center;gap:1.6vw}
.mid .mono{font-size:1.3vw;color:var(--cyan)}
.pot{font-family:var(--disp);font-size:5.4vw;line-height:1}
.rc{display:flex;flex-direction:column;align-items:center;gap:.7vh}
.mid .rcl{transition:color .2s}.mid .rcl.bad{color:var(--red);font-weight:800}
.slots{display:flex;gap:.7vw}
/* strike slots are little envelopes; a strike turns one into a red "recall failed" badge */
.slots i{position:relative;overflow:hidden;width:4.5vw;height:3.4vw;border:.26vw solid rgba(255,255,255,.3);border-radius:.6vw;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-style:normal;font-size:2.6vw;line-height:1;color:transparent}
.slots i:before{content:"";position:absolute;left:50%;top:0;width:3.2vw;height:3.2vw;margin:-1.6vw 0 0 -1.6vw;border:solid rgba(255,255,255,.3);border-width:0 .26vw .26vw 0;transform:scaleY(.62) rotate(45deg)}
.slots i.on{background:var(--red);border-color:#ff8a96;color:#fff;animation:slam .35s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 2vw rgba(229,38,58,.8)}
.slots i.on:before{display:none}
@keyframes slam{from{transform:scale(3.4) rotate(-14deg);opacity:0}}
.agenda{text-align:center;height:15vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh}
.agenda .mono{font-size:1.4vw;color:var(--yellow)}
.q{font-size:3vw;font-weight:900;line-height:1.1;max-width:90vw;opacity:0;transform:translateY(1.5vh);transition:.45s}
.q.on{opacity:1;transform:none}
.board{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:1.3vh 1.4vw;min-height:0}
.tile{position:relative;min-height:0;perspective:95vw;transition:scale .28s cubic-bezier(.3,1.6,.5,1)}
#stage.deal .tile{animation:deal .6s cubic-bezier(.2,1.25,.35,1) backwards;animation-delay:calc(var(--i)*65ms + 80ms)}
@keyframes deal{from{opacity:0;transform:translateX(-9vw) skewX(10deg)}}
.tile .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.tile.open .in{transform:rotateX(180deg)}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:1.1vw;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;overflow:hidden}
/* unopened: an unread row in the inbox, sealed envelope on the right */
.tile .f{gap:1.5vw;padding:0 1.8vw 0 2vw;background:linear-gradient(180deg,#2b2768,#17153f);border:.18vw solid rgba(255,255,255,.18);box-shadow:inset 0 .35vh 0 rgba(255,255,255,.1)}
.tile .f:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.6vw;background:var(--cyan);box-shadow:0 0 1.4vw var(--cyan)}
.tile .f span{flex:none;font-family:var(--disp);font-size:3.2vw;line-height:1;width:5vw;height:5vw;border-radius:50%;background:var(--ink);color:var(--cyan);display:flex;align-items:center;justify-content:center;border:.2vw solid var(--cyan)}
.tile .sk{flex:1;display:flex;flex-direction:column;gap:1.5vh;min-width:0}
.tile .sk i{display:block;height:1.5vh;border-radius:99px;background:rgba(255,255,255,.3)}
.tile .sk i+i{background:rgba(255,255,255,.13)}
.tile .env{flex:none;width:5.4vw;height:4vw;overflow:visible}
.tile .env path{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.5);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.tile .env circle{fill:var(--pink)}
/* opened: the letter itself */
.tile .b{transform:rotateX(180deg);background:var(--paper);color:var(--ink);justify-content:space-between;padding:0 .7vw 0 1.9vw;gap:1vw;font-size:2.7vw;font-weight:900;line-height:1.05;box-shadow:0 0 2.4vw rgba(255,225,77,.55)}
.tile .b:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.6vw;background:var(--yellow)}
.tile .b:after{content:"";position:absolute;top:-30%;bottom:-30%;left:-35%;width:26%;background:linear-gradient(90deg,transparent,rgba(255,225,77,.85),#fff,rgba(255,225,77,.85),transparent);transform:skewX(-22deg);opacity:0}
.tile .b em{flex:none;font-style:normal;font-family:var(--disp);background:var(--ink);color:var(--yellow);border-radius:.8vw;padding:1vh 0;min-width:6vw;text-align:center;font-size:3vw}
.tile.flash{scale:1.045;z-index:2}
.tile.flash .b{animation:flash .9s}
.tile.flash .b:after{animation:sweep .6s .28s cubic-bezier(.4,0,.2,1)}
.tile.flash .b em{animation:pop .45s .2s backwards cubic-bezier(.3,1.7,.5,1)}
@keyframes flash{30%{box-shadow:0 0 6vw 1vw var(--yellow)}}
@keyframes sweep{from{left:-35%;opacity:.9}to{left:125%;opacity:.9}}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
.strip{height:10vh;flex:none}

/* reveal drama: a short anticipation beat on the sealed row (shake, shimmer, the seal pops), then the flip, the points count up and a burst in the colour of the team that has the floor */
#t0{--tc:var(--cyan)}#t1{--tc:var(--pink)}
.team:after{content:"";position:absolute;left:1.6vw;right:1.6vw;bottom:0;height:.55vh;border-radius:99px 99px 0 0;background:var(--tc)}
.tile .op{position:absolute;left:8.6vw;top:50%;margin-top:-1.1vw;font:800 1.5vw/2.2vw var(--mono);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--yellow);opacity:0}
.tile .f:after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-22deg);opacity:0}
.tile.ant .f{border-color:var(--yellow);animation:tant var(--ant,.3s) linear}
.tile.ant .f:before{background:var(--yellow);box-shadow:0 0 1.4vw var(--yellow)}
.tile.ant .f:after{opacity:1;animation:shim var(--ant,.3s) linear forwards}
.tile.ant .f span{color:var(--yellow);border-color:var(--yellow)}
.tile.ant .sk{opacity:.16}.tile.ant .op{opacity:1}
.tile.ant .env{animation:envj var(--ant,.3s)}
.tile.ant .env path{stroke:var(--yellow)}
.tile.ant .env circle{transform-box:fill-box;transform-origin:50% 50%;animation:seal var(--ant,.3s) forwards}
@keyframes tant{15%{transform:translateX(-.3vw) rotate(-.5deg)}30%{transform:translateX(.3vw) rotate(.5deg)}45%{transform:translateX(-.26vw) rotate(-.4deg)}60%{transform:translateX(.24vw) rotate(.35deg)}75%{transform:translateX(-.16vw)}90%{transform:translateX(.1vw)}}
@keyframes shim{to{left:112%}}
@keyframes seal{45%{transform:scale(2.1)}100%{transform:translateY(-1.6vh) scale(0)}}
@keyframes envj{35%{transform:rotate(-9deg) scale(1.12)}70%{transform:rotate(7deg) scale(1.16)}}
.tile.flash .b>span{transform-origin:0 50%;animation:tslam .3s .06s backwards cubic-bezier(.2,1.5,.4,1)}
@keyframes tslam{from{transform:translateX(1.4vw) scale(1.32);opacity:0}45%{opacity:1}}
/* the number-one answer: the room dims, a ceiling spot swings onto the row and it gets a ribbon */
.tile .tr{position:absolute;z-index:3;right:7.4vw;top:-1.5vh;font:800 1vw/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:#fff;background:var(--red);border:.2vw solid var(--ink);padding:.6vh 1.5vw .6vh .8vw;rotate:3deg;clip-path:polygon(0 0,100% 0,calc(100% - .7vw) 50%,100% 100%,0 100%);opacity:0;pointer-events:none}
.tile.open .tr{opacity:1}
.tile.flash .tr{animation:mslam .4s .55s backwards cubic-bezier(.2,1.5,.4,1)}
.tile.top{z-index:4}
.tile.top.flash{scale:1.07}
.spot{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(4,4,15,.68);animation:spot 1.75s forwards}
@keyframes spot{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
.spot i{position:absolute;top:0;background:linear-gradient(rgba(255,244,190,.06),rgba(255,244,190,.4));clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;animation:cone .55s .06s backwards cubic-bezier(.2,1.25,.4,1)}
@keyframes cone{from{transform:rotate(-42deg);opacity:0}}
/* board cleared: a ripple down the rows */
.tile.wv{scale:1.04;z-index:2}
.tile.wv .b:after{animation:sweep .55s cubic-bezier(.4,0,.2,1)}
.agenda .mono.iz{background:var(--yellow);color:var(--ink);font-weight:800;border-radius:99px;padding:.5vh 1.5vw;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.pb{position:fixed;left:0;top:0;z-index:4;pointer-events:none}
.pb i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:var(--br,.15vw);background:currentColor;animation:pb var(--t,.7s) cubic-bezier(.12,.75,.3,1) forwards}
@keyframes pb{0%{transform:translate(var(--x0),var(--y0)) scale(.4)}75%{opacity:1}100%{transform:translate(var(--x1),var(--y1)) rotate(var(--pr)) scale(.35);opacity:0}}

/* "You said" survey: a live inbox. The answer count is the unread badge, envelopes fly into the tray, the QR sits in a "Join the thread" card */
.sv{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vh}
.svh{flex:none;height:12vh;display:flex;align-items:center;gap:2.4vw}
.you{font-family:var(--disp);font-size:6.6vw;line-height:.9;color:var(--yellow);filter:drop-shadow(.3vw .4vw 0 var(--violet));white-space:nowrap}
.svh .re{font-size:1.5vw}
.svm{flex:1;min-height:0;display:flex;gap:1.5vw}
.ibx,.jt{display:flex;flex-direction:column;min-height:0;background:var(--paper);color:var(--ink);border-radius:1.6vw;box-shadow:0 3vh 6vw rgba(0,0,0,.5),0 0 0 .3vw rgba(255,255,255,.22)}
.ibx{flex:1;min-width:0}
.jt{flex:none;width:35vw}
.sv .ibar{flex:none}
.sv .ibar em{font-style:normal;font-weight:800;background:rgba(255,255,255,.14);border-radius:99px;padding:.3vh 1vw;display:flex;align-items:center;gap:.6vw}
.sv-open .ibar em{background:var(--red);color:#fff}
.sv-open .ibar em:before{content:"";width:.8vw;height:.8vw;border-radius:50%;background:#fff;animation:caret 1.2s steps(1) infinite}
.ibd{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.8vh 1.8vw 2vh}
.subj{flex:none;border-bottom:.2vw solid rgba(10,10,31,.14);padding-bottom:1.4vh}
.sq{font-family:var(--disp);line-height:1.06;margin:.4vh 0 .6vh;min-height:7.4vh;display:flex;align-items:center}

#chip[data-mood=wince] .e-x,#chip[data-mood=wince] .m-w,#chip[data-mood=wince] .x-w,#chip[data-mood=shock] .e-o,#chip[data-mood=shock] .m-o,#chip[data-mood=shock] .x-o,

#joinbox{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,10,31,.93)}#joinbox.on{display:flex}

}
