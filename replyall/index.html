<style>
*{box-sizing:border-box}
:root{--ink:#0a0a1f;--deep:#14123a;--violet:#6c4cff;--pink:#ff3d8b;--yellow:#ffe14d;--line:#dcd8ee;--mute:#6a6690;--bg:#f3f1fa}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--deep);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14px}
button,select,input{font:inherit}
button{border:1px solid #b9b4d6;background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--deep)}
button:hover{background:#ece8ff}
button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
button.go{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:600}
button.bad{background:#e5263a;color:#fff;border-color:#e5263a;font-weight:600}
button.fun{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:600}
button.wide{display:block;width:100%;margin-top:6px}
button.big{font-size:16px;padding:10px 14px}
button:disabled{opacity:.4;cursor:default}
kbd{display:inline-block;min-width:19px;text-align:center;border:1px solid #b9b4d6;border-bottom-width:2px;border-radius:4px;font:600 11px Consolas,monospace;padding:0 3px;background:#f6f4ff;color:var(--deep)}
.muted{color:var(--mute);font-size:12.5px}
.err{background:#ffe2e5;border:2px solid #e5263a;padding:16px;margin:20px;border-radius:10px;font-size:17px}

/* shell: run of show on the left, scoreboard on top, one stage in the middle, Chip docked at the bottom */
#app{display:grid;grid-template-columns:196px 1fr;height:100vh}
nav{background:var(--ink);color:#fff8ea;display:flex;flex-direction:column;padding:12px 10px;gap:3px;overflow:auto}
nav h1{font-size:18px;margin:0 4px 2px;letter-spacing:.02em}
nav .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8f8ab8;margin:10px 4px 3px}
nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border-color:transparent;color:#d9d6f0;padding:6px 8px}
nav button:hover{background:#1d1b47}
nav button i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #6f6a9c;font:600 11px/17px "Segoe UI",sans-serif;text-align:center;font-style:normal}

#gagMenu{position:fixed;z-index:50;width:292px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 34px rgba(10,10,31,.28);display:none}

#gagMenu button span{display:block;font-size:12px;color:var(--mute)}
#gagMenu button.fun{margin-top:4px;text-align:center}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.tm.r{flex-direction:row-reverse}

.stage{flex:1;overflow:auto;padding:12px 14px}
.three{display:grid;grid-template-columns:236px 1fr 236px;gap:12px;align-items:start}
.three.even{grid-template-columns:1fr 1fr 1fr}
.one{max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card>h2{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 10px}
.card>h2 b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--deep);color:#fff;font:700 12px/22px "Segoe UI",sans-serif;text-align:center;letter-spacing:0}

.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.ans button small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.ans button.done{background:#e6e3f2;color:#8582a3}
.ans button.done span>u{text-decoration:line-through}
.ans button span>u{text-decoration:none}
.strike{display:flex;gap:8px;align-items:center}
.strike input{flex:1;min-width:0;padding:7px}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:22px;border-radius:5px;border:2px solid #d4b9be;font:800 13px/18px "Segoe UI",sans-serif;text-align:center;color:transparent;font-style:normal}
.pips i.on{background:#e5263a;border-color:#e5263a;color:#fff}
details{margin-top:10px}details summary{cursor:pointer;color:var(--mute);font-size:12.5px}
details .row{margin-top:8px}
.pot{font-size:44px;font-weight:800;line-height:1;text-align:center}
.pot small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
#roastBox:not(:empty){margin-top:10px;padding:8px 10px;border:2px dashed var(--pink);border-radius:8px;background:#fff0f6}
.plist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:150px;overflow:auto}
.plist label{border:1px solid #b9b4d6;border-radius:6px;padding:2px 7px;background:#fff3c4}
.plist label.ok{background:#dff5e7;border-color:#1f9d55}
.code{font:800 34px Consolas,monospace;letter-spacing:.12em;text-align:center}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;text-align:center;padding:5px;border-radius:99px;background:#f1eff8;color:var(--mute);font-size:12.5px}
.steps span.cur{background:var(--deep);color:#fff;font-weight:600}
.grp .row{flex-wrap:nowrap}.grp input.t{flex:1;padding:5px}.grp input.p{width:64px;padding:5px;text-align:center}
.bigtxt{font-size:26px;font-weight:700}
input.wide{flex:1;min-width:200px;padding:7px}
table.l{width:100%;border-collapse:collapse;margin-top:10px}
table.l th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:4px}
table.l td{padding:5px 4px;border-top:1px solid #e8e5f3;vertical-align:top}
table.l td.act,table.l th.act{background:#f3f0ff}
table.l input.t{width:150px;padding:4px}table.l input.p{width:52px;padding:4px;text-align:center}
table.l input.dup{border:2px solid #e5263a;background:#ffe2e5}
.chips button{padding:1px 6px;font-size:12px;margin:2px 2px 0 0}
.dock{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--deep);color:#fff8ea}
.dock input{flex:1;min-width:120px;padding:6px;border-radius:8px;border:0}
.dock .muted{color:#b9b5dc;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chipLast{font-style:italic}

</head>
<body>
<div id="app"></div>
<script>
const G = window.GAME, app = document.getElementById('app'), KEY = 'replyall_state_v3';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE = m => m === 3 ? 'Bonus season: triple budget' : m === 2 ? 'Q4 crunch: double budget' : 'Regular business';
const STAMPS = ['NOTED.', 'SEE ME.', 'PER MY LAST EMAIL'];

// ---------- question file check ----------
function problems() {
  if (!G) return ['The file questions.js could not be read. It probably has a missing comma, quote or bracket.'];
  const out = [], bad = (a) => !Array.isArray(a) || !a.length || a.some(x => !Array.isArray(x) || typeof x[0] !== 'string' || typeof x[1] !== 'number');
  (G.rounds || []).forEach((r, i) => { if (!r.q || bad(r.a)) out.push('Main round ' + (i + 1) + ' has a broken question or answer list.'); });
  (G.lightning || []).forEach(s => { if (!s.qs || s.qs.length !== 5) out.push('Final round ' + s.name + ' must have exactly 5 questions.'); else s.qs.forEach((q, i) => { if (!q.q || bad(q.a)) out.push('Final round ' + s.name + ' question ' + (i + 1) + ' is broken.'); }); });
  if (!G.rounds || G.rounds.length < 4) out.push('There must be at least 4 main rounds.');
  if (!G.lightning || !G.lightning.length) out.push('There is no final round set.');
  if (!Array.isArray(G.room) || !G.room.length) out.push('The "room" list (You said questions) is missing or empty.');
  return out;
}
const probs = problems();
if (probs.length) { app.innerHTML = '<div class="err"><b>Question file problem.</b><br>' + probs.map(esc).join('<br>') + '<br><br>Undo the last change to questions.js (or restore your backup copy) and reload this page.</div>'; throw new Error('bad questions.js'); }
const LINES = G.chip || {};

// ---------- state ----------
const ONLINE = /^http/.test(location.protocol);
const pref = (k, d) => localStorage.getItem('replyall_' + k) || d, setPref = (k, v) => localStorage.setItem('replyall_' + k, v);
const newSid = () => Array.from({length: 4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
// The join code stays the same across reloads and new games, so a QR code people already scanned keeps working.
function sid() { let s = pref('sid', ''); if (!/^[A-Z0-9]{4}$/.test(s)) { s = newSid(); setPref('sid', s); } return s; }
const joinUrl = s => location.origin + location.pathname.replace(/[^/]*$/, '') + 'buzz/?c=' + s;
const blankLa = () => [0, 1].map(() => Array.from({length: 5}, () => ({t: '', p: 0, st: false, sp: false})));
const fresh = () => ({teams: G.teams.map(n => ({name: n, score: 0})), phase: 'title', ri: 0, useCustom: false, custom: null, revealed: [], counted: [], strikes: 0, pot: 0, awarded: false, control: null,
  buzzOpen: false, buzz: null, buzzPid: null, showQ: false, li: 0, lp: 0, la: blankLa(), lq: null, hideP1: false, timer: 20, lreset: 0, lend: null,
  items: 0, allowed: {}, survey: null, rx: true, join: false, back: null, phones: ONLINE, sid: sid(), joinUrl: joinUrl(sid())});
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
let resumed = !!(S && S.teams && (S.phase !== 'title' || S.teams.some(t => t.score)));
if (!S || !S.teams || !G.rounds[S.ri] || !G.lightning[S.li]) { S = fresh(); resumed = false; }
S.buzzOpen = false; if (S.rx === undefined) S.rx = true;
// Each game code has its own relay room, so two hosts never overwrite each other.
const room = () => 'ra-' + S.sid.toLowerCase();
const cur = () => S.useCustom && S.custom ? S.custom : G.rounds[S.ri];
let dupHost = false, win = null, tick = null, said = '', chipLast = '', pending = null, busy = false, note = '', lastAlive = 0, seq = 0;
let phones = [], answers = [], phoneErr = '';

// ---------- link to the audience screen ----------
// Every update goes out twice: on a broadcast channel (survives a refresh of either window) and straight to the window this page opened.
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('replyall') : null;
function push(fx) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  seq = Math.max(seq + 1, Date.now()); const m = {S, fx: fx || {}, seq};
  try { if (bc) bc.postMessage(m); } catch (e) {} try { if (win && !win.closed) win.postMessage(m, '*'); } catch (e) {}
  postState();
}
function up(fx) { push(fx); render(); }
function fromScreen(d, src) {
  if (!d || d.S) return;
  if (d.hello || d.alive) { const was = alive(); lastAlive = Date.now(); if (d.hello) { if (src) win = src; push(); } if (!was) audLight(); }
  if (d.key) handleKey(d.key);
  if (d.host === '?') { try { bc.postMessage({host: 'here'}); } catch (e) {} }
  if (d.host === 'here' && !dupHost) { dupHost = true; render(); }
}
if (bc) bc.onmessage = e => fromScreen(e.data);
window.addEventListener('message', e => fromScreen(e.data, e.source));
const alive = () => Date.now() - lastAlive < 5000;
setInterval(audLight, 1000);

// ---------- undo ----------
const hist = [], timers = [];
function snap() { hist.push(JSON.stringify(S)); if (hist.length > 60) hist.shift(); }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearLater() { timers.splice(0).forEach(clearTimeout); }

// ---------- sound ----------
// All music and effects are synthesized in sound.js. If that file is missing the game still runs, silently.
const SFX = window.SFX || new Proxy({}, {get: () => () => {}});

// ---------- voices ----------
let current = null;
function tts(text, chipVoice) { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text), v = speechSynthesis.getVoices().find(x => x.name === pref('voice', '')); if (v) u.voice = v; u.rate = chipVoice ? 1.08 : .95; u.pitch = chipVoice ? 1.45 : 1; speechSynthesis.speak(u); }
function speak(id, text) { stopVoice(); const a = new Audio('audio/' + id + '.mp3'); current = a; const fb = () => { if (current === a) tts(text); }; a.onerror = fb; a.play().catch(fb); }
function stopVoice() { if (current) { current.pause(); current = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (S.phase === 'title') render(); };

// ---------- Chip, the AI intern ----------
// Chip shows every line as text. He speaks out loud only for "big" lines unless the host picks Everything.
function chip(text, big) {
  if (!text) return; chipLast = text; push({chip: text}); const el = document.getElementById('chipLast'); if (el) el.textContent = text;
  const mode = pref('chip', 'highlights'); if (mode === 'all' || (mode === 'highlights' && big)) { if (window.speechSynthesis) speechSynthesis.cancel(); tts(text, true); }
}
// Lines are dealt like a shuffled deck: none repeats until its whole list has been used.
const bags = {};
function draw(k) { if (!bags[k] || !bags[k].length) bags[k] = (LINES[k] || []).slice().sort(() => Math.random() - .5); return bags[k].pop(); }
const chipLine = (k, big) => chip(draw(k), big);
// A live AI line is never sent to the big screen directly. It waits here for the scorekeeper to read and send.
const roundKey = () => S.phase + (S.useCustom ? 'you' : S.ri);
async function roast(answer, question) {
  if (!ONLINE || !answer.trim()) return; const k = roundKey();
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch('/api/quip', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question, answer}), signal: ctl.signal}); clearTimeout(t);
    const j = await r.json(); if (!r.ok || !j.text || roundKey() !== k) return; pending = String(j.text); setRoast();
  } catch (e) {}
}
const roastHtml = () => pending ? 'Chip wrote a live line about that answer: <b>' + esc(pending) + '</b> <button class="fun" onclick="A.roastSend()">Send to screen</button> <button onclick="A.roastDrop()">Discard</button>' : '';
function setRoast() { const el = document.getElementById('roastBox'); if (el) el.innerHTML = roastHtml(); }

// ---------- buzzers ----------
// Keyboard: a letter or number key on the left half = team 1, right half = team 2.
// A presenter clicker (Page Up / Page Down) = team 1. A number pad = team 2.
const LEFT = new Set('Backquote Digit1 Digit2 Digit3 Digit4 Digit5 KeyQ KeyW KeyE KeyR KeyT KeyA KeyS KeyD KeyF KeyG KeyZ KeyX KeyC KeyV KeyB PageUp PageDown'.split(' '));
const isRight = c => /^(Digit[6-90]|Key[YUIOPHJKLNM]|Minus|Equal|Bracket|Backslash|Semicolon|Quote|Comma|Period|Slash|Arrow|Numpad(?!Enter))/.test(c);
function buzzIn(t, pid) { if (!S.buzzOpen || S.phase !== 'round') return false; S.buzz = t; S.buzzPid = pid || null; S.buzzOpen = false; if (S.control === null) S.control = t; SFX.buzz(); up(); return true; }
function buzzKey(code) { return LEFT.has(code) ? buzzIn(0) : isRight(code) ? buzzIn(1) : false; }
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !typing) { e.preventDefault(); return A.undo(); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (handleKey(e.code)) e.preventDefault();
});
// Also called for keys pressed while the big screen window has the focus.
function handleKey(code) {
  if (S.buzzOpen) return buzzKey(code);
  if (S.phase === 'round') { const m = /^(?:Digit|Numpad)([1-8])$/.exec(code); if (m && cur().a[m[1] - 1] && !S.revealed[m[1] - 1]) { A.reveal(m[1] - 1); return true; } if (code === 'KeyX') { A.strike(); return true; } }
  if (S.phase === 'lightning' && code === 'Space') { A.lnext(); return true; }
  return false;
}

// Phones: each phone posts to this site's relay; this page reads the relay and posts back what phones should show.
const seen = new Set(), EMOJI = {clap: '\u{1F44F}', laugh: '\u{1F602}', groan: '\u{1F62C}', fire: '\u{1F525}'}; let polling = false, first = true, armed = false;
async function pollPhones(countBuzzes) {
  if (!ONLINE || polling) return; polling = true;
  try {
    const r = await fetch('/api/relay?room=' + room() + '&k=up&sid=' + S.sid, {cache: 'no-store'}); if (!r.ok) throw 0;
    const msgs = (await r.json()).msgs.map(m => { try { return JSON.parse(m); } catch (e) { return {}; } }).filter(m => m && m.id && /^[a-z0-9-]{1,32}$/i.test(m.p || ''));
    const fresh = msgs.filter(m => !seen.has(m.id)); msgs.forEach(m => seen.add(m.id));
    const now = Date.now();
    phones = msgs.filter(m => m.k === 'join' && now - m.t < 8 * 3600e3).map(m => ({p: m.p, team: m.team === 0 || m.team === 1 ? m.team : 2, name: String(m.name || '').slice(0, 14)})).sort((a, b) => a.team - b.team || a.name.localeCompare(b.name));
    const reacts = fresh.filter(m => m.k === 'react' && EMOJI[m.e]).map(m => EMOJI[m.e]);
    if (reacts.length && !first && S.rx) push({react: reacts.slice(0, 6)});
    if (S.survey && S.survey.st === 'open') { answers = msgs.filter(m => m.k === 'ans' && m.q === S.survey.n && typeof m.a === 'string' && m.a.trim()).map(m => m.a.trim().slice(0, 30));
      if (answers.length !== S.survey.count) { S.survey.count = answers.length; push(); const el = document.getElementById('scount'); if (el) el.textContent = answers.length; } }
    // Only phones the scorekeeper approved can buzz.
    if (countBuzzes) { const b = fresh.filter(m => m.k === 'buzz' && S.allowed[m.p] && (m.team === 0 || m.team === 1)).sort((a, b) => (a.rt || a.t) - (b.rt || b.t))[0]; if (b) buzzIn(b.team, b.p); }
    first = false; phoneErr = '';
  } catch (e) { phoneErr = ' Phones are not reachable right now. Keyboard buzzers still work.'; }
  polling = false; setPhones();
}
let lastState = '';
function postState() {
  if (!ONLINE) return;
  const st = {sid: S.sid, names: S.teams.map(t => t.name), open: S.buzzOpen, buzz: S.buzz, first: S.buzzPid, ok: Object.keys(S.allowed).filter(k => S.allowed[k]), survey: S.survey && S.survey.st === 'open' ? {n: S.survey.n, q: S.survey.q} : null,
    q: S.phase === 'round' && S.showQ ? cur().q : null, scores: S.teams.map(t => t.score)};
  const j = JSON.stringify(st); if (j === lastState) return; lastState = j;
  fetch('/api/relay?room=' + room() + '&k=state', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(Object.assign({id: 's' + Date.now()}, st))}).catch(() => { lastState = ''; });
}
setInterval(() => { if (S.buzzOpen && armed) pollPhones(true); }, 300);
setInterval(() => { if (!S.buzzOpen) pollPhones(false); }, 1000);
setInterval(() => { lastState = ''; postState(); }, 30000);

// ---------- the "You said" round: turn the room's answers into a board ----------
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/^(the|a|an|some|my|our) /, '').replace(/s$/, '').trim();

    ${resumed ? '<span class="status warn" style="margin:0 0 10px">Picked up the saved game from last time. <button onclick="resumed=false;render()">Keep going</button> <button onclick="resumed=false;A.newGame()">Start a new game</button></span>' : ''}`;

  if (ph === 'title') {
    h += `<div class="three even"><div class="card"><h2><b>1</b>Big screen</h2>
        <p>Press <kbd>Win</kbd>+<kbd>P</kbd> and choose <b>Extend</b>. Open the big screen, drag it onto the projector and click it once for full screen.</p>
        <button class="${alive() ? '' : 'go'} wide" onclick="A.open()">${alive() ? 'Open it again' : 'Open big screen'}</button>
        <p class="muted">The button at the bottom left turns green when both windows are linked. They relink by themselves after a refresh.</p></div>
      <div class="card"><h2><b>2</b>Sound and Chip</h2>
        <div class="row"><button onclick="SFX.theme()">Test sound</button><button onclick="tts('Testing, one two three')">Test voice</button><button class="fun" onclick="A.hello()">Chip says hello</button></div>
        <p><label>Voice <select onchange="setPref('voice',this.value)" style="max-width:100%"><option value="">Browser default</option>${voices.map(v => `<option ${v.name===vsel?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label></p>
        <p><label>Chip speaks out loud <select onchange="setPref('chip',this.value)"><option value="off" ${cm==='off'?'selected':''}>Never (text only)</option><option value="highlights" ${cm==='highlights'?'selected':''}>Big moments</option><option value="all" ${cm==='all'?'selected':''}>Everything</option></select></label></p>
        <p class="muted">Keys in a round: <kbd>1</kbd>-<kbd>8</kbd> reveal, <kbd>X</kbd> strike. In the final: <kbd>Space</kbd> reveals the next item.</p></div>
      <div class="card"><h2><b>3</b>Phones</h2>${ONLINE ? `<div class="code">${S.sid}</div><p class="muted" style="text-align:center">People scan the QR code on the big screen. Tick the phones that may buzz. <a href="#" onclick="A.newCode();return false">New code</a></p>` : ''}
        <div id="phonesBox" data-full="1">${phonesHtml(true)}</div></div></div>`;
  }

  if (ph === 'winner') {
    h += `<div class="one card"><h2>The winner is on the big screen</h2><p>Scores can still be corrected at the top. The certificate updates as you type.</p>
      <div class="row"><button class="fun" onclick="chipLine('win', true)">Chip congratulates again</button><button onclick="A.newGame()">Start a new game</button></div></div>`;
  }

  if (ph === 'round') {
    const canSteal = S.strikes >= 3 && S.control !== null && !S.awarded, o = S.control === null ? 0 : 1 - S.control, all = r.a.every((_, i) => S.revealed[i]);
    h += `<div class="three"><div class="card"><h2><b>1</b>Face-off</h2>
        ${S.buzzOpen ? '<button class="big wide" onclick="A.buzzClear()">Close buzzers</button><p class="muted">While open, keyboard keys are buzzers. Click an answer to close them.</p>' : '<button class="go big wide" onclick="A.buzzOpen()">Open buzzers</button>'}
        <span class="status ${S.buzzOpen || S.buzz !== null ? 'hot' : ''}">${S.buzzOpen ? 'Open. Waiting...' : S.buzz !== null ? esc(S.teams[S.buzz].name) + ' buzzed first' : 'Buzzers closed'}</span>
        <p class="muted" style="margin-top:12px">Who plays this board?</p>
        ${S.teams.map((t, i) => `<button class="wide ${S.control === i ? 'on' : ''}" onclick="A.control(${i})">${esc(t.name)}</button>`).join('')}
        <p id="phonesBox" class="muted" style="margin-top:12px">${phonesHtml()}</p></div>
      <div class="card"><h2><b>2</b>The board</h2>
        <div class="qhead"><div class="qtext">${esc(r.q)}</div><button class="${S.showQ ? 'on' : 'go'}" onclick="A.showQ()">${S.showQ ? 'Question is showing' : 'Show question'}</button><button onclick="A.read()">Read aloud</button></div>
        <div class="ans" style="grid-template-rows:repeat(${Math.ceil(r.a.length / 2)},auto)">${r.a.map((a, i) => `<button class="${S.revealed[i]?'done':''}" onclick="A.reveal(${i})" title="${S.revealed[i] ? 'Click to hide again' : 'Click to reveal'}"><span><kbd>${i+1}</kbd> <u>${esc(a[0])}</u>${a[2] ? `<small>also: ${esc(a[2])}</small>` : ''}</span><b>${a[1]}</b></button>`).join('')}</div>
        <div class="strike"><input value="${esc(said)}" oninput="A.said(this.value)" placeholder="Wrong answer they gave (optional, Chip drafts a line)" onkeydown="if(event.key==='Enter')A.strike()">
          <button class="bad" onclick="A.strike()" ${S.strikes >= 3 ? 'disabled' : ''}>Strike <kbd>X</kbd></button><span class="pips">${[0, 1, 2].map(i => `<i class="${i < S.strikes ? 'on' : ''}">X</i>`).join('')}</span></div>
        <div id="roastBox">${roastHtml()}</div>
        <details ${more ? 'open' : ''} ontoggle="more=this.open"><summary>More</summary><div class="row"><button onclick="A.wrong()">Wrong answer, no strike</button><button onclick="A.clearStrikes()" ${S.strikes ? '' : 'disabled'}>Clear strikes</button>
          <button onclick="A.takeover()">Replay takeover card</button><button onclick="stopVoice()">Stop voice</button></div></details></div>
      <div class="card"><h2><b>3</b>The budget</h2><div class="pot">${S.pot}<small>points on this board</small></div>
        ${S.awarded ? `<span class="status">Given</span><button class="wide" onclick="A.rest()" ${all ? 'disabled' : ''}>Reveal the rest</button>`
          : canSteal ? `<span class="status warn">Three strikes: ${esc(S.teams[o].name)} gets one answer</span><button class="go wide" onclick="A.steal(true)">Steal worked: ${esc(S.teams[o].name)}</button><button class="go wide" onclick="A.steal(false)">Steal failed: ${esc(S.teams[S.control].name)} keeps it</button><p class="muted">If their answer is on the board, click it first.</p>`
          : (S.strikes >= 3 ? '<span class="status warn">Three strikes. Pick who was playing in step 1 to offer the steal.</span>' : '') + S.teams.map((t, i) => `<button class="go wide" onclick="A.award(${i})">Give to ${esc(t.name)}</button>`).join('')}</div></div>`;
  }

  if (ph === 'survey') {
    const v = S.survey, sub = v.st === 'ready' ? 0 : v.st === 'open' ? 1 : 2;
    h += `<div class="one card"><div class="steps">${['1 Pick the question', '2 Collect answers', '3 Check the tally'].map((s, i) => `<span class="${i === sub ? 'cur' : ''}">${s}</span>`).join('')}</div>` + (v.st === 'ready' ? `
      <div class="row"><select onchange="A.sq(this.value)" style="flex:1;min-width:0;padding:6px">${G.room.map(q => `<option ${q === v.q ? 'selected' : ''}>${esc(q)}</option>`).join('')}</select></div>
      <div class="row"><input class="wide" id="sq" value="${esc(v.q)}" oninput="A.sq(this.value)" aria-label="Survey question"><button class="go big" onclick="A.sopen()">Open the survey</button></div>
      <p class="muted">Pick one or type your own. Everyone with a phone can answer, players included. The big screen shows the QR code now.</p>
      <p id="phonesBox" class="muted">${phonesHtml()}</p>`
    : v.st === 'open' ? `<div class="qtext">${esc(v.q)}</div><div class="row" style="margin-top:12px"><span class="bigtxt"><span id="scount">${v.count}</span> answers in</span><span style="flex:1"></span>
      <button class="go big" onclick="A.sclose()">Close and count</button></div><p class="muted">Give it about a minute; thinking music helps. A board needs at least 3 different answers.</p>`
    : busy || !v.groups ? `<div class="qtext">${esc(v.q)}</div><p class="bigtxt">Counting ${v.count} answers...</p>`
    : `<div class="qtext">${esc(v.q)}</div><p class="muted">Nothing is on the big screen yet. Fix labels, use Merge up for answers that mean the same thing, remove anything unsuitable. The top 6 become the board.</p>
      <div class="grp">${v.groups.map((g, i) => `<div class="row"><input class="t" maxlength="24" value="${esc(g.label)}" oninput="A.sedit(${i},'label',this.value)" aria-label="Answer ${i+1}"><input class="p" type="number" min="0" value="${g.count}" oninput="A.sedit(${i},'count',this.value)" aria-label="Count ${i+1}"><span class="muted">people</span>${i ? `<button onclick="A.smerge(${i})" title="Add this count to the row above">Merge up</button>` : ''}<button onclick="A.sdel(${i})">Remove</button></div>`).join('')}</div>
      <div class="row"><button onclick="A.sadd()">Add a row</button><button onclick="A.sreopen()">Reopen the survey</button><span style="flex:1"></span><button class="go big" onclick="A.splay()">Put it on the board</button></div>
      ${note ? `<span class="status warn">${esc(note)}</span>` : ''}`) + '</div>';
  }

  if (ph === 'lightning') {
    const set = G.lightning[S.li], total = ltotal(), st = A.lstep();
    const cell = (p, i) => { const c = S.la[p][i]; return `<td style="white-space:nowrap" class="${S.lp === p ? 'act' : ''}"><input class="t ${p === 1 && isDup(i) ? 'dup' : ''}" id="lt${p}${i}" value="${esc(c.t)}" placeholder="what they said" onfocus="A.lq(${i})" oninput="A.ltext(${p},${i},this.value)" onchange="A.ldup(${p},${i},this)" onkeydown="if(event.key==='Enter')A.lgo(${p},${i})"> <input class="p" type="number" value="${c.p}" oninput="A.lpts(${p},${i},this.value)" aria-label="points">
      <span class="muted">${c.sp ? '&#10003;&#10003;' : c.st ? '&#10003;' : ''}</span></td>`; };
    h += `<div class="three even"><div class="card"><h2><b>1</b>Type the answers</h2>
        <div class="row"><button class="${S.lp===0?'on':''}" onclick="A.lplayer(0)">${esc(S.teams[0].name)}</button><button class="${S.lp===1?'on':''}" onclick="A.lplayer(1)">${esc(S.teams[1].name)}</button><span class="bigtxt" id="tm" style="margin-left:auto">${S.timer}s</span></div>
        <div class="row"><button class="go" onclick="A.tstart()">Start clock</button><button onclick="A.tstop()">Stop</button><button onclick="A.treset()">Reset</button></div></div>
      <div class="card"><h2><b>2</b>Score, then reveal</h2>
        <button class="go big wide" style="margin-top:0" onclick="A.lnext()" ${st ? '' : 'disabled'}>${st ? 'Reveal ' + (st[2] === 'st' ? 'answer ' : 'points ') + (st[1] + 1) + ' for ' + esc(S.teams[st[0]].name) : S.lp === 0 && S.la[0].every(c => c.sp) ? 'Now switch to ' + esc(S.teams[1].name) : 'All revealed'} <kbd>Space</kbd></button>
        <p class="muted">Click a chip under a question to set the points first. No match means 0. Points go to that player's team as they are revealed.</p></div>
      <div class="card"><h2><b>3</b>Target ${G.lightningTarget}</h2><div class="pot">${total}<small>${esc(G.finalStakes || '')}</small></div></div></div>
      <div class="card" style="margin-top:12px"><table class="l"><tr><th>Question <select onchange="A.lset(this.value)">${G.lightning.map((s, i) => `<option value="${i}" ${i===S.li?'selected':''}>${esc(s.name)}</option>`).join('')}</select></th><th class="${S.lp === 0 ? 'act' : ''}">${esc(S.teams[0].name)} player (20s) <button style="padding:0 6px" class="${S.hideP1?'on':''}" onclick="A.lhide()">${S.hideP1 ? 'hidden on screen' : 'hide on screen'}</button></th><th class="${S.lp === 1 ? 'act' : ''}">${esc(S.teams[1].name)} player (25s) <button style="padding:0 6px" onclick="A.lclear()">Clear all</button></th></tr>
        ${set.qs.map((q, i) => `<tr><td><b>${i+1}. ${esc(q.q)}</b> <button onclick="A.lread(${i})" style="padding:0 6px">Read</button>
        <div class="chips">${q.a.map((a, k) => `<button onclick="A.lfill(${i},${k})">${esc(a[0])} ${a[1]}</button>`).join('')}</div></td>${cell(0, i)}${cell(1, i)}</tr>`).join('')}</table></div>`;
  }
  app.innerHTML = h + `</div><div class="dock"><b>Chip</b><input id="chipSay" placeholder="Type a line for Chip to say on the big screen" onkeydown="if(event.key==='Enter')A.chipSay()"><button class="fun" onclick="A.chipSay()">Say it</button>
    <span class="muted">Last: <span id="chipLast">${esc(chipLast)}</span></span></div></main>`;
}
render(); push();
try { if (bc) bc.postMessage({host: '?'}); } catch (e) {}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
