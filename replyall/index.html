<!DOCTYPE html>

<title>REPLY ALL - Host screen</title>
<style>
*{box-sizing:border-box}
:root{--ink:#0a0a1f;--deep:#14123a;--violet:#6c4cff;--pink:#ff3d8b;--yellow:#ffe14d;--line:#dcd8ee;--mute:#6a6690;--bg:#f3f1fa}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--deep);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14px}
button,select,input{font:inherit}
button{border:1px solid #b9b4d6;background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--deep)}
button:hover{background:#ece8ff}
button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
button.go{background:var(--violet);color:#fff;border-color:var(--violet);font-weight:600}
button.bad{background:#e5263a;color:#fff;border-color:#e5263a;font-weight:600}
button.fun{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:600}
button.wide{display:block;width:100%;margin-top:6px}
button.big{font-size:16px;padding:10px 14px}
button:disabled{opacity:.4;cursor:default}
kbd{display:inline-block;min-width:19px;text-align:center;border:1px solid #b9b4d6;border-bottom-width:2px;border-radius:4px;font:600 11px Consolas,monospace;padding:0 3px;background:#f6f4ff;color:var(--deep)}
.muted{color:var(--mute);font-size:12.5px}
.err{background:#ffe2e5;border:2px solid #e5263a;padding:16px;margin:20px;border-radius:10px;font-size:17px}

/* shell: run of show on the left, scoreboard on top, one stage in the middle, Chip docked at the bottom */
#app{display:grid;grid-template-columns:196px 1fr;height:100vh}
nav{background:var(--ink);color:#fff8ea;display:flex;flex-direction:column;padding:12px 10px;gap:3px;overflow:auto}
nav h1{font-size:18px;margin:0 4px 2px;letter-spacing:.02em}
nav .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8f8ab8;margin:10px 4px 3px}
nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border-color:transparent;color:#d9d6f0;padding:6px 8px}
nav button:hover{background:#1d1b47}
nav button i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #6f6a9c;font:600 11px/17px "Segoe UI",sans-serif;text-align:center;font-style:normal}
nav button.done i{background:#3b3870;border-color:#3b3870;color:#b9b5dc}
nav button.cur{background:var(--yellow);color:var(--ink);font-weight:700}
nav button.cur i{border-color:var(--ink)}
nav button.sub{padding-left:36px;font-size:12.5px;color:#a5a1cc}
nav select{width:100%;background:#1d1b47;color:#d9d6f0;border:1px solid #3b3870;border-radius:8px;padding:5px;font-size:12.5px}
nav .grow{flex:1}
nav button.util{border-color:#3b3870;justify-content:center}
nav button.util.live{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:600}
nav button.util.need{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
nav button.util.on{background:var(--yellow);color:var(--ink)}
#gagMenu{position:fixed;z-index:50;width:292px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 34px rgba(10,10,31,.28);display:none;max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain}
#gagMenu.on{display:block}
#gagMenu .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:4px 8px 5px}
#gagMenu button{display:block;width:100%;text-align:left;border-color:transparent;padding:5px 8px;line-height:1.25}
#gagMenu button b{display:block;font-weight:600}
#gagMenu button span{display:block;font-size:12px;color:var(--mute)}
#gagMenu button.fun{margin-top:4px;text-align:center}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.tm.r{flex-direction:row-reverse}
.tm.floor{border-color:var(--violet);background:#f3f0ff}
.tm input.nm{flex:1;min-width:0;font-weight:600;font-size:15px;border:0;background:transparent;padding:4px}
.tm.r input.nm{text-align:right}
.tm input.sc{width:86px;font-size:24px;font-weight:700;text-align:center;border:1px solid var(--line);border-radius:8px;padding:2px}
.mid{text-align:center;min-width:250px}
.mid .where{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:4px}
.mid button.next{font-size:16px;padding:9px 22px}
.stage{flex:1;overflow:auto;padding:12px 14px}
.three{display:grid;grid-template-columns:236px 1fr 236px;gap:12px;align-items:start}
.three.even{grid-template-columns:1fr 1fr 1fr}
.one{max-width:820px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card>h2{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 10px}
.card>h2 b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--deep);color:#fff;font:700 12px/22px "Segoe UI",sans-serif;text-align:center;letter-spacing:0}
.card p{margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row+.row{margin-top:8px}
.vol{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.vol input{flex:1;min-width:0;accent-color:var(--violet)}

.status{display:block;text-align:center;font-weight:700;padding:6px 9px;border-radius:8px;background:#f1eff8;margin-top:8px}
.status.hot{background:var(--pink);color:#fff}

.qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qtext{flex:1;font-size:19px;font-weight:600;line-height:1.2}
.ans{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:6px;margin-bottom:12px}
.ans button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;padding:5px 9px}
.ans button small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.ans button.done{background:#e6e3f2;color:#8582a3}
.ans button.done span>u{text-decoration:line-through}
.ans button span>u{text-decoration:none}
.strike{display:flex;gap:8px;align-items:center}
.strike input{flex:1;min-width:0;padding:7px}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:22px;border-radius:5px;border:2px solid #d4b9be;font:800 13px/18px "Segoe UI",sans-serif;text-align:center;color:transparent;font-style:normal}
.pips i.on{background:#e5263a;border-color:#e5263a;color:#fff}
details{margin-top:10px}details summary{cursor:pointer;color:var(--mute);font-size:12.5px}
details .row{margin-top:8px}
.pot{font-size:44px;font-weight:800;line-height:1;text-align:center}
.pot small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
#roastBox:not(:empty){margin-top:10px;padding:8px 10px;border:2px dashed var(--pink);border-radius:8px;background:#fff0f6}
.plist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:150px;overflow:auto}
.plist label{border:1px solid #b9b4d6;border-radius:6px;padding:2px 7px;background:#fff3c4}
.plist label.ok{background:#dff5e7;border-color:#1f9d55}
.code{font:800 34px Consolas,monospace;letter-spacing:.12em;text-align:center}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;text-align:center;padding:5px;border-radius:99px;background:#f1eff8;color:var(--mute);font-size:12.5px}
.steps span.cur{background:var(--deep);color:#fff;font-weight:600}
.grp .row{flex-wrap:nowrap}.grp input.t{flex:1;padding:5px}.grp input.p{width:64px;padding:5px;text-align:center}
.bigtxt{font-size:26px;font-weight:700}
input.wide{flex:1;min-width:200px;padding:7px}
table.l{width:100%;border-collapse:collapse;margin-top:10px}
table.l th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:left;padding:4px}
table.l td{padding:5px 4px;border-top:1px solid #e8e5f3;vertical-align:top}
table.l td.act,table.l th.act{background:#f3f0ff}
table.l input.t{width:150px;padding:4px}table.l input.p{width:52px;padding:4px;text-align:center}
table.l input.dup{border:2px solid #e5263a;background:#ffe2e5}
.chips button{padding:1px 6px;font-size:12px;margin:2px 2px 0 0}
.dock{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--deep);color:#fff8ea}
.dock input{flex:1;min-width:120px;padding:6px;border-radius:8px;border:0}
.dock .muted{color:#b9b5dc;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chipLast{font-style:italic}
.reh{display:flex;gap:10px;align-items:center;padding:5px 14px;background:var(--yellow);color:var(--ink);font-size:13px}
.reh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reh button{padding:2px 14px;font-weight:600;border-color:var(--ink)}

:root{--ink:#04140c;--deep:#0b2418;--violet:#f96302;--pink:#f96302;--yellow:#ffc93c;--line:#e4dccb;--mute:#6b7a70;--bg:#0a2216;--cream:#f6f1e6;--orange:#f96302;--green:#1f7a4a}

.coach{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,201,60,.16),rgba(255,201,60,.04));border:1px solid rgba(255,201,60,.35);color:#fff6dd;font-size:15px;font-weight:500}

<body>
<div id="phoneGate" style="display:none;position:fixed;inset:0;z-index:99999;background:#04140c;color:#f3e9d2;font:500 17px/1.4 system-ui,sans-serif;padding:32px 22px;flex-direction:column;justify-content:center;gap:16px;text-align:center">
  <div style="font:400 40px/1 'Kaushan Script',cursive;color:#f3e9d2">Reply <span style="color:#f96302">All</span></div>
  <p style="margin:0">This is the host's control panel. It is built for a laptop.</p>
  <p style="margin:0;color:#a8bfb0">Playing along? Open the player page and type the code from the big screen.</p>
  <a href="buzz/" style="display:block;padding:16px;border-radius:14px;background:#f96302;color:#fff;font-weight:800;font-size:19px;text-decoration:none">Join the game</a>
  <button onclick="document.getElementById('phoneGate').style.display='none';document.documentElement.classList.remove('gated')" style="padding:14px;border-radius:14px;border:1px solid rgba(243,233,210,.4);background:transparent;color:#f3e9d2;font:inherit">I am the host, stay here</button>
</div>
<style>html.gated body>*:not(#phoneGate){display:none!important}</style><script>if (screen.width <= 700 && matchMedia('(pointer:coarse)').matches) { document.documentElement.classList.add('gated'); document.getElementById('phoneGate').style.display = 'flex'; }</script>

<script>
const G = window.GAME, app = document.getElementById('app'), KEY = 'replyall_state_v3';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE = m => m === 3 ? 'Bonus season: triple budget' : m === 2 ? 'Q4 crunch: double budget' : 'Regular business';
// strike stamps escalate like an email thread going wrong: polite, then pointed, then on the record
const STAMPS = [['NOTED.', 'PARKING LOT', 'NOT IN SCOPE', 'DEPRIORITIZED', 'NOTED WITH CONCERN', 'ADDED TO BACKLOG', 'WE HEAR YOU', 'THANKS FOR SHARING'],
  ['SEE ME.', 'FLAGGED', 'CC: YOUR MANAGER', 'MOVED TO Q3', 'NEEDS ALIGNMENT', 'LOOPING IN HR', 'FOLLOW-UP SCHEDULED', 'NOT A PRIORITY'],
  ['PER MY LAST EMAIL', 'MEETING ENDED', 'INVITE DECLINED', 'ESCALATED', 'THIS COULD HAVE BEEN AN EMAIL', 'ACCESS REVOKED', 'CALENDAR CLEARED', 'REPLY ALL: DENIED']];
const WRONG = ["LET'S CIRCLE BACK", 'TAKE IT OFFLINE', 'NOT ON THE AGENDA', 'OUT OF OFFICE', 'WRONG THREAD', 'SENT TO SPAM', 'MESSAGE BOUNCED', 'AUTO-REPLY: AWAY'];
const STRIKE_SUB = ['strike 1 of 3 - gentle reminder', 'strike 2 of 3 - following up', 'strike 3 of 3 - final notice'];

// ---------- question file check ----------
function problems() {
  if (!G) return ['The file questions.js could not be read. It probably has a missing comma, quote or bracket.'];
  const out = [], bad = (a) => !Array.isArray(a) || !a.length || a.some(x => !Array.isArray(x) || typeof x[0] !== 'string' || typeof x[1] !== 'number');
  (G.rounds || []).forEach((r, i) => { if (!r.q || bad(r.a)) out.push('Main round ' + (i + 1) + ' has a broken question or answer list.'); });
  (G.lightning || []).forEach(s => { if (!s.qs || s.qs.length !== 5) out.push('Final round ' + s.name + ' must have exactly 5 questions.'); else s.qs.forEach((q, i) => { if (!q.q || bad(q.a)) out.push('Final round ' + s.name + ' question ' + (i + 1) + ' is broken.'); }); });
  if (!G.rounds || G.rounds.length < 4) out.push('There must be at least 4 main rounds.');
  if (!G.lightning || !G.lightning.length) out.push('There is no final round set.');
  if (!Array.isArray(G.room) || !G.room.length) out.push('The "room" list (You said questions) is missing or empty.');
  return out;
}
const probs = problems();
if (probs.length) { app.innerHTML = '<div class="err"><b>Question file problem.</b><br>' + probs.map(esc).join('<br>') + '<br><br>Undo the last change to questions.js (or restore your backup copy) and reload this page.</div>'; throw new Error('bad questions.js'); }
const LINES = G.chip || {};

// ---------- state ----------
const ONLINE = /^http/.test(location.protocol);
const pref = (k, d) => localStorage.getItem('replyall_' + k) || d, setPref = (k, v) => localStorage.setItem('replyall_' + k, v);
const newSid = () => Array.from({length: 4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
// The join code stays the same across reloads and new games, so a QR code people already scanned keeps working.
function sid() { let s = pref('sid', ''); if (!/^[A-Z0-9]{4}$/.test(s)) { s = newSid(); setPref('sid', s); } return s; }
const joinUrl = s => location.origin + location.pathname.replace(/[^/]*$/, '') + 'buzz/?c=' + s;
const blankLa = () => [0, 1].map(() => Array.from({length: 5}, () => ({t: '', p: 0, st: false, sp: false})));
const fresh = () => ({teams: G.teams.map(n => ({name: n, score: 0})), phase: 'title', ri: 0, useCustom: false, custom: null, revealed: [], counted: [], strikes: 0, pot: 0, awarded: false, control: null,
  buzzOpen: false, buzz: null, buzzPid: null, showQ: false, li: 0, lp: 0, la: blankLa(), lq: null, hideP1: false, timer: 20, lreset: 0, lend: null,
  items: 0, allowed: {}, pl: {}, gb: null, survey: null, rx: true, join: false, back: null, phones: ONLINE, sid: sid(), joinUrl: joinUrl(sid())});
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
let resumed = !!(S && S.teams && (S.phase !== 'title' || S.teams.some(t => t.score)));
if (!S || !S.teams || !G.rounds[S.ri] || !G.lightning[S.li]) { S = fresh(); resumed = false; }
S.buzzOpen = false; if (S.rx === undefined) S.rx = true; if (!S.pl) S.pl = {};
// The page was refreshed while the survey answers were being counted: reopen it, so Close and count can run again.
if (S.phase === 'survey' && S.survey && S.survey.st === 'closed' && !S.survey.groups) S.survey.st = 'open';
// Each game code has its own relay room, so two hosts never overwrite each other.
const room = () => 'ra-' + S.sid.toLowerCase();
const cur = () => S.useCustom && S.custom ? S.custom : G.rounds[S.ri];
let dupHost = false, win = null, tick = null, said = '', chipLast = '', pending = null, busy = false, note = '', lastAlive = 0, seq = 0, lastKid = '';

  let ms; try { s[0](); ms = typeof s[1] === 'function' ? s[1]() : s[1]; } catch (e) { console.error(e); return R.stop(); }
  if (REH) REH.t = setTimeout(rehRun, ms);
}
const R = {
  on: () => !!REH,
  start() {
    if (REH) return;
    if (!alive()) win = window.open('display.html', 'replyall_display', 'width=1280,height=720');
    if (!confirm('Plays a demo show of about 4 and a half minutes on the big screen, with sound.\n\nIt is only a rehearsal: your scores, team names, join code and phones come back exactly as they are now when it ends. You can stop it at any time.')) return;
    const old = S; clearLater(); A.tstop(); stopVoice(); SFX.stop(); gagClose();
    REH = {keep: JSON.stringify(S), hist: hist.splice(0), said, pending, note, chipLast, answers, resumed, t: null, i: 0, label: 'Lobby', msgs: [], lend: 0, steps: []};
    S = fresh(); S.teams.forEach((t, i) => t.name = old.teams[i].name); S.allowed = Object.assign({}, old.allowed); S.rx = old.rx; S.sid = old.sid; S.joinUrl = old.joinUrl;
    said = ''; pending = null; note = ''; answers = []; resumed = false; busy = false; closeN++;
    REH.steps = rehScript(); SFX.theme(); up({clear: 1}); REH.t = setTimeout(rehRun, 1500);
  },
  // Also runs when the demo reaches its end. Everything the demo started is cut off and the real game is put back.
  stop() {
    if (!REH) return; const k = REH; REH = null; clearTimeout(k.t); clearLater(); A.tstop(); stopVoice(); SFX.stop();
    S = JSON.parse(k.keep); hist.length = 0; hist.push(...k.hist); said = k.said; pending = k.pending; note = k.note; chipLast = k.chipLast; answers = k.answers; resumed = k.resumed; busy = false; armed = false;
    const m = {gag: 'stop', gseq: ++gseq}; try { if (bc) bc.postMessage(m); } catch (e) {} try { if (win && !win.closed) win.postMessage(m, '*'); } catch (e) {}
    lastState = ''; up({clear: 1});
  }
};
// Effects like the time-up horn switch the thinking music off by themselves; the button has to follow.

SFX.onThink = thinkLight;
function audLight() { const el = document.getElementById('aud'); if (!el) return; el.className = 'util ' + (alive() ? 'live' : 'need'); el.textContent = alive() ? 'Big screen connected' : 'Open big screen'; }
function phonesHtml(full) {

  const team = phones.filter(p => p.team < 2), ok = team.filter(p => S.allowed[p.p]).length, wait = team.length - ok;
  const head = `<b>${ok}</b> buzzer${ok === 1 ? '' : 's'} approved, <b>${phones.length - team.length}</b> audience${wait ? `<button class="go wide" onclick="A.allowAll()">Approve ${wait} waiting</button>` : ''}<span class="muted">${esc(phoneErr)}</span>`;
  const b = S.gb, gl = S.phase === 'round' && b && !b.banked ? `<br><b>${Object.keys(b.g).length}</b> room guess${Object.keys(b.g).length === 1 ? '' : 'es'} in, <b>${Object.values(b.g).filter(x => x[1] >= 0).length}</b> on the board. ${b.open ? 'Open until the first reveal or strike.' : 'Locked.'}` : '';
  return full ? head + gl + `<div class="plist">${team.map(p => `<label class="${S.allowed[p.p] ? 'ok' : ''}"><input type="checkbox" ${S.allowed[p.p] ? 'checked' : ''} onchange="A.allow('${p.p}',this.checked)"> ${esc(p.name || 'Phone ' + p.p.slice(0, 3))} (${esc(S.teams[p.team].name)})</label>`).join('')}</div>` : head + gl;
}
function setPhones() { const el = document.getElementById('phonesBox'); if (!el) return; const h = phonesHtml(el.dataset.full === '1'); if (el.dataset.h !== h) { el.dataset.h = h; el.innerHTML = h; } }

// Spare menu: rounds 5 and up, grouped by their pack (in file order), with the question cut short so the list stays readable.
function shortQ(q) { q = String(q || '').replace(/^Name /, ''); q = q.charAt(0).toUpperCase() + q.slice(1); if (q.length <= 52) return q; const c = q.slice(0, 50), k = c.lastIndexOf(' '); return (k > 30 ? c.slice(0, k) : c).replace(/[\s,.:;'-]+$/, '') + '...'; }

    g[1] += `<option value="${i}" title="${esc(x.q)}" ${now === 'spare' && S.ri === i ? 'selected' : ''}>${i + 1}. ${esc(shortQ(x.q))}</option>`; });

const STEPS = [['title', 'Setup', "A.phase('title')"], ['r0', 'Round 1', 'A.round(0)'], ['r1', 'Round 2', 'A.round(1)'], ['r2', 'Round 3 <span class="muted">x2</span>', 'A.round(2)'], ['you', 'You said <span class="muted">x3</span>', 'A.sprep()'], ['final', 'Final round', 'A.lstart()'], ['winner', 'Winner', 'A.winner()']];

        <label class="vol" title="Volume of the music and sound effects"><span aria-hidden="true">&#x1F50A;</span> Volume <input type="range" min="0" max="100" step="5" value="${Math.round(SFX.volume() * 100)}" oninput="setVol(this.value)" aria-label="Volume"><b id="volPct">${Math.round(SFX.volume() * 100)}%</b></label>
        <p><label>Voice <select onchange="setPref('voice',this.value)" style="max-width:100%"><option value="">Best available</option>${voices.map(v => `<option ${v.name===vsel?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label></p>

        <div class="ans" style="grid-template-rows:repeat(${Math.ceil(r.a.length / 2)},auto)">${r.a.map((a, i) => `<button class="${S.revealed[i]?'done':''}" onclick="A.reveal(${i})" title="${S.revealed[i] ? 'Click to hide again' : 'Click to reveal'}"><span><kbd>${i+1}</kbd> <u>${esc(a[0])}</u>${a[2] ? `<small>also: ${esc(a[2])}</small>` : ''}</span><b>${a[1]}</b></button>`).join('')}</div>

      <div class="card"><h2><b>2</b>Score, then reveal</h2>
        <button class="go big wide" style="margin-top:0" onclick="A.lnext()" ${st ? '' : 'disabled'}>${st ? 'Reveal ' + (st[2] === 'st' ? 'answer ' : 'points ') + (st[1] + 1) + ' for ' + esc(S.teams[st[0]].name) : S.lp === 0 && S.la[0].every(c => c.sp) ? 'Now switch to ' + esc(S.teams[1].name) : 'All revealed'} <kbd>Space</kbd></button>
        <p class="muted">Click a chip under a question to set the points first. No match means 0. Points go to that player's team as they are revealed.</p></div>
      <div class="card"><h2><b>3</b>Target ${G.lightningTarget}</h2><div class="pot">${total}<small>${esc(G.finalStakes || '')}</small></div></div></div>
      <div class="card" style="margin-top:12px"><table class="l"><tr><th>Question <select onchange="A.lset(this.value)">${G.lightning.map((s, i) => `<option value="${i}" ${i===S.li?'selected':''}>${esc(s.name)}</option>`).join('')}</select></th><th class="${S.lp === 0 ? 'act' : ''}">${esc(S.teams[0].name)} player (20s) <button style="padding:0 6px" class="${S.hideP1?'on':''}" onclick="A.lhide()">${S.hideP1 ? 'hidden on screen' : 'hide on screen'}</button></th><th class="${S.lp === 1 ? 'act' : ''}">${esc(S.teams[1].name)} player (25s) <button style="padding:0 6px" onclick="A.lclear()">Clear all</button></th></tr>
        ${set.qs.map((q, i) => `<tr><td><b>${i+1}. ${esc(q.q)}</b> <button onclick="A.lread(${i})" style="padding:0 6px">Read</button>
        <div class="chips">${q.a.map((a, k) => `<button onclick="A.lfill(${i},${k})">${esc(a[0])} ${a[1]}</button>`).join('')}</div></td>${cell(0, i)}${cell(1, i)}</tr>`).join('')}</table></div>`;
  }
  app.innerHTML = h + `</div><div class="dock"><b>Chip</b><input id="chipSay" placeholder="Type a line for Chip to say on the big screen" onkeydown="if(event.key==='Enter')A.chipSay()"><button class="fun" onclick="A.chipSay()">Say it</button>
    <span class="muted">Last: <span id="chipLast">${esc(chipLast)}</span></span></div></main>`;
}
render(); push();
