<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>REPLY ALL - Host screen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1eff8;color:#14123a;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:15px}
header{background:#0a0a1f;color:#fff8ea;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:2}
header h1{font-size:20px;margin:0 16px 0 0;letter-spacing:.02em}
main{max-width:1120px;margin:0 auto;padding:14px 16px 60px}
button,select,input{font:inherit}
button{border:1px solid #a9a4c8;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#ece8ff}
button.on{background:#14123a;color:#fff;border-color:#14123a}
header button.on{background:#ffe14d;color:#0a0a1f;border-color:#ffe14d;font-weight:700}
button.go{background:#6c4cff;color:#fff;border-color:#6c4cff;font-weight:600}
button.bad{background:#e5263a;color:#fff;border-color:#e5263a;font-weight:600}
button.fun{background:#ff3d8b;color:#fff;border-color:#ff3d8b;font-weight:600}
button:disabled{opacity:.4;cursor:default}
.card{background:#fff;border:1px solid #dcd8ee;border-radius:12px;padding:12px 14px;margin-top:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#6a6690;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scores input.nm{width:60%;font-weight:600;padding:6px}
.scores input.sc{width:90px;font-size:22px;font-weight:700;text-align:center;padding:4px}
.qtext{font-size:22px;font-weight:600;margin:6px 0 10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ans button{text-align:left;display:flex;justify-content:space-between;gap:10px;font-size:16px}
.ans button.done{background:#e6e3f2;color:#8582a3;text-decoration:line-through}
.status{font-weight:700;padding:4px 10px;border-radius:6px;background:#fff3c4}
.status.hot{background:#ff3d8b;color:#fff}
.muted{color:#6a6690;font-size:13px}
.err{background:#ffe2e5;border:2px solid #e5263a;padding:16px;margin:20px;border-radius:10px;font-size:17px}
table.l{width:100%;border-collapse:collapse}
table.l td{padding:6px 4px;border-top:1px solid #e8e5f3;vertical-align:top}
table.l input.t{width:150px;padding:5px}table.l input.p{width:56px;padding:5px;text-align:center}
.chips button{padding:3px 8px;font-size:13px;margin:2px 2px 0 0}
.big{font-size:26px;font-weight:700}
input.wide{flex:1;min-width:220px;padding:7px}
.chipbar{background:#14123a;color:#fff8ea;border-color:#14123a}
.chipbar h2{color:#2de2e6}.chipbar .muted{color:#b9b5dc}
#chipLast{font-style:italic}
</style>
<script src="questions.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const G = window.GAME, app = document.getElementById('app'), KEY = 'replyall_state_v1', ROOM = 'replyall';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const MODE = m => m === 3 ? 'Bonus season: triple budget' : m === 2 ? 'Q4 crunch: double budget' : 'Regular business';
const STAMPS = ['NOTED.', 'SEE ME.', 'PER MY LAST EMAIL'];

// ---------- question file check ----------
function problems() {
  if (!G) return ['The file questions.js could not be read. It probably has a missing comma, quote or bracket.'];
  const out = [], bad = (a) => !Array.isArray(a) || !a.length || a.some(x => !Array.isArray(x) || typeof x[0] !== 'string' || typeof x[1] !== 'number');
  (G.rounds || []).forEach((r, i) => { if (!r.q || bad(r.a)) out.push('Main round ' + (i + 1) + ' has a broken question or answer list.'); });
  (G.lightning || []).forEach(s => { if (!s.qs || s.qs.length !== 5) out.push('Final round ' + s.name + ' must have exactly 5 questions.'); else s.qs.forEach((q, i) => { if (!q.q || bad(q.a)) out.push('Final round ' + s.name + ' question ' + (i + 1) + ' is broken.'); }); });
  if (!G.rounds || !G.rounds.length) out.push('There are no main rounds.');
  if (!G.lightning || !G.lightning.length) out.push('There is no final round set.');
  return out;
}
const probs = problems();
if (probs.length) { app.innerHTML = '<div class="err"><b>Question file problem.</b><br>' + probs.map(esc).join('<br>') + '<br><br>Undo the last change to questions.js (or restore your backup copy) and reload this page.</div>'; throw new Error('bad questions.js'); }
const LINES = G.chip || {};

// ---------- state ----------
const ONLINE = /^http/.test(location.protocol);
const blankLa = () => [0, 1].map(() => Array.from({length: 5}, () => ({t: '', p: 0, st: false, sp: false})));
const fresh = () => ({teams: G.teams.map(n => ({name: n, score: 0})), phase: 'title', ri: 0, revealed: [], strikes: 0, pot: 0, awarded: false, control: null,
  buzzOpen: false, buzz: null, showQ: false, li: 0, lp: 0, la: blankLa(), hideP1: false, timer: 20, lreset: 0,
  phones: ONLINE, sid: Math.random().toString(36).slice(2, 6).toUpperCase().replace(/[01OIL]/g, 'X'), joinUrl: location.host + location.pathname.replace(/[^/]*$/, '') + 'buzz'});
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.teams || S.ri >= G.rounds.length || S.li >= G.lightning.length) S = fresh();
S.buzzOpen = false;
let win = null, tick = null, phoneInfo = '', said = '', chipLast = '';
const pref = (k, d) => localStorage.getItem('replyall_' + k) || d, setPref = (k, v) => localStorage.setItem('replyall_' + k, v);

function push(fx) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (win && !win.closed) win.postMessage({S, fx: fx || {}}, '*'); }
function up(fx) { push(fx); render(); }

// ---------- sound (made in the browser, no files needed) ----------
let AC; const ac = () => AC = AC || new (window.AudioContext || window.webkitAudioContext)();
function tone(f, at, dur, type, vol) { try { const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at; o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(vol || .25, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.start(t); o.stop(t + dur); } catch (e) {} }
function noise(at, dur, vol) { try { const c = ac(), n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol || .3; s.connect(g); g.connect(c.destination); s.start(c.currentTime + at); } catch (e) {} }
const SFX = {
  ding() { tone(880, 0, .5); tone(1320, .08, .7); [1760, 2093, 2637].forEach((f, i) => tone(f, .18 + i * .07, .35, 'triangle', .1)); },
  top() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .5, 'triangle', .22)); tone(1568, .45, .9, 'sine', .2); },
  stamp() { noise(0, .25, .6); tone(70, 0, .45, 'sine', .7); tone(110, .02, .5, 'sawtooth', .25); },
  buzz() { tone(520, 0, .15, 'square'); tone(780, .12, .3, 'square'); },
  dup() { tone(200, 0, .15, 'square'); tone(200, .2, .15, 'square'); },
  zero() { tone(160, 0, .5, 'sawtooth', .3); },
  tick() { tone(1000, 0, .05, 'square', .08); },
  time() { tone(300, 0, .9, 'sawtooth', .3); },
  whoosh() { noise(0, .5, .25); tone(220, 0, .25, 'triangle', .15); tone(440, .2, .5, 'triangle', .2); },
  award() { [659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .1, .45, 'triangle')); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .15, .5, 'triangle')); }
};
// Hold music: a cheerful loop that plays while a team thinks.
let musicT = null, bar = 0;
const CHORDS = [[262, 330, 392, 494], [220, 262, 330, 392], [294, 349, 440, 523], [196, 247, 294, 349]];
function musicBar() { const c = CHORDS[bar++ % 4], b = .3;
  [0, 4].forEach(k => tone(c[0] / 2, k * b, .5, 'triangle', .16));
  [1.5, 3, 5.5, 7].forEach(k => c.slice(1).forEach(f => tone(f, k * b, .22, 'sine', .05)));
  [0, 2, 3, 5, 6].forEach((k, i) => tone(c[(i * 3) % 4] * 2, k * b, .28, 'sine', .07));
}
function music(on) { clearInterval(musicT); musicT = null; if (on) { ac(); bar = 0; musicBar(); musicT = setInterval(musicBar, 2400); } render(); }

// ---------- voices ----------
let current = null;
function tts(text, chipVoice) { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text), v = speechSynthesis.getVoices().find(x => x.name === pref('voice', '')); if (v) u.voice = v; u.rate = chipVoice ? 1.08 : .95; u.pitch = chipVoice ? 1.45 : 1; speechSynthesis.speak(u); }
function speak(id, text) { stopVoice(); const a = new Audio('audio/' + id + '.mp3'); current = a; const fb = () => { if (current === a) tts(text); }; a.onerror = fb; a.play().catch(fb); }
function stopVoice() { if (current) { current.pause(); current = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (S.phase === 'title') render(); };

// ---------- Chip, the AI intern ----------
// level: 'big' lines are spoken in Highlights mode; everything is spoken in Everything mode.
function chip(text, big) {
  if (!text) return; chipLast = text; push({chip: text}); const el = document.getElementById('chipLast'); if (el) el.textContent = text;
  const mode = pref('chip', 'highlights'); if (mode === 'all' || (mode === 'highlights' && big)) tts(text, true);
}
const chipLine = (k, big) => chip(pick(LINES[k] || []), big);
async function roast(answer, question) {
  const fallback = () => chipLine('strike', true);
  if (!ONLINE || !answer.trim()) return fallback();
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch('/api/quip', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question, answer}), signal: ctl.signal}); clearTimeout(t);
    const j = await r.json(); if (!r.ok || !j.text) throw 0; chip(j.text, true);
  } catch (e) { fallback(); }
}

// ---------- buzzers ----------
// Keyboard: any key on the left half = team 1, right half = team 2.
// A presenter clicker (Page Up / Page Down) = team 1. A number pad = team 2.
const LEFT = new Set('Backquote Digit1 Digit2 Digit3 Digit4 Digit5 Tab KeyQ KeyW KeyE KeyR KeyT CapsLock KeyA KeyS KeyD KeyF KeyG ShiftLeft KeyZ KeyX KeyC KeyV KeyB ControlLeft AltLeft PageUp PageDown'.split(' '));
const isRight = c => /^(Digit[6-90]|Key[YUIOPHJKLNM]|Minus|Equal|Backspace|Bracket|Backslash|Semicolon|Quote|Enter|Comma|Period|Slash|ShiftRight|ControlRight|AltRight|Arrow|Numpad)/.test(c);
function buzzIn(t) { if (!S.buzzOpen || S.phase !== 'round') return false; S.buzz = t; S.buzzOpen = false; SFX.buzz(); up(); return true; }
function buzzKey(code) { return LEFT.has(code) ? buzzIn(0) : isRight(code) ? buzzIn(1) : false; }
document.addEventListener('keydown', e => { if (S.buzzOpen && !/INPUT/.test(e.target.tagName) && buzzKey(e.code)) e.preventDefault(); });
window.addEventListener('message', e => { if (!e.data) return; if (e.data.hello) { win = e.source; push(); } if (e.data.key) buzzKey(e.data.key); });

// Phones: each phone posts to this site's relay; the host page reads the relay.
const seen = new Set(), EMOJI = {clap: '\u{1F44F}', laugh: '\u{1F602}', groan: '\u{1F62C}', fire: '\u{1F525}'}; let polling = false, first = true;
async function pollPhones(countBuzzes) {
  if (!ONLINE || polling) return; polling = true;
  try {
    const r = await fetch('/api/relay?room=' + ROOM + '&k=up&sid=' + S.sid, {cache: 'no-store'}); if (!r.ok) throw 0;
    const msgs = (await r.json()).msgs.map(m => { try { return JSON.parse(m); } catch (e) { return {}; } });
    const fresh = msgs.filter(m => m.id && !seen.has(m.id)); msgs.forEach(m => seen.add(m.id));
    const buzzes = fresh.filter(m => m.k === 'buzz').sort((a, b) => a.t - b.t), reacts = fresh.filter(m => m.k === 'react' && EMOJI[m.e]).map(m => EMOJI[m.e]);
    const joins = msgs.filter(m => m.k === 'join'), n = [0, 1, 2].map(t => joins.filter(m => m.team === t).length);
    setPhoneInfo('Phones joined: ' + S.teams[0].name + ' ' + n[0] + ', ' + S.teams[1].name + ' ' + n[1] + ', audience ' + n[2]);
    if (reacts.length && !first) push({react: reacts.slice(0, 12)});
    if (countBuzzes && buzzes.length) buzzIn(buzzes[0].team === 1 ? 1 : 0);
    first = false;
  } catch (e) { setPhoneInfo('Phones are not reachable right now. Keyboard buzzers still work.'); }
  polling = false;
}
function setPhoneInfo(s) { phoneInfo = s; const el = document.getElementById('phoneInfo'); if (el) el.textContent = s; }
let armed = false;
setInterval(() => { if (S.buzzOpen && armed) pollPhones(true); }, 300);
setInterval(() => { if (!S.buzzOpen) pollPhones(false); }, 1000);

// ---------- actions ----------
function resetRound() { Object.assign(S, {revealed: [], strikes: 0, pot: 0, awarded: false, control: null, buzzOpen: false, buzz: null, showQ: false}); said = ''; stopVoice(); }
const A = {
  open() { win = window.open('display.html', 'replyall_display', 'width=1280,height=720'); },
  phase(p) { S.phase = p; S.buzzOpen = false; if (p === 'winner') { SFX.win(); up(); setTimeout(() => chipLine('win', true), 1500); return; } up(); },
  hello() { chipLine('hello', true); },
  round(i) { i = Number(i); if (i < 0 || i >= G.rounds.length) return; S.ri = i; resetRound(); S.phase = 'round'; SFX.whoosh(); up({card: ['Agenda item ' + (i + 1), 'ROUND ' + (i + 1), MODE(G.rounds[i].mult)]}); setTimeout(() => chipLine('round'), 2500); },
  showQ() { S.showQ = !S.showQ; up(); },
  read() { const r = G.rounds[S.ri]; S.showQ = true; up(); speak(r.id, r.q); },
  async buzzOpen() { S.buzz = null; armed = false; S.buzzOpen = true; up(); await pollPhones(false); armed = true; },
  buzzClear() { S.buzz = null; S.buzzOpen = false; up(); },
  control(i) { S.control = i; S.buzz = null; up(); },
  reveal(i) { if (S.revealed[i]) return; const r = G.rounds[S.ri]; S.revealed[i] = true; if (!S.awarded) S.pot += r.a[i][1] * r.mult; (i === 0 ? SFX.top : SFX.ding)(); up(); if (!S.awarded) chipLine(i === 0 ? 'top' : 'good', i === 0); },
  said(v) { said = v; },
  strike() { if (S.strikes < 3) S.strikes++; SFX.stamp(); const a = said; said = ''; up({stamp: STAMPS[S.strikes - 1], sub: 'strike ' + S.strikes + ' of 3'}); roast(a, G.rounds[S.ri].q); },
  wrong() { SFX.stamp(); const a = said; said = ''; up({stamp: "LET'S CIRCLE BACK", sub: 'not on the board'}); if (a.trim()) roast(a, G.rounds[S.ri].q); },
  clearStrikes() { S.strikes = 0; up(); },
  takeover() { const o = S.control === null ? null : 1 - S.control; SFX.whoosh(); up({card: ['Three strikes', 'HOSTILE TAKEOVER', o === null ? 'One answer to steal the budget' : S.teams[o].name + ': one answer to steal the budget']}); setTimeout(() => chipLine('takeover', true), 2500); },
  award(i) { if (S.awarded) return; const pot = S.pot; S.teams[i].score += pot; S.awarded = true; SFX.award(); up({banner: 'Budget approved: +' + pot + ' to ' + S.teams[i].name});
    setTimeout(() => chipLine(S.strikes >= 3 && S.control !== null ? (i === S.control ? 'kept' : 'stolen') : 'award'), 900); },
  name(i, v) { S.teams[i].name = v; push(); },
  score(i, v) { S.teams[i].score = Number(v) || 0; push(); },
  newGame() { if (!confirm('Start a new game? Scores go back to zero.')) return; const names = S.teams.map(t => t.name); S = fresh(); S.teams.forEach((t, i) => t.name = names[i]); seen.clear(); first = true; up(); },
  chipSay() { const el = document.getElementById('chipSay'); if (el.value.trim()) chip(el.value.trim(), true); el.value = ''; },
  // final round
  lset(i) { S.li = Number(i); S.la = blankLa(); S.lp = 0; S.hideP1 = false; S.lreset++; A.tstop(); S.timer = 20; up(); },
  lstart() { S.phase = 'lightning'; SFX.whoosh(); up({card: ['Final round', 'THE 4:59 FRIDAY RUSH', G.lightningTarget + ' points and everybody goes home early']}); },
  lplayer(p) { S.lp = p; A.tstop(); S.timer = p ? 25 : 20; S.hideP1 = p === 1; up(); },
  lhide() { S.hideP1 = !S.hideP1; up(); },
  ltext(p, i, v) { S.la[p][i].t = v; push(); },
  lpts(p, i, v) { S.la[p][i].p = Number(v) || 0; push(); },
  lfill(i, k) { const a = G.lightning[S.li].qs[i].a[k], c = S.la[S.lp][i]; c.t = a[0]; c.p = a[1]; up(); },
  lrev(p, i, what) { const c = S.la[p][i]; c[what] = true; if (what === 'sp') (Number(c.p) > 0 ? SFX.ding : SFX.zero)(); else SFX.tick(); up(); },
  lread(i) { const q = G.lightning[S.li].qs[i]; speak(q.id, q.q); },
  tstart() { A.tstop(); tick = setInterval(() => { S.timer--; if (S.timer <= 0) { S.timer = 0; A.tstop(); SFX.time(); } else if (S.timer <= 5) SFX.tick(); push(); const el = document.getElementById('tm'); if (el) el.textContent = S.timer + 's'; }, 1000); },
  tstop() { clearInterval(tick); tick = null; },
  treset() { A.tstop(); S.timer = S.lp ? 25 : 20; up(); },
  lclear() { if (!confirm('Clear all final round answers?')) return; A.lset(S.li); }
};

// ---------- host screen ----------
function render() {
  const ph = S.phase, r = G.rounds[S.ri];
  const voices = window.speechSynthesis ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : [], vsel = pref('voice', ''), cm = pref('chip', 'highlights');
  const nav = (p, label, fn) => `<button class="${ph===p?'on':''}" onclick="${fn || "A.phase('" + p + "')"}">${label}</button>`;
  let h = `<header><h1>${esc(G.title)} / host</h1><button class="go" onclick="A.open()">Open audience screen</button>
    ${nav('title', 'Title')}${nav('round', 'Main rounds')}${nav('lightning', 'Final round', 'A.lstart()')}${nav('winner', 'Winner')}
    <span style="flex:1"></span><button class="${musicT ? 'on' : ''}" onclick="music(${musicT ? 'false' : 'true'})">${musicT ? 'Hold music is on' : 'Hold music'}</button><button onclick="A.newGame()">New game</button></header><main>
  <div class="card scores">${S.teams.map((t, i) => `<div><input class="nm" value="${esc(t.name)}" oninput="A.name(${i},this.value)" aria-label="Team ${i+1} name">
    <input class="sc" type="number" value="${t.score}" oninput="A.score(${i},this.value)" aria-label="Team ${i+1} score"></div>`).join('')}</div>
  <div class="card chipbar"><h2>Chip, the AI intern</h2><div class="row">
    <input class="wide" id="chipSay" placeholder="Type a line for Chip to say" onkeydown="if(event.key==='Enter')A.chipSay()"><button class="fun" onclick="A.chipSay()">Say it</button>
    <label class="muted">Chip speaks out loud: <select onchange="setPref('chip',this.value)"><option value="off" ${cm==='off'?'selected':''}>Never (text only)</option><option value="highlights" ${cm==='highlights'?'selected':''}>Highlights</option><option value="all" ${cm==='all'?'selected':''}>Everything</option></select></label></div>
    <p class="muted">Last line: <span id="chipLast">${esc(chipLast)}</span></p></div>`;

  if (ph === 'title' || ph === 'winner') {
    h += `<div class="card"><h2>${ph === 'title' ? 'Title screen is showing' : 'Winner screen is showing'}</h2>
      <div class="row"><button class="go" onclick="A.round(0)">Start round 1</button><button class="fun" onclick="A.hello()">Chip says hello</button>
      <label class="muted">Voice: <select onchange="setPref('voice',this.value)"><option value="">Browser default</option>${voices.map(v => `<option ${v.name===vsel?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
      <button onclick="tts('Testing, one two three')">Test voice</button><button onclick="SFX.top()">Test sound</button></div>
      <p class="muted">${S.phones ? 'Phones: players and audience open <b>' + esc(S.joinUrl) + '</b> and enter code <b>' + S.sid + '</b>. <span id="phoneInfo">' + esc(phoneInfo) + '</span>' : 'Phone buzzers, reactions and live roasts need the game opened from the website. Keyboard buzzers work anywhere.'}</p></div>`;
  }

  if (ph === 'round') {
    const buzzTxt = S.buzzOpen ? 'BUZZERS OPEN - waiting...' : S.buzz !== null ? esc(S.teams[S.buzz].name) + ' buzzed first' : 'Buzzers closed';
    h += `<div class="card"><h2>Round</h2><div class="row">
      <button onclick="A.round(${S.ri-1})" ${S.ri ? '' : 'disabled'}>Previous</button>
      <select onchange="A.round(this.value)">${G.rounds.map((x, i) => `<option value="${i}" ${i===S.ri?'selected':''}>${i+1}. (x${x.mult}) ${esc(x.q)}</option>`).join('')}</select>
      <button class="go" onclick="A.round(${S.ri+1})" ${S.ri < G.rounds.length-1 ? '' : 'disabled'}>Next round</button></div>
      <div class="qtext">${esc(r.q)} <span class="muted">${MODE(r.mult)}</span></div>
      <div class="row"><button onclick="A.read()">Read aloud</button><button onclick="stopVoice()">Stop voice</button>
      <button class="${S.showQ?'on':''}" onclick="A.showQ()">${S.showQ ? 'Question is on screen' : 'Show question on screen'}</button></div></div>
    <div class="card"><h2>1. Face-off</h2><div class="row"><button class="go" onclick="A.buzzOpen()">Open buzzers</button><button onclick="A.buzzClear()">Close / clear</button>
      <span class="status ${S.buzzOpen||S.buzz!==null?'hot':''}">${buzzTxt}</span>
      <button class="bad" onclick="A.wrong()">Wrong answer (stamp, no strike)</button></div>
      <div class="row" style="margin-top:8px">Has the floor: ${S.teams.map((t, i) => `<button class="${S.control===i?'on':''}" onclick="A.control(${i})">${esc(t.name)}</button>`).join('')}
      <span class="muted" id="phoneInfo">${esc(phoneInfo)}</span></div></div>
    <div class="card"><h2>2. Answers (click to reveal)</h2><div class="ans">${r.a.map((a, i) => `<button class="${S.revealed[i]?'done':''}" onclick="A.reveal(${i})"><span>${i+1}. ${esc(a[0])}</span><b>${a[1]}</b></button>`).join('')}</div>
      <div class="row" style="margin-top:10px"><input class="wide" value="${esc(said)}" oninput="A.said(this.value)" placeholder="Optional: type the wrong answer they gave, and Chip roasts it" onkeydown="if(event.key==='Enter')A.strike()">
      </div><div class="row" style="margin-top:8px"><button class="bad" onclick="A.strike()">Strike</button><b>${S.strikes ? 'Strikes: ' + S.strikes + ' of 3' : 'No strikes'}</b><button onclick="A.clearStrikes()">Clear strikes</button>
      <button class="fun" onclick="A.takeover()">Announce hostile takeover</button></div></div>
    <div class="card"><h2>3. Approve the budget</h2><div class="row"><span class="big">${S.pot} points</span>
      ${S.awarded ? '<span class="status">Awarded. Reveal the rest for fun, then go to the next round.</span>' : S.teams.map((t, i) => `<button class="go" onclick="A.award(${i})">Give to ${esc(t.name)}</button>`).join('')}</div>
      <p class="muted">Made a mistake? Type the correct score into the score box at the top.</p></div>`;
  }

  if (ph === 'lightning') {
    const set = G.lightning[S.li], total = S.la.flat().reduce((n, a) => n + (a.sp ? Number(a.p) || 0 : 0), 0);
    const cell = (p, i) => { const c = S.la[p][i]; return `<td><input class="t" value="${esc(c.t)}" placeholder="what they said" oninput="A.ltext(${p},${i},this.value)"> <input class="p" type="number" value="${c.p}" oninput="A.lpts(${p},${i},this.value)"><br>
      <button class="${c.st?'on':''}" onclick="A.lrev(${p},${i},'st')">Show answer</button> <button class="${c.sp?'on':''}" onclick="A.lrev(${p},${i},'sp')">Show points</button></td>`; };
    h += `<div class="card"><h2>Final round: the 4:59 Friday Rush</h2><div class="row">
      <select onchange="A.lset(this.value)">${G.lightning.map((s, i) => `<option value="${i}" ${i===S.li?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      Typing answers for: <button class="${S.lp===0?'on':''}" onclick="A.lplayer(0)">Player 1 (20s)</button><button class="${S.lp===1?'on':''}" onclick="A.lplayer(1)">Player 2 (25s)</button>
      <span class="big" id="tm">${S.timer}s</span><button class="go" onclick="A.tstart()">Start clock</button><button onclick="A.tstop()">Stop</button><button onclick="A.treset()">Reset clock</button></div>
      <div class="row" style="margin-top:8px"><button class="${S.hideP1?'on':''}" onclick="A.lhide()">${S.hideP1 ? 'Player 1 answers are hidden' : 'Hide player 1 answers'}</button>
      <button class="bad" onclick="SFX.dup()">Duplicate answer buzzer</button><span class="big">Total: ${total} / ${G.lightningTarget}</span><button onclick="A.lclear()">Clear all</button></div>
      <p class="muted">Click an answer chip to fill in the text and points for the selected player. No match = leave points at 0.</p>
      <table class="l">${set.qs.map((q, i) => `<tr><td><b>${i+1}. ${esc(q.q)}</b> <button onclick="A.lread(${i})">Read aloud</button>
        <div class="chips">${q.a.map((a, k) => `<button onclick="A.lfill(${i},${k})">${esc(a[0])} ${a[1]}</button>`).join('')}</div></td>${cell(0, i)}${cell(1, i)}</tr>`).join('')}</table></div>`;
  }
  app.innerHTML = h + '</main>';
}
render();
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
