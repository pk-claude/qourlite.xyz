<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>REPLY ALL - Host screen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1eff8;color:#14123a;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14px}
header{background:#0a0a1f;color:#fff8ea;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:2}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.02em}
main{max-width:1340px;margin:0 auto;padding:8px 12px 30px}
button,select,input{font:inherit}
button{border:1px solid #a9a4c8;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{background:#ece8ff}

header button.on{background:#ffe14d;color:#0a0a1f;border-color:#ffe14d;font-weight:700}

button.bad{background:#e5263a;color:#fff;border-color:#e5263a;font-weight:600}

.card{background:#fff;border:1px solid #dcd8ee;border-radius:10px;padding:9px 12px;margin-top:8px}

.top input.sc{width:74px;font-size:19px;font-weight:700;text-align:center;padding:2px}
.qtext{font-size:19px;font-weight:600;margin:6px 0 8px}

.status{font-weight:700;padding:3px 9px;border-radius:6px;background:#fff3c4}

.chipbar{background:#14123a;color:#fff8ea;border-color:#14123a;padding:6px 12px}
.chipbar .muted{color:#b9b5dc}

#roastBox:not(:empty){margin-top:6px;padding:6px 8px;border:2px dashed #ff3d8b;border-radius:8px;background:#fff0f6}
.plist{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;max-height:84px;overflow:auto}
.plist label{border:1px solid #a9a4c8;border-radius:6px;padding:2px 7px;background:#fff3c4}
.plist label.ok{background:#dff5e7;border-color:#1f9d55}
ol.check{margin:4px 0;padding-left:20px}ol.check li{margin:5px 0}
.grp input.t{width:210px;padding:4px}.grp input.p{width:60px;padding:4px;text-align:center}
</style>
<script src="questions.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const G = window.GAME, app = document.getElementById('app'), KEY = 'replyall_state_v3', ROOM = 'replyall';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE = m => m === 3 ? 'Bonus season: triple budget' : m === 2 ? 'Q4 crunch: double budget' : 'Regular business';
const STAMPS = ['NOTED.', 'SEE ME.', 'PER MY LAST EMAIL'];

// ---------- question file check ----------
function problems() {
  if (!G) return ['The file questions.js could not be read. It probably has a missing comma, quote or bracket.'];
  const out = [], bad = (a) => !Array.isArray(a) || !a.length || a.some(x => !Array.isArray(x) || typeof x[0] !== 'string' || typeof x[1] !== 'number');
  (G.rounds || []).forEach((r, i) => { if (!r.q || bad(r.a)) out.push('Main round ' + (i + 1) + ' has a broken question or answer list.'); });
  (G.lightning || []).forEach(s => { if (!s.qs || s.qs.length !== 5) out.push('Final round ' + s.name + ' must have exactly 5 questions.'); else s.qs.forEach((q, i) => { if (!q.q || bad(q.a)) out.push('Final round ' + s.name + ' question ' + (i + 1) + ' is broken.'); }); });
  if (!G.rounds || G.rounds.length < 4) out.push('There must be at least 4 main rounds.');
  if (!G.lightning || !G.lightning.length) out.push('There is no final round set.');
  if (!Array.isArray(G.room) || !G.room.length) out.push('The "room" list (You said questions) is missing or empty.');
  return out;
}
const probs = problems();
if (probs.length) { app.innerHTML = '<div class="err"><b>Question file problem.</b><br>' + probs.map(esc).join('<br>') + '<br><br>Undo the last change to questions.js (or restore your backup copy) and reload this page.</div>'; throw new Error('bad questions.js'); }
const LINES = G.chip || {};

// ---------- state ----------
const ONLINE = /^http/.test(location.protocol);
const pref = (k, d) => localStorage.getItem('replyall_' + k) || d, setPref = (k, v) => localStorage.setItem('replyall_' + k, v);
const newSid = () => Array.from({length: 4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');
// The join code stays the same across reloads and new games, so a QR code people already scanned keeps working.
function sid() { let s = pref('sid', ''); if (!/^[A-Z0-9]{4}$/.test(s)) { s = newSid(); setPref('sid', s); } return s; }
const joinUrl = s => location.origin + location.pathname.replace(/[^/]*$/, '') + 'buzz/?c=' + s;
const blankLa = () => [0, 1].map(() => Array.from({length: 5}, () => ({t: '', p: 0, st: false, sp: false})));
const fresh = () => ({teams: G.teams.map(n => ({name: n, score: 0})), phase: 'title', ri: 0, useCustom: false, custom: null, revealed: [], counted: [], strikes: 0, pot: 0, awarded: false, control: null,
  buzzOpen: false, buzz: null, buzzPid: null, showQ: false, li: 0, lp: 0, la: blankLa(), lq: null, hideP1: false, timer: 20, lreset: 0, lend: null,
  items: 0, allowed: {}, survey: null, phones: ONLINE, sid: sid(), joinUrl: joinUrl(sid())});
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.teams || !G.rounds[S.ri] || !G.lightning[S.li]) S = fresh();
S.buzzOpen = false;
const cur = () => S.useCustom && S.custom ? S.custom : G.rounds[S.ri];
let win = null, tick = null, said = '', chipLast = '', pending = null, busy = false, note = '', lastAlive = 0, seq = 0;
let phones = [], answers = [], phoneErr = '';

// ---------- link to the audience screen ----------
// Every update goes out twice: on a broadcast channel (survives a refresh of either window) and straight to the window this page opened.
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('replyall') : null;
function push(fx) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  seq = Math.max(seq + 1, Date.now()); const m = {S, fx: fx || {}, seq};
  try { if (bc) bc.postMessage(m); } catch (e) {} try { if (win && !win.closed) win.postMessage(m, '*'); } catch (e) {}
  postState();
}
function up(fx) { push(fx); render(); }
function fromScreen(d, src) {
  if (!d || d.S) return;
  if (d.hello || d.alive) { const was = alive(); lastAlive = Date.now(); if (d.hello) { if (src) win = src; push(); } if (!was) audLight(); }
  if (d.key && S.buzzOpen) buzzKey(d.key);
}
if (bc) bc.onmessage = e => fromScreen(e.data);
window.addEventListener('message', e => fromScreen(e.data, e.source));
const alive = () => Date.now() - lastAlive < 5000;
function audLight() { const el = document.getElementById('aud'); if (!el) return; el.className = alive() ? 'live' : 'go'; el.textContent = alive() ? 'Audience screen: connected' : 'Open audience screen'; }
setInterval(audLight, 1000);

// ---------- undo ----------
const hist = [], timers = [];
function snap() { hist.push(JSON.stringify(S)); if (hist.length > 60) hist.shift(); }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearLater() { timers.splice(0).forEach(clearTimeout); }

// ---------- sound (made in the browser, no files needed) ----------
let AC; const ac = () => AC = AC || new (window.AudioContext || window.webkitAudioContext)();
function tone(f, at, dur, type, vol) { try { const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at; o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(vol || .25, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.start(t); o.stop(t + dur); } catch (e) {} }
function noise(at, dur, vol) { try { const c = ac(), n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol || .3; s.connect(g); g.connect(c.destination); s.start(c.currentTime + at); } catch (e) {} }
const SFX = {
  ding() { tone(880, 0, .5); tone(1320, .08, .7); [1760, 2093, 2637].forEach((f, i) => tone(f, .18 + i * .07, .35, 'triangle', .1)); },
  top() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .5, 'triangle', .22)); tone(1568, .45, .9, 'sine', .2); },
  stamp() { noise(0, .25, .6); tone(70, 0, .45, 'sine', .7); tone(110, .02, .5, 'sawtooth', .25); },
  buzz() { tone(520, 0, .15, 'square'); tone(780, .12, .3, 'square'); },
  dup() { tone(200, 0, .15, 'square'); tone(200, .2, .15, 'square'); },
  zero() { tone(160, 0, .5, 'sawtooth', .3); },
  tick() { tone(1000, 0, .05, 'square', .08); },
  time() { tone(300, 0, .9, 'sawtooth', .3); },
  whoosh() { noise(0, .5, .25); tone(220, 0, .25, 'triangle', .15); tone(440, .2, .5, 'triangle', .2); },
  award() { [659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .1, .45, 'triangle')); },
  drum() { for (let i = 0; i < 26; i++) noise(i * .07, .07, .1 + i * .012); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .15, .5, 'triangle')); }
};
// Hold music: a cheerful loop that plays while a team thinks.
let musicT = null, bar = 0;
const CHORDS = [[262, 330, 392, 494], [220, 262, 330, 392], [294, 349, 440, 523], [196, 247, 294, 349]];
function musicBar() { const c = CHORDS[bar++ % 4], b = .3;
  [0, 4].forEach(k => tone(c[0] / 2, k * b, .5, 'triangle', .16));
  [1.5, 3, 5.5, 7].forEach(k => c.slice(1).forEach(f => tone(f, k * b, .22, 'sine', .05)));
  [0, 2, 3, 5, 6].forEach((k, i) => tone(c[(i * 3) % 4] * 2, k * b, .28, 'sine', .07));
}
function music(on) { clearInterval(musicT); musicT = null; if (on) { ac(); bar = 0; musicBar(); musicT = setInterval(musicBar, 2400); } render(); }

// ---------- voices ----------
let current = null;
function tts(text, chipVoice) { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text), v = speechSynthesis.getVoices().find(x => x.name === pref('voice', '')); if (v) u.voice = v; u.rate = chipVoice ? 1.08 : .95; u.pitch = chipVoice ? 1.45 : 1; speechSynthesis.speak(u); }
function speak(id, text) { stopVoice(); const a = new Audio('audio/' + id + '.mp3'); current = a; const fb = () => { if (current === a) tts(text); }; a.onerror = fb; a.play().catch(fb); }
function stopVoice() { if (current) { current.pause(); current = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { if (S.phase === 'title') render(); };

// ---------- Chip, the AI intern ----------
// Chip shows every line as text. He speaks out loud only for "big" lines unless the host picks Everything.
function chip(text, big) {
  if (!text) return; chipLast = text; push({chip: text}); const el = document.getElementById('chipLast'); if (el) el.textContent = text;
  const mode = pref('chip', 'highlights'); if (mode === 'all' || (mode === 'highlights' && big)) { if (window.speechSynthesis) speechSynthesis.cancel(); tts(text, true); }
}
// Lines are dealt like a shuffled deck: none repeats until its whole list has been used.
const bags = {};
function draw(k) { if (!bags[k] || !bags[k].length) bags[k] = (LINES[k] || []).slice().sort(() => Math.random() - .5); return bags[k].pop(); }
const chipLine = (k, big) => chip(draw(k), big);
// A live AI line is never sent to the big screen directly. It waits here for the scorekeeper to read and send.
const roundKey = () => S.phase + (S.useCustom ? 'you' : S.ri);
async function roast(answer, question) {
  if (!ONLINE || !answer.trim()) return; const k = roundKey();
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch('/api/quip', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({question, answer}), signal: ctl.signal}); clearTimeout(t);
    const j = await r.json(); if (!r.ok || !j.text || roundKey() !== k) return; pending = String(j.text); setRoast();
  } catch (e) {}
}
const roastHtml = () => pending ? 'Chip wrote a live line about that answer: <b>' + esc(pending) + '</b> <button class="fun" onclick="A.roastSend()">Send to screen</button> <button onclick="A.roastDrop()">Discard</button>' : '';
function setRoast() { const el = document.getElementById('roastBox'); if (el) el.innerHTML = roastHtml(); }

// ---------- buzzers ----------
// Keyboard: a letter or number key on the left half = team 1, right half = team 2.
// A presenter clicker (Page Up / Page Down) = team 1. A number pad = team 2.
const LEFT = new Set('Backquote Digit1 Digit2 Digit3 Digit4 Digit5 KeyQ KeyW KeyE KeyR KeyT KeyA KeyS KeyD KeyF KeyG KeyZ KeyX KeyC KeyV KeyB PageUp PageDown'.split(' '));
const isRight = c => /^(Digit[6-90]|Key[YUIOPHJKLNM]|Minus|Equal|Bracket|Backslash|Semicolon|Quote|Comma|Period|Slash|Arrow|Numpad(?!Enter))/.test(c);
function buzzIn(t, pid) { if (!S.buzzOpen || S.phase !== 'round') return false; S.buzz = t; S.buzzPid = pid || null; S.buzzOpen = false; SFX.buzz(); up(); return true; }
function buzzKey(code) { return LEFT.has(code) ? buzzIn(0) : isRight(code) ? buzzIn(1) : false; }
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !typing) { e.preventDefault(); return A.undo(); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.buzzOpen) { if (buzzKey(e.code)) e.preventDefault(); return; }
  if (S.phase === 'round') { const m = /^(?:Digit|Numpad)([1-8])$/.exec(e.code); if (m && cur().a[m[1] - 1] && !S.revealed[m[1] - 1]) A.reveal(m[1] - 1); else if (e.code === 'KeyX') A.strike(); }
  if (S.phase === 'lightning' && e.code === 'Space') { e.preventDefault(); A.lnext(); }
});

// Phones: each phone posts to this site's relay; this page reads the relay and posts back what phones should show.
const seen = new Set(), EMOJI = {clap: '\u{1F44F}', laugh: '\u{1F602}', groan: '\u{1F62C}', fire: '\u{1F525}'}; let polling = false, first = true, armed = false;
async function pollPhones(countBuzzes) {
  if (!ONLINE || polling) return; polling = true;
  try {
    const r = await fetch('/api/relay?room=' + ROOM + '&k=up&sid=' + S.sid, {cache: 'no-store'}); if (!r.ok) throw 0;
    const msgs = (await r.json()).msgs.map(m => { try { return JSON.parse(m); } catch (e) { return {}; } }).filter(m => m && m.id && /^[a-z0-9-]{1,32}$/i.test(m.p || ''));
    const fresh = msgs.filter(m => !seen.has(m.id)); msgs.forEach(m => seen.add(m.id));
    const now = Date.now();
    phones = msgs.filter(m => m.k === 'join' && now - m.t < 8 * 3600e3).map(m => ({p: m.p, team: m.team === 0 || m.team === 1 ? m.team : 2, name: String(m.name || '').slice(0, 14)})).sort((a, b) => a.team - b.team || a.name.localeCompare(b.name));
    const reacts = fresh.filter(m => m.k === 'react' && EMOJI[m.e]).map(m => EMOJI[m.e]);
    if (reacts.length && !first) push({react: reacts.slice(0, 12)});
    if (S.survey && S.survey.st === 'open') { answers = msgs.filter(m => m.k === 'ans' && m.q === S.survey.n && typeof m.a === 'string' && m.a.trim()).map(m => m.a.trim().slice(0, 30));
      if (answers.length !== S.survey.count) { S.survey.count = answers.length; push(); const el = document.getElementById('scount'); if (el) el.textContent = answers.length; } }
    // Only phones the scorekeeper approved can buzz.
    if (countBuzzes) { const b = fresh.filter(m => m.k === 'buzz' && S.allowed[m.p] && (m.team === 0 || m.team === 1)).sort((a, b) => a.t - b.t)[0]; if (b) buzzIn(b.team, b.p); }
    first = false; phoneErr = '';
  } catch (e) { phoneErr = ' Phones are not reachable right now. Keyboard buzzers still work.'; }
  polling = false; setPhones();
}
function phonesHtml() {
  if (!ONLINE) return '<span class="muted">Phones (buzzers, reactions, the You said round, live AI lines) need the game opened from the website. Keyboard buzzers work anywhere.</span>';
  const team = phones.filter(p => p.team < 2), wait = team.filter(p => !S.allowed[p.p]).length;
  return `Phones: <b>${team.length}</b> buzzers, <b>${phones.length - team.length}</b> audience. ${wait ? `<button class="go" onclick="A.allowAll()">Approve all ${wait} waiting</button>` : ''}<span class="muted">${esc(phoneErr)}</span>
    <div class="plist">${team.map(p => `<label class="${S.allowed[p.p] ? 'ok' : ''}"><input type="checkbox" ${S.allowed[p.p] ? 'checked' : ''} onchange="A.allow('${p.p}',this.checked)"> ${esc(p.name || 'Phone ' + p.p.slice(0, 3))} (${esc(S.teams[p.team].name)})</label>`).join('')}</div>`;
}
function setPhones() { const el = document.getElementById('phonesBox'), h = phonesHtml(); if (el && el.dataset.h !== h) { el.dataset.h = h; el.innerHTML = h; } }
let lastState = '';
function postState() {
  if (!ONLINE) return;
  const st = {sid: S.sid, names: S.teams.map(t => t.name), open: S.buzzOpen, buzz: S.buzz, first: S.buzzPid, ok: Object.keys(S.allowed).filter(k => S.allowed[k]), survey: S.survey && S.survey.st === 'open' ? {n: S.survey.n, q: S.survey.q} : null};
  const j = JSON.stringify(st); if (j === lastState) return; lastState = j;
  fetch('/api/relay?room=' + ROOM + '&k=state', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(Object.assign({id: 's' + Date.now()}, st))}).catch(() => { lastState = ''; });
}
setInterval(() => { if (S.buzzOpen && armed) pollPhones(true); }, 300);
setInterval(() => { if (!S.buzzOpen) pollPhones(false); }, 1000);
setInterval(() => { lastState = ''; postState(); }, 30000);

// ---------- the "You said" round: turn the room's answers into a board ----------
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/^(the|a|an|some|my|our) /, '').replace(/s$/, '').trim();
function localGroups(list) {
  const m = new Map(); list.forEach(a => { const k = norm(a); if (!k) return; const g = m.get(k) || {label: a.trim().replace(/\b\w/g, c => c.toUpperCase()).slice(0, 24), count: 0}; g.count++; m.set(k, g); });
  return [...m.values()].sort((a, b) => b.count - a.count).slice(0, 10);
}
async function cluster(question, list) {
  if (ONLINE && list.length >= 4) try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
    const r = await fetch('/api/quip', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({mode: 'cluster', question, answers: list}), signal: ctl.signal}); clearTimeout(t);
    const j = await r.json(); if (r.ok && Array.isArray(j.groups) && j.groups.length) return j.groups.map(g => ({label: String(g.label), count: Number(g.count) || 0}));
  } catch (e) {}
  return localGroups(list);   // no AI: exact matches only, the scorekeeper merges the rest by hand
}

// ---------- actions ----------
function resetRound() { Object.assign(S, {revealed: [], counted: [], strikes: 0, pot: 0, awarded: false, control: null, buzzOpen: false, buzz: null, buzzPid: null, showQ: false}); said = ''; pending = null; note = ''; clearLater(); stopVoice(); }
const leaveOk = () => S.phase !== 'round' || S.awarded || !S.pot || confirm("This round's budget of " + S.pot + ' has not been given to a team. Move on anyway?');
// Between rounds the audience sees the standings before the next round card.
function standings(nextMult) {
  if (S.phase !== 'round' || !S.awarded) return [];
  const [a, b] = S.teams, d = Math.abs(a.score - b.score), t = a.score < b.score ? a : b;

  if (ph === 'lightning') {
    const set = G.lightning[S.li], total = ltotal(), st = A.lstep();
    const cell = (p, i) => { const c = S.la[p][i]; return `<td class="${S.lp === p ? 'act' : ''}"><input class="t ${p === 1 && isDup(i) ? 'dup' : ''}" id="lt${p}${i}" value="${esc(c.t)}" placeholder="what they said" onfocus="A.lq(${i})" oninput="A.ltext(${p},${i},this.value)" onchange="A.ldup(${p},${i},this)" onkeydown="if(event.key==='Enter')A.lgo(${p},${i})"> <input class="p" type="number" value="${c.p}" oninput="A.lpts(${p},${i},this.value)" aria-label="points">
      <span class="muted">${c.sp ? 'shown' : c.st ? 'answer shown' : ''}</span></td>`; };
    h += `<div class="card"><div class="row"><b>Final: the 4:59 Friday Rush</b>
      <select onchange="A.lset(this.value)">${G.lightning.map((s, i) => `<option value="${i}" ${i===S.li?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      Typing for: <button class="${S.lp===0?'on':''}" onclick="A.lplayer(0)">Player 1 (20s)</button><button class="${S.lp===1?'on':''}" onclick="A.lplayer(1)">Player 2 (25s)</button>
      <span class="big" id="tm">${S.timer}s</span><button class="go" onclick="A.tstart()">Start clock</button><button onclick="A.tstop()">Stop</button><button onclick="A.treset()">Reset</button></div>
      <div class="row"><button class="go next" onclick="A.lnext()" ${st ? '' : 'disabled'}>${st ? 'Reveal next: player ' + (st[0] + 1) + ', ' + (st[2] === 'st' ? 'answer ' : 'points ') + (st[1] + 1) : S.lp === 0 && S.la[0].every(c => c.sp) ? 'Player 1 done. Switch to player 2.' : 'All revealed'} <kbd>Space</kbd></button>
      <button class="${S.hideP1?'on':''}" onclick="A.lhide()">${S.hideP1 ? 'Player 1 answers are hidden' : 'Hide player 1 answers'}</button>
      <span class="big">Total: ${total} / ${G.lightningTarget}</span><button onclick="A.lclear()">Clear all</button></div>
      <p class="muted">While the clock runs: type each answer, Enter moves down. Afterwards click the matching chip to set its points (no match = 0). A player 2 answer that repeats player 1 turns red and buzzes. The big screen shows the question for the row you are on.</p>
      <table class="l">${set.qs.map((q, i) => `<tr><td><b>${i+1}. ${esc(q.q)}</b> <button onclick="A.lread(${i})" style="padding:0 6px">Read</button>
        <div class="chips">${q.a.map((a, k) => `<button onclick="A.lfill(${i},${k})">${esc(a[0])} ${a[1]}</button>`).join('')}</div></td>${cell(0, i)}${cell(1, i)}</tr>`).join('')}</table></div>`;
  }
  app.innerHTML = h + '</main>';
}
render(); push();
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
