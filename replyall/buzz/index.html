<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>REPLY ALL - Phone</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 0,#3a2a9a,#0a0a1f 65%);color:#fff8ea;font-family:"Arial Black","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center}
h1{margin:0;font-size:40px;letter-spacing:-.03em;color:#ffe14d;text-shadow:3px 3px 0 #6c4cff}
p{margin:4px 0;font-family:"Segoe UI",Arial,sans-serif}
input{font:inherit;font-size:28px;text-align:center;text-transform:uppercase;width:190px;padding:10px;border-radius:12px;border:0}
button{font:inherit;font-size:19px;border:0;border-radius:14px;padding:15px 20px;background:#2de2e6;color:#0a0a1f;width:100%;max-width:340px;touch-action:manipulation}
button.aud{background:#fff8ea}
#buzz{width:min(70vw,44vh);height:min(70vw,44vh);max-width:none;border-radius:50%;background:#ff3d8b;color:#fff;font-size:44px;box-shadow:0 12px 0 #a31450}
#buzz:active,#buzz.hit{transform:translateY(8px);box-shadow:0 4px 0 #a31450}
.rx{display:flex;gap:10px;justify-content:center}
.rx button{width:74px;height:74px;padding:0;font-size:36px;border-radius:50%;background:rgba(255,255,255,.12)}
.rx button:active{transform:scale(1.25)}
#msg{min-height:22px;color:#ffe14d;font-family:"Segoe UI",Arial,sans-serif}
.hide{display:none}
a{color:#2de2e6;font-family:"Segoe UI",Arial,sans-serif}
</style>
</head>
<body>
<h1>REPLY ALL</h1>
<div id="join">
  <p>Enter the code from the big screen</p>
  <p><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters"></p>
  <p><button onclick="join(0)">I play for team 1 (left)</button></p>
  <p><button onclick="join(1)">I play for team 2 (right)</button></p>
  <p><button class="aud" onclick="join(2)">I am in the audience</button></p>
</div>
<div id="play" class="hide">
  <p id="who"></p>
  <button id="buzz">BUZZ</button>
  <p>React on the big screen:</p>
  <div class="rx">
    <button onclick="react('clap')">&#x1F44F;</button><button onclick="react('laugh')">&#x1F602;</button><button onclick="react('groan')">&#x1F62C;</button><button onclick="react('fire')">&#x1F525;</button>
  </div>
  <p><a href="">Change team or code</a></p>
</div>
<div id="msg"></div>
<script>
const pid = Math.random().toString(36).slice(2, 10), msg = document.getElementById('msg'), b = document.getElementById('buzz');
let sid = '', team = 0, n = 0, lastReact = 0;
function send(k, extra) {
  return fetch('/api/relay?room=replyall&k=up', {method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify(Object.assign({id: pid + '-' + k + '-' + (n++), sid, p: pid, k, team, t: Date.now()}, extra || {}))}).then(r => { if (!r.ok) throw 0; });
}
function join(t) {
  sid = document.getElementById('code').value.trim().toUpperCase(); team = t;
  if (!/^[A-Z0-9]{4}$/.test(sid)) { msg.textContent = 'Type the 4-character code first.'; return; }
  send('join').then(() => {
    document.getElementById('join').className = 'hide'; document.getElementById('play').className = '';
    if (t === 2) b.className = 'hide';
    document.getElementById('who').textContent = (t === 2 ? 'Audience' : 'Team ' + (t + 1) + ' buzzer') + ' / game ' + sid; msg.textContent = '';
  }).catch(() => { msg.textContent = 'Could not connect. Check your signal and try again.'; });
}
function react(e) { const now = Date.now(); if (now - lastReact < 700) return; lastReact = now; send('react', {e}).catch(() => {}); }
b.addEventListener('pointerdown', () => {
  b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 300);
  send('buzz').then(() => { msg.textContent = 'Sent!'; setTimeout(() => msg.textContent = '', 1200); }).catch(() => { msg.textContent = 'Not sent. Check your signal.'; });
});
</script>
</body>
</html>
