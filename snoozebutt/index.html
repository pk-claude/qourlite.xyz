<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snooze Butt-on</title>
<style>
  :root { --beat: .4s; }
  body.alarm { --beat: .333s; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff; text-align: center; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    padding: 14px 14px 22px; position: relative; overflow-x: hidden; background: #ff8a1f;
  }
  /* colour-cycling backdrop, kept on its own layer so the dog and buttons keep their colours */
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -1;
    background: linear-gradient(160deg, #ffd9c2 0%, #ffb347 45%, #ff7a1f 100%);
  }
  body.dancing::before {
    background: linear-gradient(160deg, #7dff3a 0%, #ffd23a 35%, #ff5a2a 65%, #c93aff 100%);
    animation: hue 1.2s linear infinite;
  }
  body.alarm::before { animation-duration: .5s; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  body > *:not(.fx) { position: relative; z-index: 1; }

  /* club lights: only on while dancing */
  .fx { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; display: none; }
  .dancing .fx { display: block; }
  .beams { position: absolute; left: 50%; top: 40%; width: 300vmax; height: 300vmax; margin: -150vmax 0 0 -150vmax;
    background: repeating-conic-gradient(rgba(255,255,255,0) 0deg 13deg, rgba(255,255,255,.30) 13deg 19deg);
    animation: spin 4s linear infinite; }
  .beams.b2 { background: repeating-conic-gradient(rgba(0,0,0,0) 0deg 23deg, rgba(0,0,0,.22) 23deg 31deg); animation: spin 2.6s linear infinite reverse; }
  .laser { position: absolute; top: -6vh; width: 4px; height: 170vh; transform-origin: top center; border-radius: 2px;
    background: currentColor; box-shadow: 0 0 14px 4px currentColor; opacity: .9;
    animation: sweep var(--d) ease-in-out infinite alternate; }
  .l1 { left: 50%; color: #00f6ff; --d: calc(var(--beat) * 2);   --a: -58deg; --b: 35deg; }
  .l2 { left: 50%; color: #ff2bd6; --d: calc(var(--beat) * 3);   --a: 55deg;  --b: -30deg; }
  .l3 { left: 8%;  color: #b6ff00; --d: calc(var(--beat) * 1.5); --a: -70deg; --b: -5deg; }
  .l4 { left: 92%; color: #fff200; --d: calc(var(--beat) * 2.5); --a: 70deg;  --b: 5deg; }
  .l5 { left: 30%; color: #ffffff; --d: var(--beat);             --a: -20deg; --b: 25deg; }
  .l6 { left: 70%; color: #ff5a00; --d: calc(var(--beat) * 4);   --a: 30deg;  --b: -45deg; }
  .strobe { position: absolute; inset: 0; background: #fff; opacity: 0; animation: strobe var(--beat) linear infinite; }
  .alarm .strobe { animation-name: strobe2; animation-duration: calc(var(--beat) * 2); }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes sweep  { from { transform: rotate(var(--a)); } to { transform: rotate(var(--b)); } }
  @keyframes strobe { 0% { opacity: .5; } 20% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes strobe2 { 0% { opacity: .6; background: #fff; } 12% { opacity: 0; } 50% { opacity: .55; background: #ff0033; } 62% { opacity: 0; } 100% { opacity: 0; } }
  .dancing #stage { animation: pump var(--beat) ease-out infinite; }
  .alarm #stage { animation: pumpshake var(--beat) ease-out infinite; }
  .dancing canvas { animation: glow calc(var(--beat) * 4) steps(1) infinite; }
  .dancing h1 { animation: title var(--beat) ease-out infinite; }
  @keyframes pump { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes pumpshake { 0% { transform: scale(1.14) rotate(-4deg); } 50% { transform: scale(1.04) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes glow {
    0%  { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 34px #ff2bd6); }
    25% { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 34px #00f6ff); }
    50% { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 34px #fff200); }
    75% { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 34px #b6ff00); } }
  @keyframes title { 0% { transform: scale(1.18) rotate(-3deg); } 100% { transform: scale(1) rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) {
    body.dancing::before, .dancing #stage, .dancing h1 { animation: none; }
    .dancing .fx { display: none; }
  }

  h1 { margin: 4px 0 0; font-size: 28px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  #status { margin: 4px 0 0; font-size: 16px; font-weight: 800; min-height: 22px; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  #stage { width: min(92vw, 400px); aspect-ratio: 1 / 1; margin-top: 6px; touch-action: manipulation; cursor: pointer; }
  canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 14px rgba(0,0,0,.3)); }

  .panel { width: min(92vw, 400px); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  button, input[type=time] {
    font: inherit; font-weight: 800; font-size: 18px; height: 54px; border-radius: 16px;
    border: 3px solid #2b1500; background: #fff7ea; color: #2b1500; width: 100%;
  }
  button { cursor: pointer; box-shadow: 0 5px 0 #2b1500; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #2b1500; }
  button:disabled { opacity: .5; }
  #dance { grid-column: 1 / 3; background: #2b1500; color: #ffd28a; }
  input[type=time] { text-align: center; padding: 0 8px; }
  .armed #arm { background: #9be37f; }
  #taps { margin-top: 12px; font-size: 15px; font-weight: 800; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  #note { margin-top: 8px; font-size: 12px; max-width: 400px; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
</style>
</head>
<body>
  <div class="fx"><div class="beams"></div><div class="beams b2"></div><div class="laser l1"></div><div class="laser l2"></div><div class="laser l3"></div><div class="laser l4"></div><div class="laser l5"></div><div class="laser l6"></div><div class="strobe"></div></div>
  <h1>Wiggle Alarm</h1>
  <div id="status">Tap Dance. Tap the butt.</div>

  <div id="stage"><canvas id="cv" width="800" height="800" aria-label="Chihuahua wiggling its butt"></canvas></div>

  <div class="panel">
    <button id="dance">Dance</button>
    <input id="time" type="time" aria-label="Alarm time">
    <button id="arm">Set alarm</button>
  </div>
  <div id="taps">Butt taps: 0</div>
  <div id="note">The alarm rings only while this page stays open with the screen on and the volume up. It cannot wake a locked phone.</div>

  var NEED = 20;
  var body = document.body, $ = function (id) { return document.getElementById(id); };
  var ctx = null, master = null, noise = null, timer = null, step = 0, nextT = 0;
  var dancing = false, alarmOn = false, armedAt = null, taps = 0, lock = null;
  var tap = 0, last = 0;

  function beat() { return alarmOn ? 0.3333 : 0.4; }   // 150 BPM, 180 in alarm

  /* ---------- picture: 8 real frames played in a loop ---------- */
  var cv = $('cv'), g2 = cv.getContext('2d'), sheet = new Image(), ready = false, fpos = 0, forced = -1;
  sheet.onload = function () { ready = true; };
  sheet.src = SPRITE.src;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    // dancing: one full wiggle (8 frames) per beat. idle: slow lazy sway.
    fpos = (fpos + dt * SPRITE.n / (dancing ? beat() : 1.6)) % SPRITE.n;
    tap *= Math.pow(0.002, dt);
    if (ready) {
      var i = forced >= 0 ? forced : Math.floor(fpos), W = cv.width, H = cv.height;
      var sx = 1 + 0.10 * tap, sy = 1 - 0.08 * tap;                 // squash when smacked
      g2.clearRect(0, 0, W, H);
      if (dancing) {                                                // two backup dancers, mirrored and off-phase
        [[0.17, 1, 3], [0.83, -1, 5]].forEach(function (b) {
          var j = (i + b[2]) % SPRITE.n;
          g2.save(); g2.translate(W * b[0], H * 0.93); g2.scale(0.42 * b[1], 0.42);
          g2.drawImage(sheet, j * SPRITE.fs, 0, SPRITE.fs, SPRITE.fs, -W / 2, -H * 0.96, W, H);
          g2.restore();
        });
      }
      g2.save(); g2.translate(W / 2, H * 0.96); g2.scale(sx, sy);
      g2.drawImage(sheet, i * SPRITE.fs, 0, SPRITE.fs, SPRITE.fs, -W / 2, -H * 0.96, W, H);
      g2.restore();

  /* ---------- sound ---------- */
  function audio() {
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
        var d = noise.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  var LEAD = [880, 0, 880, 1047, 0, 880, 0, 784, 880, 0, 880, 1319, 0, 1175, 1047, 0];
